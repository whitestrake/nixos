name: Cached Tools Playground

on:
  push:
    branches: [feat/ci-optimisation]
    paths: [.github/workflows/cached-tools-playground.yml]
  workflow_dispatch:
    inputs:
      rounds:
        description: Paired reader rounds
        type: choice
        options: ['1', '3']
        default: '1'
      darwin_source_run:
        description: Existing cached-tools producer run (empty creates one candidate)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cached-tools-playground-${{ github.ref }}
  cancel-in-progress: false

env:
  FIXTURE_SHA: aed47803728f84ad1076f48223f143ecb3ccc012
  DARWIN_BASE_KEY: darwin-lifecycle-v1-34026984404-aed47803728f84ad1076f48223f143ecb3ccc012-compacted
  DARWIN_BASE_ARCHIVE_BYTES: 2051447771
  LINUX_SEED_KEY: fast-ci-playground-v2-c2f6bc94bb96d535467b2f20f81b2108ee0b2cb9-erofs

jobs:
  darwin-producer:
    if: github.event_name == 'push' || inputs.darwin_source_run == ''
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Restore frozen full snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/darwin-lifecycle/compacted/nix-root.sparsebundle
          key: ${{ env.DARWIN_BASE_KEY }}
          fail-on-cache-miss: true
      - name: Mount snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/measurements" "$RUNNER_TEMP/darwin-source"
          mv "$RUNNER_TEMP/darwin-lifecycle/compacted/nix-root.sparsebundle" \
            "$RUNNER_TEMP/darwin-source/nix-root.sparsebundle"
          echo "NIX_ROOT_IMAGE_BUNDLE=$RUNNER_TEMP/darwin-source/nix-root.sparsebundle" >> "$GITHUB_ENV"
      - uses: ./.harness/.github/actions/nix-sparsebundle-mount
        with:
          image-size: 64g
          system: aarch64-darwin
      - uses: ./.harness/.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=
      - name: Inspect existing tool roots
        run: |
          set -euo pipefail
          root=/nix/var/nix/gcroots/github-ci/aarch64-darwin
          test -x "$root/nix-fast-build/bin/nix-fast-build"
          "$root/nix-fast-build/bin/nix-fast-build" --help >/dev/null
          if [ -x "$root/cachix/bin/cachix" ]; then
            echo present > "$RUNNER_TEMP/measurements/preexisting-cachix-root.txt"
          else
            echo absent > "$RUNNER_TEMP/measurements/preexisting-cachix-root.txt"
          fi
      - name: Install Cachix through the ordinary action
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Retain and preflight the action's Cachix closure
        run: |
          set -euo pipefail
          cachix_bin="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$(command -v cachix)")"
          cachix_store="${cachix_bin%/bin/cachix}"
          test -x "$cachix_store/bin/cachix"
          "$cachix_store/bin/cachix" --version | tee "$RUNNER_TEMP/measurements/cachix-version.txt"
          mkdir -p /nix/var/nix/gcroots/github-ci/aarch64-darwin
          ln -sfn "$cachix_store" /nix/var/nix/gcroots/github-ci/aarch64-darwin/cachix
          nix path-info --recursive --json "$cachix_store" > "$RUNNER_TEMP/measurements/cachix-closure.json"
          printf '%s\n' "$cachix_store" > "$RUNNER_TEMP/measurements/cachix-store-path.txt"
          nix-env --uninstall cachix
          test ! -e "$HOME/.nix-profile/bin/cachix"
          test -x /nix/var/nix/gcroots/github-ci/aarch64-darwin/cachix/bin/cachix
      - name: Clean, detach and compact the candidate
        run: |
          set -euo pipefail
          nix store gc
          sync
          sudo hdiutil detach /nix
          hdiutil compact "$NIX_ROOT_IMAGE_BUNDLE"
          du -sk "$NIX_ROOT_IMAGE_BUNDLE" | awk '{print $1 * 1024}' > "$RUNNER_TEMP/measurements/candidate-allocated-bytes.txt"
      - name: Save the single candidate
        run: echo "NIX_ROOT_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/darwin-source/nix-root.sparsebundle
          key: cached-tools-darwin-v1-${{ github.run_id }}-${{ env.FIXTURE_SHA }}-compacted
      - uses: ./.harness/.github/actions/github-cache-save-report
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key: cached-tools-darwin-v1-${{ github.run_id }}-${{ env.FIXTURE_SHA }}-compacted
          system: aarch64-darwin
      - name: Record archive growth and enforce budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="cached-tools-darwin-v1-$GITHUB_RUN_ID-$FIXTURE_SHA-compacted"
          bytes="$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$key" --limit 1 --json sizeInBytes --jq '.[0].sizeInBytes')"
          test "$bytes" -le $((3 * 1024 * 1024 * 1024))
          jq -n --arg key "$key" --argjson baseline "$DARWIN_BASE_ARCHIVE_BYTES" --argjson candidate "$bytes" \
            '{key:$key,baselineArchiveBytes:$baseline,candidateArchiveBytes:$candidate,growthBytes:($candidate-$baseline)}' \
            > "$RUNNER_TEMP/measurements/cache-archive.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cached-tools-darwin-producer
          path: ${{ runner.temp }}/measurements

  darwin:
    needs: darwin-producer
    if: ${{ always() && (needs.darwin-producer.result == 'success' || (inputs.darwin_source_run != '' && needs.darwin-producer.result == 'skipped')) }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: ${{ fromJSON(inputs.rounds == '3' && '[1,2,3]' || '[1]') }}
        treatment: [baseline-ordinary, candidate-ordinary, candidate-cached, candidate-bad-fallback]
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Start timing
        env:
          TREATMENT: ${{ matrix.treatment }}
        run: |
          mkdir -p "$RUNNER_TEMP/measurements"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/setup-start.txt"
          if [ "$TREATMENT" = baseline-ordinary ]; then
            bundle="$RUNNER_TEMP/darwin-lifecycle/compacted/nix-root.sparsebundle"
          else
            bundle="$RUNNER_TEMP/darwin-source/nix-root.sparsebundle"
          fi
          mkdir -p "$(dirname "$bundle")"
          echo "NIX_ROOT_IMAGE_BUNDLE=$bundle" >> "$GITHUB_ENV"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/restore-start.txt"
      - name: Restore original baseline
        if: matrix.treatment == 'baseline-ordinary'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/darwin-lifecycle/compacted/nix-root.sparsebundle
          key: ${{ env.DARWIN_BASE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: matrix.treatment != 'baseline-ordinary'
        with:
          path: ${{ runner.temp }}/darwin-source/nix-root.sparsebundle
          key: cached-tools-darwin-v1-${{ inputs.darwin_source_run || github.run_id }}-${{ env.FIXTURE_SHA }}-compacted
          fail-on-cache-miss: true
      - name: Finish restore timing
        run: |
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/restore-end.txt"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/mount-start.txt"
      - uses: ./.harness/.github/actions/nix-sparsebundle-mount
        with:
          image-size: 64g
          system: aarch64-darwin
      - name: Finish mount timing
        run: |
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/mount-end.txt"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/install-start.txt"
      - uses: ./.harness/.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=
      - name: Finish installer timing
        run: python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/install-end.txt"
      - name: Select usable cached Cachix
        id: cachix
        env:
          TREATMENT: ${{ matrix.treatment }}
        run: |
          set -euo pipefail
          echo "bin=" >> "$GITHUB_OUTPUT"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/cachix-start.txt"
          if command -v cachix >/dev/null; then
            echo "::error ::Cachix unexpectedly entered PATH before tool selection."
            exit 1
          fi
          if [ "$TREATMENT" = candidate-cached ]; then
            root=/nix/var/nix/gcroots/github-ci/aarch64-darwin/cachix
          elif [ "$TREATMENT" = candidate-bad-fallback ]; then
            root="$RUNNER_TEMP/bad-cachix-control"
            mkdir -p "$root/bin"
            touch "$root/bin/cachix"
          else
            echo ordinary-empty-input > "$RUNNER_TEMP/measurements/cached-selection.txt"
            exit 0
          fi
          if [ ! -e "$root" ]; then
            echo missing-root-fallback > "$RUNNER_TEMP/measurements/cached-selection.txt"
            exit 0
          fi
          bin="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$root")/bin/cachix"
          if [ ! -x "$bin" ]; then
            echo non-executable-fallback > "$RUNNER_TEMP/measurements/cached-selection.txt"
            exit 0
          fi
          if ! "$bin" --version > "$RUNNER_TEMP/measurements/cached-cachix-preflight.txt"; then
            echo failed-preflight-fallback > "$RUNNER_TEMP/measurements/cached-selection.txt"
            exit 0
          fi
          echo selected > "$RUNNER_TEMP/measurements/cached-selection.txt"
          dirname "$bin" >> "$GITHUB_PATH"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          cachixBin: ${{ steps.cachix.outputs.bin }}
      - name: Record selected Cachix
        run: |
          set -euo pipefail
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/cachix-end.txt"
          cachix_bin="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$(command -v cachix)")"
          cachix_store="${cachix_bin%/bin/cachix}"
          "$cachix_bin" --version | tee "$RUNNER_TEMP/measurements/cachix-version.txt"
          printf '%s\n' "$cachix_store" > "$RUNNER_TEMP/measurements/cachix-store-path.txt"
      - name: Build frozen Darwin fixture
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nfb=/nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build/bin/nix-fast-build
          "$nfb" --help >/dev/null
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/build-start.txt"
          python3 .harness/.github/scripts/nix_fast_build.py --publish-checks -- \
            "$nfb" --flake .#ci.darwin --systems aarch64-darwin --eval-workers 1 \
            --cachix-cache whitestrake --retries 2 \
            --result-file "$RUNNER_TEMP/measurements/results.json" -j 50
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/build-end.txt"
          jq -ce -f .harness/.github/scripts/nix-fast-build-records.jq \
            "$RUNNER_TEMP/measurements/results.json" > "$RUNNER_TEMP/measurements/records.json"
      - name: Record environment
        if: always()
        env:
          ROUND: ${{ matrix.round }}
          TREATMENT: ${{ matrix.treatment }}
          SOURCE_RUN: ${{ inputs.darwin_source_run || github.run_id }}
        run: |
          jq -n --arg fixture "$FIXTURE_SHA" --arg harness "$GITHUB_SHA" --arg round "$ROUND" \
            --arg treatment "$TREATMENT" --arg sourceRun "$SOURCE_RUN" --arg runnerImage "${ImageVersion:-unknown}" \
            --arg cpu "$(sysctl -n machdep.cpu.brand_string)" \
            '{fixture:$fixture,harness:$harness,round:$round,treatment:$treatment,sourceRun:$sourceRun,runnerImage:$runnerImage,cpu:$cpu}' \
            > "$RUNNER_TEMP/measurements/environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cached-tools-darwin-${{ matrix.round }}-${{ matrix.treatment }}
          path: ${{ runner.temp }}/measurements
      - name: Detach snapshot
        if: always()
        run: sudo hdiutil detach /nix

  linux-source-checks:
    name: Linux source checks ${{ matrix.round }} ${{ matrix.launch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: ${{ fromJSON(inputs.rounds == '3' && '[1,2,3]' || '[1]') }}
        launch: [cold, cached]
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          path: fixture
          persist-credentials: false
      - name: Start timing
        run: |
          mkdir -p "$RUNNER_TEMP/measurements"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/setup-start.txt"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: matrix.launch == 'cached'
        with:
          path: ${{ runner.temp }}/fast-ci-erofs
          key: ${{ env.LINUX_SEED_KEY }}
          fail-on-cache-miss: true
      - name: Mount frozen EROFS seed
        if: matrix.launch == 'cached'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fast-ci-erofs"
          sha256sum --check image.sha256
          jq -e '.fixture == "14a8d7657900a917560ddbe77577c0d5a1b77638"' metadata.json >/dev/null
          sudo modprobe erofs
          sudo modprobe overlay
          mkdir -p "$RUNNER_TEMP/lower" "$RUNNER_TEMP/upper" "$RUNNER_TEMP/work"
          sudo mkdir /nix
          sudo mount -t erofs -o loop,ro image "$RUNNER_TEMP/lower"
          sudo mount -t overlay overlay -o "lowerdir=$RUNNER_TEMP/lower,upperdir=$RUNNER_TEMP/upper,workdir=$RUNNER_TEMP/work" /nix
      - uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
      - name: Build source checks
        working-directory: fixture
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAUNCH: ${{ matrix.launch }}
        run: |
          set -euo pipefail
          nfb=(nix run --option builders '' --option max-jobs auto .#packages.x86_64-linux.nix-fast-build --)
          if [ "$LAUNCH" = cached ]; then
            cached="$(cat "$RUNNER_TEMP/fast-ci-erofs/nfb-path.txt")/bin/nix-fast-build"
            test -x "$cached"
            "$cached" --help >/dev/null
            nfb=("$cached")
          fi
          printf '%s\n' "${nfb[*]}" > "$RUNNER_TEMP/measurements/tool-command.txt"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/build-start.txt"
          python3 ../.github/scripts/nix_fast_build.py --publish-checks -- \
            "${nfb[@]}" --flake .#ci.x86_64-linux.checks --systems x86_64-linux \
            --eval-workers 2 --option builders '' --option max-jobs 2 --retries 2 \
            --result-file "$RUNNER_TEMP/measurements/results.json" -j 2
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/build-end.txt"
          jq -ce '[.results[] | select(.type == "BUILD" and .success) | {attr,storePath:.outputs.out}] | sort_by(.attr)' \
            "$RUNNER_TEMP/measurements/results.json" > "$RUNNER_TEMP/measurements/records.json"
          jq -e 'length == 2 and all(.[]; .storePath | type == "string" and startswith("/nix/store/"))' \
            "$RUNNER_TEMP/measurements/records.json" >/dev/null
      - name: Record environment
        if: always()
        env:
          LAUNCH: ${{ matrix.launch }}
          ROUND: ${{ matrix.round }}
        run: |
          jq -n --arg fixture "$FIXTURE_SHA" --arg harness "$GITHUB_SHA" --arg launch "$LAUNCH" \
            --arg round "$ROUND" --arg seedKey "$LINUX_SEED_KEY" --arg runnerImage "${ImageVersion:-unknown}" \
            --arg cpu "$(awk -F ': ' '/model name/ { print $2; exit }' /proc/cpuinfo)" \
            '{fixture:$fixture,harness:$harness,launch:$launch,round:$round,seedKey:$seedKey,runnerImage:$runnerImage,cpu:$cpu}' \
            > "$RUNNER_TEMP/measurements/environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cached-tools-linux-${{ matrix.round }}-${{ matrix.launch }}
          path: ${{ runner.temp }}/measurements
      - name: Unmount EROFS seed
        if: always() && matrix.launch == 'cached'
        run: |
          if mountpoint -q /nix; then sudo umount /nix; fi
          if mountpoint -q "$RUNNER_TEMP/lower"; then sudo umount "$RUNNER_TEMP/lower"; fi

  compare:
    needs: [darwin, linux-source-checks]
    if: always() && needs.darwin.result == 'success' && needs.linux-source-checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cached-tools-*-*
          path: ${{ runner.temp }}/evidence
      - name: Require matching paired outputs
        env:
          ROUNDS: ${{ inputs.rounds || '1' }}
        run: |
          set -euo pipefail
          for platform in darwin linux; do
            mapfile -d '' records < <(find "$RUNNER_TEMP/evidence" -path "*/cached-tools-$platform-*/records.json" -print0 | sort -z)
            if [ "$platform" = darwin ]; then
              expected=$((ROUNDS * 4))
            else
              expected=$((ROUNDS * 2))
            fi
            test "${#records[@]}" -eq "$expected"
            canonical="$(cat "${records[0]}")"
            for record in "${records[@]}"; do
              test "$(cat "$record")" = "$canonical"
            done
          done
          mapfile -d '' cachix_paths < <(find "$RUNNER_TEMP/evidence" -path '*/cached-tools-darwin-[0-9]-*/cachix-store-path.txt' -print0 | sort -z)
          test "${#cachix_paths[@]}" -eq $((ROUNDS * 4))
          test "$(sort -u "${cachix_paths[@]}" | wc -l)" -eq 1
          while read -r treatment expected; do
            mapfile -d '' selections < <(find "$RUNNER_TEMP/evidence" \
              -path "*/cached-tools-darwin-[0-9]-$treatment/cached-selection.txt" -print0 | sort -z)
            test "${#selections[@]}" -eq "$ROUNDS"
            for selection in "${selections[@]}"; do
              grep -qx "$expected" "$selection"
            done
          done <<'EOF'
          baseline-ordinary ordinary-empty-input
          candidate-ordinary ordinary-empty-input
          candidate-cached selected
          candidate-bad-fallback non-executable-fallback
          EOF
          echo 'Cached and ordinary tools produced identical outputs.' >> "$GITHUB_STEP_SUMMARY"
