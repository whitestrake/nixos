name: "Nixbuild YOLO"
run-name: "Nixbuild YOLO"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-nixbuild:
    name: "Evaluate Linux build matrix"
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Emit Linux build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          records="$(
            nix eval --impure --json --expr '
              let
                flake = builtins.getFlake (toString ./.);
                mkNixos = name: cfg: {
                  name = name;
                  kind = "nixosConfiguration";
                  system = cfg.pkgs.stdenv.hostPlatform.system;
                  attr = ".#nixosConfigurations.${name}.config.system.build.toplevel";
                };
              in
                builtins.attrValues (builtins.mapAttrs mkNixos (flake.nixosConfigurations or {}))
            '
          )"

          linux="$(jq -c '[.[] | select(.system | endswith("-linux"))]' <<< "$records")"

          printf 'linux=%s\n' "$linux" >> "$GITHUB_OUTPUT"
          echo "NIXBUILD_MATRIX linux=$linux"

  linux-remote-store:
    name: "Nixbuild ${{ matrix.build.name }} (${{ matrix.build.system }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    needs: eval-nixbuild
    if: ${{ needs.eval-nixbuild.outputs.linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.eval-nixbuild.outputs.linux) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Configure nixbuild.net
        uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Linux configuration in nixbuild remote store
        shell: bash
        run: |
          set -euo pipefail

          df -h
          started="$SECONDS"
          nix build \
            --accept-flake-config \
            --print-build-logs \
            --print-out-paths \
            --builders "" \
            --max-jobs 2 \
            --eval-store auto \
            --store ssh-ng://eu.nixbuild.net \
            "${{ matrix.build.attr }}"
          duration="$((SECONDS - started))"
          echo "NIXBUILD_REMOTE_STORE_BUILD_COMPLETE name=${{ matrix.build.name }} system=${{ matrix.build.system }} attr=${{ matrix.build.attr }} store=ssh-ng://eu.nixbuild.net durationSeconds=$duration"
