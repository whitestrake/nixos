name: "Linux Cache Format Benchmark"
run-name: "Linux Cache Format Benchmark"

on:
  workflow_dispatch:
    inputs:
      candidate_set:
        description: "Filesystem candidates to benchmark."
        default: "ext4-xfs"
        required: true
        type: choice
        options:
          - ext4-xfs
          - all
      retain_cache:
        description: "Save benchmark cache lanes for warm-restore follow-up runs."
        default: false
        required: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  eval-ghci:
    name: "Evaluate x86_64-linux Configurations"
    runs-on: ubuntu-24.04
    outputs:
      candidates: ${{ steps.matrix.outputs.candidates }}
      x86_64_linux: ${{ steps.matrix.outputs.x86_64_linux }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Emit x86_64-linux build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          records="$(
            nix eval --impure --json --expr '
              let
                flake = builtins.getFlake (toString ./.);
                mkNixos = name: cfg: {
                  name = name;
                  kind = "nixosConfiguration";
                  system = cfg.pkgs.stdenv.hostPlatform.system;
                  attr = ".#nixosConfigurations.${name}.config.system.build.toplevel";
                };
                nixos = builtins.attrValues (builtins.mapAttrs mkNixos (flake.nixosConfigurations or {}));
              in
                nixos
            '
          )"

          x86_64_linux="$(jq -c '[.[] | select(.system == "x86_64-linux")]' <<< "$records")"
          case "${{ inputs.candidate_set }}" in
            ext4-xfs)
              candidates='["ext4-current","xfs"]'
              ;;
            all)
              candidates='["ext4-current","ext4-tuned","xfs","btrfs"]'
              ;;
          esac

          {
            printf 'candidates=%s\n' "$candidates"
            printf 'x86_64_linux=%s\n' "$x86_64_linux"
          } >> "$GITHUB_OUTPUT"
          echo "LINUX_CACHE_FORMAT_BENCH_CANDIDATES candidates=$candidates"
          echo "LINUX_CACHE_FORMAT_BENCH_MATRIX x86_64-linux=$x86_64_linux"

  benchmark:
    name: "Benchmark ${{ matrix.candidate }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    needs: eval-ghci
    if: ${{ needs.eval-ghci.outputs.x86_64_linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.eval-ghci.outputs.candidates) }}
    env:
      BENCH_CACHE_KEY_PREFIX: bench-nix-root-x86_64-linux-${{ matrix.candidate }}-v1
      BENCH_CANDIDATE: ${{ matrix.candidate }}
      NIX_ROOT_IMAGE_SIZE: 16G
      NIX_ROOT_SYSTEM: x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare benchmark paths
        shell: bash
        run: |
          set -euo pipefail

          image_dir="$RUNNER_TEMP/linux-cache-format-bench/$BENCH_CANDIDATE"
          mkdir -p "$image_dir"

          {
            printf 'NIX_ROOT_IMAGE=%s\n' "$image_dir/nix-root.img"
            printf 'NIX_ROOT_IMAGE_ARCHIVE=%s\n' "$image_dir/nix-root.img.zst"
            printf 'BENCH_METRICS=%s\n' "$image_dir/metrics.jsonl"
          } >> "$GITHUB_ENV"

      - name: Start cache restore timer
        shell: bash
        run: echo "BENCH_CACHE_RESTORE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Restore benchmark cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/linux-cache-format-bench/${{ matrix.candidate }}/nix-root.img.zst
          key: ${{ env.BENCH_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.BENCH_CACHE_KEY_PREFIX }}-

      - name: Report cache restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail

          seconds="$(($(date +%s) - BENCH_CACHE_RESTORE_STARTED_AT))"
          bytes=0
          [ ! -s "$NIX_ROOT_IMAGE_ARCHIVE" ] || bytes="$(stat -c %s "$NIX_ROOT_IMAGE_ARCHIVE")"
          printf '{"candidate":"%s","phase":"restore","seconds":%s,"bytes":%s,"cacheHit":"%s","matchedKey":"%s"}\n' \
            "$BENCH_CANDIDATE" "$seconds" "$bytes" "${CACHE_HIT:-}" "${CACHE_MATCHED_KEY:-}" | tee -a "$BENCH_METRICS"

      - name: Mount benchmark Nix root
        shell: bash
        run: |
          set -euo pipefail

          metric() {
            printf '{"candidate":"%s","phase":"%s","seconds":%s,"bytes":%s}\n' \
              "$BENCH_CANDIDATE" "$1" "$2" "${3:-0}" | tee -a "$BENCH_METRICS"
          }

          install_started="$SECONDS"
          case "$BENCH_CANDIDATE" in
            xfs)
              command -v mkfs.xfs >/dev/null 2>&1 || sudo apt-get update
              command -v mkfs.xfs >/dev/null 2>&1 || sudo apt-get install -y xfsprogs
              ;;
            btrfs)
              command -v mkfs.btrfs >/dev/null 2>&1 || sudo apt-get update
              command -v mkfs.btrfs >/dev/null 2>&1 || sudo apt-get install -y btrfs-progs
              ;;
          esac
          metric tool-install "$((SECONDS - install_started))"

          if [ -s "$NIX_ROOT_IMAGE_ARCHIVE" ]; then
            started="$SECONDS"
            zstd --sparse -d -f "$NIX_ROOT_IMAGE_ARCHIVE" -o "$NIX_ROOT_IMAGE"
            metric decompress "$((SECONDS - started))" "$(stat -c %s "$NIX_ROOT_IMAGE_ARCHIVE")"
          else
            started="$SECONDS"
            rm -f "$NIX_ROOT_IMAGE" "$NIX_ROOT_IMAGE_ARCHIVE"
            truncate -s "$NIX_ROOT_IMAGE_SIZE" "$NIX_ROOT_IMAGE"
            case "$BENCH_CANDIDATE" in
              ext4-current)
                mkfs.ext4 -F -m 0 "$NIX_ROOT_IMAGE"
                ;;
              ext4-tuned)
                mkfs.ext4 -F -m 0 -O ^has_journal "$NIX_ROOT_IMAGE"
                ;;
              xfs)
                mkfs.xfs -f "$NIX_ROOT_IMAGE"
                ;;
              btrfs)
                mkfs.btrfs -f "$NIX_ROOT_IMAGE"
                ;;
              *)
                echo "::error ::unknown benchmark candidate: $BENCH_CANDIDATE"
                exit 1
                ;;
            esac
            metric create "$((SECONDS - started))"
          fi

          sudo mkdir -p /nix
          if mountpoint -q /nix; then
            echo "::error ::/nix is already a mountpoint."
            findmnt /nix || true
            exit 1
          fi
          if [ -n "$(sudo find /nix -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error ::/nix exists and is not empty before mounting the image."
            sudo ls -la /nix
            exit 1
          fi

          case "$BENCH_CANDIDATE" in
            ext4-current)
              mount_options=loop,discard
              fallback_options=loop
              ;;
            ext4-tuned | xfs)
              mount_options=loop,noatime,discard
              fallback_options=loop,noatime
              ;;
            btrfs)
              mount_options=loop,noatime,compress=zstd:1,discard=async
              fallback_options=loop,noatime,compress=zstd:1
              ;;
          esac

          started="$SECONDS"
          if sudo mount -o "$mount_options" "$NIX_ROOT_IMAGE" /nix; then
            mounted_options="$mount_options"
          else
            echo "LINUX_CACHE_FORMAT_BENCH_MOUNT_FALLBACK candidate=$BENCH_CANDIDATE from=$mount_options to=$fallback_options"
            sudo mount -o "$fallback_options" "$NIX_ROOT_IMAGE" /nix
            mounted_options="$fallback_options"
          fi
          metric mount "$((SECONDS - started))"
          echo "LINUX_CACHE_FORMAT_BENCH_MOUNTED candidate=$BENCH_CANDIDATE options=$mounted_options"

          sudo chown "$USER" /nix
          chmod u+rwx /nix
          df -h /nix

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Start build timer
        shell: bash
        run: echo "BENCH_BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and root GHCI lane
        uses: ./.github/actions/nix-root-build
        with:
          builds-json: ${{ needs.eval-ghci.outputs.x86_64_linux }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Report build duration
        shell: bash
        run: |
          set -euo pipefail

          seconds="$(($(date +%s) - BENCH_BUILD_STARTED_AT))"
          printf '{"candidate":"%s","phase":"build","seconds":%s,"bytes":0}\n' \
            "$BENCH_CANDIDATE" "$seconds" | tee -a "$BENCH_METRICS"

      - name: Pack benchmark Nix root
        shell: bash
        run: |
          set -euo pipefail

          metric() {
            printf '{"candidate":"%s","phase":"%s","seconds":%s,"bytes":%s}\n' \
              "$BENCH_CANDIDATE" "$1" "$2" "${3:-0}" | tee -a "$BENCH_METRICS"
          }

          df -h /nix
          sudo du -sh /nix /nix/store /nix/var/nix || true

          started="$SECONDS"
          nix store gc
          metric gc "$((SECONDS - started))"

          started="$SECONDS"
          optimise_status=0
          nix store optimise || optimise_status=$?
          metric optimise "$((SECONDS - started))"
          echo "LINUX_CACHE_FORMAT_BENCH_OPTIMISE_STATUS candidate=$BENCH_CANDIDATE status=$optimise_status"

          df -h /nix
          sudo du -sh /nix /nix/store /nix/var/nix || true
          sudo fstrim -v /nix || true

          started="$SECONDS"
          sync
          if ! sudo umount /nix; then
            echo "::error ::/nix is still busy; refusing to save a live image."
            findmnt /nix || true
            sudo fuser -vm /nix || true
            exit 1
          fi
          metric unmount "$((SECONDS - started))"

          started="$SECONDS"
          case "$BENCH_CANDIDATE" in
            ext4-current | ext4-tuned)
              fsck_status=0
              sudo e2fsck -pf "$NIX_ROOT_IMAGE" || fsck_status=$?
              [ "$fsck_status" -eq 0 ] || [ "$fsck_status" -eq 1 ]
              ;;
            xfs)
              sudo xfs_repair -n "$NIX_ROOT_IMAGE"
              ;;
            btrfs)
              sudo btrfs check --readonly "$NIX_ROOT_IMAGE"
              ;;
          esac
          metric fsck "$((SECONDS - started))"

          started="$SECONDS"
          zstd --sparse -T0 -3 -f "$NIX_ROOT_IMAGE" -o "$NIX_ROOT_IMAGE_ARCHIVE"
          metric compress "$((SECONDS - started))" "$(stat -c %s "$NIX_ROOT_IMAGE_ARCHIVE")"

          ls -lh "$NIX_ROOT_IMAGE" "$NIX_ROOT_IMAGE_ARCHIVE" || true
          du -h "$NIX_ROOT_IMAGE" "$NIX_ROOT_IMAGE_ARCHIVE" || true
          du -h --apparent-size "$NIX_ROOT_IMAGE" "$NIX_ROOT_IMAGE_ARCHIVE" || true

      - name: Start cache save timer
        if: ${{ success() && inputs.retain_cache }}
        shell: bash
        run: echo "NIX_ROOT_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Save benchmark cache
        if: ${{ success() && inputs.retain_cache }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/linux-cache-format-bench/${{ matrix.candidate }}/nix-root.img.zst
          key: ${{ env.BENCH_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report cache upload duration
        if: ${{ success() && inputs.retain_cache }}
        shell: bash
        run: |
          set -euo pipefail

          seconds="$(($(date +%s) - NIX_ROOT_CACHE_SAVE_STARTED_AT))"
          bytes=0
          [ ! -s "$NIX_ROOT_IMAGE_ARCHIVE" ] || bytes="$(stat -c %s "$NIX_ROOT_IMAGE_ARCHIVE")"
          printf '{"candidate":"%s","phase":"upload","seconds":%s,"bytes":%s}\n' \
            "$BENCH_CANDIDATE" "$seconds" "$bytes" | tee -a "$BENCH_METRICS"

      - name: Report benchmark cache save
        if: ${{ success() && inputs.retain_cache }}
        uses: ./.github/actions/github-cache-save-report
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key: ${{ env.BENCH_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Prune benchmark cache lane
        if: ${{ success() && inputs.retain_cache }}
        uses: ./.github/actions/github-cache-prune
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key-prefix: ${{ env.BENCH_CACHE_KEY_PREFIX }}
          keep-cache-key: ${{ env.BENCH_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Upload benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cache-format-bench-${{ matrix.candidate }}
          path: ${{ runner.temp }}/linux-cache-format-bench/${{ matrix.candidate }}/metrics.jsonl
          if-no-files-found: ignore

      - name: Cleanup benchmark mount
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if mountpoint -q /nix; then
            sync
            sudo umount /nix || sudo umount -l /nix
          fi
