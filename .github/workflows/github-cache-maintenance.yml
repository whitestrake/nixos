name: "GitHub Cache Maintenance"
run-name: "GitHub Cache Maintenance"

on:
  workflow_run:
    workflows: ["GitHub CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: "Prepare Cache Maintenance"
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      refresh_matrix: ${{ steps.matrix.outputs.refresh_matrix }}
    steps:
      - name: Download GHCI top-level artifacts
        id: download-artifacts
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: ghci-toplevel-*
          path: ${{ runner.temp }}/ghci-toplevel

      - name: Emit refresh matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOWNLOAD_OUTCOME: ${{ steps.download-artifacts.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          systems_json='[
            {
              "system": "aarch64-linux",
              "runner": "ubuntu-24.04-arm",
              "cacheKind": "ext4",
              "imageSize": "32G",
              "imageDir": "nix-root-ci-aarch64-linux",
              "cachePrefix": "nix-root-ci-aarch64-linux-ext4-v1"
            },
            {
              "system": "x86_64-linux",
              "runner": "ubuntu-24.04",
              "cacheKind": "ext4",
              "imageSize": "32G",
              "imageDir": "nix-root-ci-x86_64-linux",
              "cachePrefix": "nix-root-ci-x86_64-linux-ext4-v1"
            },
            {
              "system": "aarch64-darwin",
              "runner": "macos-26",
              "cacheKind": "sparsebundle",
              "imageSize": "64g",
              "imageDir": "nix-root-ci-aarch64-darwin",
              "cachePrefix": "nix-root-ci-aarch64-darwin-sparsebundle-v1"
            }
          ]'

          force_all() {
            jq -c --arg source "fallback" '
              map(. + { source: $source })
            ' <<< "$systems_json"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            refresh_matrix="$(force_all)"
            printf 'refresh_matrix=%s\n' "$refresh_matrix" >> "$GITHUB_OUTPUT"
            echo "NIX_ROOT_CACHE_REFRESH_MATRIX source=fallback reason=workflow_dispatch matrix=$refresh_matrix"
            exit 0
          fi

          if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ] || [ "$WORKFLOW_RUN_HEAD_BRANCH" != "$DEFAULT_BRANCH" ]; then
            printf 'refresh_matrix=[]\n' >> "$GITHUB_OUTPUT"
            echo "NIX_ROOT_CACHE_REFRESH_MATRIX source=none reason=workflow_run_not_eligible matrix=[]"
            exit 0
          fi

          if [ "$DOWNLOAD_OUTCOME" != "success" ]; then
            refresh_matrix="$(force_all)"
            printf 'refresh_matrix=%s\n' "$refresh_matrix" >> "$GITHUB_OUTPUT"
            echo "::warning title=GHCI artifact download failed::Refreshing all cache lanes with lane-local eval fallback."
            echo "NIX_ROOT_CACHE_REFRESH_MATRIX source=fallback reason=artifact_download_failed matrix=$refresh_matrix"
            exit 0
          fi

          artifact_dir="$RUNNER_TEMP/ghci-toplevel"
          mapfile -d '' record_files < <(find "$artifact_dir" -name record.json -type f -print0 | sort -z)
          if [ "${#record_files[@]}" -eq 0 ]; then
            refresh_matrix="$(force_all)"
            printf 'refresh_matrix=%s\n' "$refresh_matrix" >> "$GITHUB_OUTPUT"
            echo "::warning title=GHCI artifacts missing::Refreshing all cache lanes with lane-local eval fallback."
            echo "NIX_ROOT_CACHE_REFRESH_MATRIX source=fallback reason=missing_artifacts matrix=$refresh_matrix"
            exit 0
          fi

          if ! records="$(jq -s -c '
            if all(.[]; (
              (.kind | type == "string")
              and (.name | type == "string")
              and (.system | type == "string")
              and (.storePath | type == "string")
              and (.nixFastBuildStorePath | type == "string")
            )) then
              .
            else
              error("invalid GHCI top-level artifact schema")
            end
          ' "${record_files[@]}")"; then
            refresh_matrix="$(force_all)"
            printf 'refresh_matrix=%s\n' "$refresh_matrix" >> "$GITHUB_OUTPUT"
            echo "::warning title=GHCI artifact parse failed::Refreshing all cache lanes with lane-local eval fallback."
            echo "NIX_ROOT_CACHE_REFRESH_MATRIX source=fallback reason=artifact_parse_failed matrix=$refresh_matrix"
            exit 0
          fi

          if ! cache_keys="$(
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF" \
              --limit 100 \
              --json key \
              --jq '.[].key'
          )"; then
            refresh_matrix="$(force_all)"
            printf 'refresh_matrix=%s\n' "$refresh_matrix" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub cache list failed::Refreshing all cache lanes with lane-local eval fallback."
            echo "NIX_ROOT_CACHE_REFRESH_MATRIX source=fallback reason=cache_list_failed matrix=$refresh_matrix"
            exit 0
          fi

          has_cache_prefix() {
            local prefix="$1"
            local key
            while IFS= read -r key; do
              [[ "$key" == "$prefix"-* ]] && return 0
            done <<< "$cache_keys"
            return 1
          }

          refresh_entries="[]"
          while IFS= read -r lane; do
            system="$(jq -r '.system' <<< "$lane")"
            cache_prefix="$(jq -r '.cachePrefix' <<< "$lane")"
            builds_json="$(jq -c --arg system "$system" '[.[] | select(.system == $system)]' <<< "$records")"
            if [ "$builds_json" = "[]" ]; then
              echo "NIX_ROOT_CACHE_REFRESH_DECISION system=$system cachePrefix=$cache_prefix cacheHit=false refresh=false fingerprint= source=artifact"
              continue
            fi

            fingerprint="$(
              jq -r '.[] | [.kind, .name, .storePath, .nixFastBuildStorePath] | @tsv' <<< "$builds_json" \
                | sort \
                | sha256sum \
                | cut -d " " -f1
            )"
            fingerprint_prefix="$cache_prefix-fp-$fingerprint"
            cache_hit=false
            refresh=true
            if has_cache_prefix "$fingerprint_prefix"; then
              cache_hit=true
              refresh=false
            fi

            echo "NIX_ROOT_CACHE_REFRESH_DECISION system=$system cachePrefix=$cache_prefix cacheHit=$cache_hit refresh=$refresh fingerprint=$fingerprint source=artifact"

            if [ "$refresh" = "true" ]; then
              refresh_entries="$(
                jq -c \
                  --argjson entries "$refresh_entries" \
                  --argjson lane "$lane" \
                  --arg buildsJson "$builds_json" \
                  --arg fingerprint "$fingerprint" \
                  '$entries + [($lane + { source: "artifact", buildsJson: $buildsJson, fingerprint: $fingerprint })]' \
                  <<< '{}'
              )"
            fi
          done < <(jq -c '.[]' <<< "$systems_json")

          printf 'refresh_matrix=%s\n' "$refresh_entries" >> "$GITHUB_OUTPUT"
          echo "NIX_ROOT_CACHE_REFRESH_MATRIX source=artifact matrix=$refresh_entries"

  maintenance:
    name: "Cache ${{ matrix.system }}"
    needs: prepare
    if: ${{ needs.prepare.outputs.refresh_matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    permissions:
      actions: write
      contents: read
    concurrency:
      group: github-cache-lane-${{ matrix.system }}-${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.refresh_matrix) }}
    env:
      NIX_ROOT_CACHE_KEY_PREFIX: ${{ matrix.cachePrefix }}
      NIX_ROOT_IMAGE_DIR_NAME: ${{ matrix.imageDir }}
      NIX_ROOT_IMAGE_SIZE: ${{ matrix.imageSize }}
      NIX_ROOT_SYSTEM: ${{ matrix.system }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Restore ext4 Nix root cache
        if: ${{ matrix.cacheKind == 'ext4' }}
        uses: ./.github/actions/nix-ext4-cache-restore
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: writer
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Restore sparsebundle Nix root cache
        if: ${{ matrix.cacheKind == 'sparsebundle' }}
        uses: ./.github/actions/nix-sparsebundle-cache-restore
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: writer
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Mount ext4 Nix root
        if: ${{ matrix.cacheKind == 'ext4' }}
        uses: ./.github/actions/nix-ext4-mount
        with:
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Mount sparsebundle Nix root
        if: ${{ matrix.cacheKind == 'sparsebundle' }}
        uses: ./.github/actions/nix-sparsebundle-mount
        with:
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Evaluate fallback cache lane
        id: fallback
        if: ${{ matrix.source != 'artifact' }}
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          builds_json="$(
            nix eval --impure --json --expr '
              let
                targetSystem = builtins.getEnv "NIX_ROOT_SYSTEM";
                flake = builtins.getFlake (toString ./.);
                lane = flake.ci.bySystem.${targetSystem} or {};
                nixFastBuildStorePath =
                  toString flake.inputs.nixpkgs-unstable.legacyPackages.${targetSystem}.nix-fast-build;
              in
                builtins.concatLists
                  (builtins.attrValues
                    (builtins.mapAttrs
                      (kind: outputs:
                        builtins.attrValues
                          (builtins.mapAttrs
                            (name: output: {
                              inherit kind name nixFastBuildStorePath;
                              system = targetSystem;
                              storePath = toString output;
                            })
                            outputs))
                      lane))
            '
          )"
          fingerprint="$(
            jq -r '.[] | [.kind, .name, .storePath, .nixFastBuildStorePath] | @tsv' <<< "$builds_json" \
              | sort \
              | shasum -a 256 \
              | cut -d " " -f1
          )"

          {
            printf 'builds_json=%s\n' "$builds_json"
            printf 'fingerprint=%s\n' "$fingerprint"
          } >> "$GITHUB_OUTPUT"

          echo "NIX_ROOT_CACHE_REFRESH_DECISION system=$NIX_ROOT_SYSTEM cachePrefix=$NIX_ROOT_CACHE_KEY_PREFIX cacheHit=false refresh=true fingerprint=$fingerprint source=fallback"

      - name: Select cache lane inputs
        id: lane
        shell: bash
        env:
          MATRIX_SOURCE: ${{ matrix.source }}
          MATRIX_BUILDS_JSON: ${{ matrix.buildsJson }}
          MATRIX_FINGERPRINT: ${{ matrix.fingerprint }}
          FALLBACK_BUILDS_JSON: ${{ steps.fallback.outputs.builds_json }}
          FALLBACK_FINGERPRINT: ${{ steps.fallback.outputs.fingerprint }}
        run: |
          set -euo pipefail

          if [ "$MATRIX_SOURCE" = "artifact" ]; then
            builds_json="$MATRIX_BUILDS_JSON"
            fingerprint="$MATRIX_FINGERPRINT"
          else
            builds_json="$FALLBACK_BUILDS_JSON"
            fingerprint="$FALLBACK_FINGERPRINT"
          fi

          {
            printf 'builds_json=%s\n' "$builds_json"
            printf 'fingerprint=%s\n' "$fingerprint"
            printf 'cache_key=%s-fp-%s-%s-%s\n' "$NIX_ROOT_CACHE_KEY_PREFIX" "$fingerprint" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

          echo "GHCI_MATRIX $NIX_ROOT_SYSTEM=$builds_json"

      - name: Build and root GHCI lane
        uses: ./.github/actions/nix-root-build
        with:
          builds-json: ${{ steps.lane.outputs.builds_json }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Pack ext4 Nix root
        if: ${{ success() && matrix.cacheKind == 'ext4' }}
        uses: ./.github/actions/nix-ext4-pack
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Pack sparsebundle Nix root
        if: ${{ success() && matrix.cacheKind == 'sparsebundle' }}
        uses: ./.github/actions/nix-sparsebundle-pack
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Start cache save timer
        if: success()
        shell: bash
        run: echo "NIX_ROOT_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Save ext4 Nix root cache
        if: ${{ success() && matrix.cacheKind == 'ext4' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/${{ matrix.imageDir }}/nix-root.ext4.zst
          key: ${{ steps.lane.outputs.cache_key }}

      - name: Save sparsebundle Nix root cache
        if: ${{ success() && matrix.cacheKind == 'sparsebundle' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/${{ matrix.imageDir }}/nix-root.sparsebundle
          key: ${{ steps.lane.outputs.cache_key }}

      - name: Report cache save
        if: success()
        uses: ./.github/actions/github-cache-save-report
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key: ${{ steps.lane.outputs.cache_key }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Prune cache lane
        if: success()
        uses: ./.github/actions/github-cache-prune
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          keep-cache-key: ${{ steps.lane.outputs.cache_key }}
          system: ${{ env.NIX_ROOT_SYSTEM }}
