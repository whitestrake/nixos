name: "Gate 4 ULFO Shadow Capability Probe"

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: "4-ulfo-shadow-apfsx"
    runs-on: macos-26
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prove ULFO shadow persistence capability
        shell: bash
        env:
          GATE4_ULFO_PHASE: smoke
        run: bash .github/scripts/gate4-ulfo-shadow-probe.sh

      - name: Download canonical Gate 4 fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gate4-fixture-f4e808512dad51a7e9c164a0f0f0ec665764e21f6c9341c2df1802bf276c0898
          path: ${{ runner.temp }}/gate4-fixture
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33490307543

      - name: Create and attach writable seed
        shell: bash
        env:
          GATE4_ULFO_PHASE: seed
        run: bash .github/scripts/gate4-ulfo-shadow-probe.sh

      - name: Install Nix in seed
        uses: ./.github/actions/install-nix

      - name: Run ULFO shadow lifecycle
        shell: bash
        env:
          GATE4_ULFO_PHASE: lifecycle
        run: bash .github/scripts/gate4-ulfo-shadow-probe.sh

      - name: Ensure probe image is detached
        if: always()
        shell: bash
        env:
          GATE4_ULFO_PHASE: cleanup
        run: bash .github/scripts/gate4-ulfo-shadow-probe.sh

      - name: Upload ULFO shadow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate4-ulfo-shadow-probe-evidence
          path: |
            ${{ runner.temp }}/gate4/4-ulfo-shadow-apfsx/probe/evidence.jsonl
            ${{ runner.temp }}/gate4/4-ulfo-shadow-apfsx/probe/*.plist
          if-no-files-found: warn
          retention-days: 7
