name: CI Retry
run-name: ${{ inputs.reason && format('Retry CI on {0}', inputs.reason) || format('Retry CI run {0}', inputs.run_id) }}
"on":
  # Started by CI's Retry job once it has judged a failed attempt transient, so
  # a run exists only when there is something to retry. CI's own GITHUB_TOKEN
  # is enough: workflow_dispatch is one of the events it may start.
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run to re-run
        required: true
        type: string
      run_attempt:
        description: Attempt of that run that failed transiently
        required: true
        type: string
      reason:
        description: Branch and lanes, shown in the run name
        type: string
        default: ""
permissions:
  contents: read
# A newer request for the same run supersedes a pending retry.
concurrency:
  group: ci-retry-${{ inputs.run_id }}
  cancel-in-progress: true
jobs:
  retry:
    name: Retry transient failures
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      ATTEMPT: ${{ inputs.run_attempt }}
    steps:
      # CI asks from its last job, and GitHub refuses to re-run a run that is
      # still in progress.
      - name: Wait for the CI run to finish
        id: run
        run: |
          set -euo pipefail
          # Anyone with write access can start this by hand, so the request is
          # checked too: a CI run, and never a re-run of its third attempt.
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$ATTEMPT" =~ ^[12]$ ]]; then
            echo "::error ::Expected a run id and attempt 1 or 2: run=$RUN_ID attempt=$ATTEMPT"
            exit 1
          fi
          deadline=$((SECONDS + 2400))
          while :; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            if [ "$(jq -r .path <<< "$run")" != .github/workflows/continuous-integration.yml ]; then
              echo "::error ::Run $RUN_ID is not a CI run"
              exit 1
            fi
            attempt="$(jq -r .run_attempt <<< "$run")"
            if [ "$attempt" != "$ATTEMPT" ]; then
              echo "Not retrying; the run is already on attempt $attempt"
              exit 0
            fi
            [ "$(jq -r .status <<< "$run")" != completed ] || break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning ::Not retrying; CI run $RUN_ID has not finished"
              exit 0
            fi
            sleep 20
          done
          # A superseded or manually cancelled run concludes as cancelled.
          conclusion="$(jq -r .conclusion <<< "$run")"
          if [ "$conclusion" != failure ]; then
            echo "Not retrying; attempt $ATTEMPT concluded as $conclusion"
            exit 0
          fi
          {
            echo "head_branch=$(jq -r .head_branch <<< "$run")"
            echo "head_sha=$(jq -r .head_sha <<< "$run")"
            echo "retry=true"
          } >> "$GITHUB_OUTPUT"
      - name: Wait before retrying
        if: steps.run.outputs.retry == 'true'
        run: sleep $((ATTEMPT * 300))
      - name: Confirm the run is still current
        id: current
        if: steps.run.outputs.retry == 'true'
        env:
          HEAD_BRANCH: ${{ steps.run.outputs.head_branch }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .run_attempt)"
          if [ "$attempt" != "$ATTEMPT" ]; then
            echo "Not retrying; the run is already on attempt $attempt"
            exit 0
          fi
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_BRANCH" --jq .object.sha 2>/dev/null || true)"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Not retrying; $HEAD_BRANCH has moved on from $HEAD_SHA or is gone"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      # Events caused by GITHUB_TOKEN start no workflow_run workflows, so a re-run
      # under it would never reach Cache Maintenance.
      - name: Create GitHub App token
        id: app-token
        if: steps.current.outputs.current == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.WHITESTRAKE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHITESTRAKE_BOT_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Re-run failed jobs
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs" --silent
          echo "::notice ::Re-ran the failed jobs of CI run $RUN_ID (attempt $ATTEMPT)"
