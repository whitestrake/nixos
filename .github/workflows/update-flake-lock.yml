name: "Update flake.lock"
on:
  workflow_dispatch: # allow manual runs
  schedule:
    - cron: "0 12 * * 6" # every Saturday 12:00 UTC
permissions:
  contents: read
jobs:
  nix-flake-update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: ./.github/actions/install-nix
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WHITESTRAKE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHITESTRAKE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update-flake-lock
          commit-msg: "chore: bump flake.lock"
          pr-title: "chore: bump flake.lock"
          pr-labels: dependencies
          pr-body: |
            Automated changes by the [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock) GitHub Action.

            ```text
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
          nix-options: --accept-flake-config
