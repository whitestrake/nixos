name: "Flake.lock: update Nix dependencies"
on:
  workflow_dispatch: # allow manual runs
  schedule:
    - cron: "0 12 * * 6" # every Saturday 12:00 UTC
permissions:
  contents: read
jobs:
  nix-flake-update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: ./.github/actions/install-nix
      - name: Update flake.lock
        run: nix flake update --accept-flake-config
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WHITESTRAKE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHITESTRAKE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: nix-update/flake-lock
          title: "chore: bump flake.lock"
          body: |
            Automated update of `flake.lock`.
          labels: |
            dependencies
            automated
          commit-message: "chore: bump flake.lock"
          delete-branch: true
