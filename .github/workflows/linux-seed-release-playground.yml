name: Linux Seed Release E52 Playground
run-name: E52 ${{ inputs.round || 'registration' }} ${{ inputs.treatment || 'register' }}

on:
  workflow_dispatch:
    inputs:
      treatment:
        description: Seed transport treatment
        type: choice
        options: [cache, legacy, single, zstd]
        required: true
      round:
        description: Comparison round identifier
        type: string
        required: true
      sources_json:
        description: JSON object containing pinned raw and compressed seed sources
        type: string
        required: true
  push:
    branches: [feat/ci-optimisation]
    paths: [.github/workflows/linux-seed-release-playground.yml]

permissions:
  contents: read

concurrency:
  group: e52-${{ github.ref }}-${{ inputs.round || github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_CACHE_REF: refs/heads/feat/ci-optimisation
  RELEASE_TARGET_SHA: f83419c1bab7e3940635ffc3c7aaa22ce9c451fd
  RAW_SOURCE_SHA256: a0ee2753f9660a13e85b0270f3e68a45b99a8c54d8cf9ffee86ce7b9bd0ead60
  RAW_IMAGE_BYTES: '287719424'
  RAW_IMAGE_SHA256: 81a95cf64848988ffa2e1112d1656b6f20dafebb14222a2833ac909ad9e794bf
  ZSTD_RELEASE_ID: '383795469'
  ZSTD_MANIFEST_SHA256: 760496328692b406a493aa09eb45993b8436d5013ecae91dd72dcc5c94fff61d
  ZSTD_IMAGE_BYTES: '255025133'
  ZSTD_IMAGE_SHA256: 77882027bc72dfee33d578a6f410c5fbecb5eba5769de7567fa5c1a3dfb05f79

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo 'E52 workflow registered; readers run only through workflow_dispatch.'

  reader:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f83419c1bab7e3940635ffc3c7aaa22ce9c451fd
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Isolate current harness from pinned fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e52-harness" "$RUNNER_TEMP/e52-evidence"
          cp .harness/.github/scripts/darwin-release-image.py "$RUNNER_TEMP/e52-harness/"
          cp .harness/.github/scripts/linux-lifecycle-image.sh "$RUNNER_TEMP/e52-harness/"
          cp .harness/.github/scripts/fast-ci-measure.py "$RUNNER_TEMP/e52-harness/"
          cp .harness/.github/scripts/nix-fast-build-records.jq "$RUNNER_TEMP/e52-harness/"
          rm -rf .harness
          test ! -e .harness
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET_SHA"
          root="$RUNNER_TEMP/e52-evidence"
          date +%s%N > "$root/runner-start-epoch-ns.txt"
          lscpu --json > "$root/lscpu.json"
          jq -n --arg imageOS "${ImageOS:-unknown}" --arg imageVersion "${ImageVersion:-unknown}" \
            --arg kernel "$(uname -srvmo)" '{imageOS:$imageOS,imageVersion:$imageVersion,kernel:$kernel}' \
            > "$root/runner.json"
      - name: Validate pinned sources and select treatment
        env:
          ROUND: ${{ inputs.round }}
          SOURCES_JSON: ${{ inputs.sources_json }}
          TREATMENT: ${{ inputs.treatment }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e52-evidence"
          date +%s.%N > "$root/descriptor-start.txt"
          test "$GITHUB_REF" = "$SOURCE_CACHE_REF"
          [[ "$ROUND" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          case "$TREATMENT" in cache|legacy|single|zstd) ;; *) exit 64 ;; esac
          jq -ce 'select(type == "object" and (keys | sort) == ["compressed","raw"])' \
            <<< "$SOURCES_JSON" > "$root/sources.json"
          jq -cS .raw "$root/sources.json" > "$root/raw-source.json"
          test "$(sha256sum "$root/raw-source.json" | cut -d ' ' -f 1)" = "$RAW_SOURCE_SHA256"
          jq -e --argjson release "$ZSTD_RELEASE_ID" --arg manifest "$ZSTD_MANIFEST_SHA256" \
            --argjson encodedBytes "$ZSTD_IMAGE_BYTES" --arg encodedSha "$ZSTD_IMAGE_SHA256" '
            .raw as $raw | .compressed as $compressed
            | ($compressed | del(.transport,.releaseId,.manifestSha256))
                == ($raw | del(.releaseId,.manifestSha256))
              and $compressed.releaseId == $release
              and $compressed.manifestSha256 == $manifest
              and $compressed.transport == {
                encoding:"zstd",imageBytes:$encodedBytes,imageSha256:$encodedSha
              }
          ' "$root/sources.json" >/dev/null
          jq -ce --arg treatment "$TREATMENT" \
            'if $treatment == "zstd" then .compressed else .raw end' \
            "$root/sources.json" > "$root/source.json"
          jq -e --arg fixture "$RELEASE_TARGET_SHA" --arg imageSha "$RAW_IMAGE_SHA256" \
            --argjson imageBytes "$RAW_IMAGE_BYTES" '
              .schema == "linux-release-e51-source-v1"
              and .lane == "seed-x86" and .system == "x86_64-linux" and .format == "erofs"
              and .fixtureRevision == $fixture and .workload == "linux-hosts"
              and .image == {bytes:$imageBytes,sha256:$imageSha}
              and (.expectedRecords | length) == 10
              and .expectedRoots == ([.expectedRecords[].storePath] | sort | unique)
              and .sourceCache == {
                id:"7381379136",
                key:"fast-ci-native-seed-v1-34027062459-x86_64-linux",
                ref:"refs/heads/feat/ci-optimisation",
                version:"aa73b3a5744ea59cde86707b50f43655f33d316f0540fb4de4666d563f3ec881",
                archiveBytes:255096432
              }
          ' "$root/source.json" >/dev/null
          jq -cS '.expectedRecords | map({attr,kind,name,storePath}) | sort_by(.attr)' \
            "$root/source.json" > "$root/expected-map.json"
          date +%s.%N > "$root/descriptor-end.txt"
      - name: Preflight exact retained cache identity
        if: inputs.treatment == 'cache'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e52-evidence"
          date +%s.%N > "$root/control-preflight-start.txt"
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_CACHE_REF" \
            --key fast-ci-native-seed-v1-34027062459-x86_64-linux --limit 10 \
            --json id,key,ref,sizeInBytes,version > "$root/control-cache.json"
          jq -e '
            length == 1
            and (.[0].id | tostring) == "7381379136"
            and .[0].key == "fast-ci-native-seed-v1-34027062459-x86_64-linux"
            and .[0].ref == "refs/heads/feat/ci-optimisation"
            and .[0].version == "aa73b3a5744ea59cde86707b50f43655f33d316f0540fb4de4666d563f3ec881"
            and .[0].sizeInBytes == 255096432
          ' "$root/control-cache.json" >/dev/null
          date +%s.%N > "$root/control-preflight-end.txt"
      - name: Start complete transport endpoint
        run: |
          root="$RUNNER_TEMP/e52-evidence"
          date +%s.%N > "$root/complete-start.txt"
          date +%s.%N > "$root/transport-start.txt"
          awk '/^cpu / {print $2+$3+$4+$7+$8}' /proc/stat > "$root/transport-cpu-start.txt"
          awk 'NR > 2 && $1 != "lo:" {sum += $2} END {printf "%.0f\n", sum}' /proc/net/dev \
            > "$root/transport-rx-start.txt"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        if: inputs.treatment == 'cache'
        with:
          path: ${{ runner.temp }}/fast-ci-erofs
          key: fast-ci-native-seed-v1-34027062459-x86_64-linux
          fail-on-cache-miss: true
      - name: Restore with legacy four-worker assembly
        if: inputs.treatment == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="$RUNNER_TEMP/e52-evidence"
          python3 "$RUNNER_TEMP/e52-harness/darwin-release-image.py" eager --workers 4 \
            --repo "$GITHUB_REPOSITORY" --release-id "$(jq -r .releaseId "$root/source.json")" \
            --manifest-sha "$(jq -r .manifestSha256 "$root/source.json")" \
            --directory "$RUNNER_TEMP/e52-release" > "$root/helper.json"
      - name: Restore with single-shard path
        if: inputs.treatment == 'single' || inputs.treatment == 'zstd'
        env:
          GH_TOKEN: ${{ github.token }}
          TREATMENT: ${{ inputs.treatment }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e52-evidence"
          args=(eager-single --repo "$GITHUB_REPOSITORY"
            --release-id "$(jq -r .releaseId "$root/source.json")"
            --manifest-sha "$(jq -r .manifestSha256 "$root/source.json")"
            --directory "$RUNNER_TEMP/e52-release")
          if [ "$TREATMENT" = zstd ]; then
            args+=(--zstd --decoded-sha256 "$RAW_IMAGE_SHA256" --decoded-size "$RAW_IMAGE_BYTES")
          fi
          python3 "$RUNNER_TEMP/e52-harness/darwin-release-image.py" "${args[@]}" > "$root/helper.json"
      - name: Finish exact transport and whole-image verification
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          TREATMENT: ${{ inputs.treatment }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e52-evidence"
          if [ "$TREATMENT" = cache ]; then
            test "$CACHE_HIT" = true
            test "$MATCHED_KEY" = fast-ci-native-seed-v1-34027062459-x86_64-linux
            mv "$RUNNER_TEMP/fast-ci-erofs" "$RUNNER_TEMP/e52-transport"
            image="$RUNNER_TEMP/e52-transport/image"
            test "$(sha256sum "$RUNNER_TEMP/e52-transport/image.sha256" | cut -d ' ' -f 1)" = \
              "$(jq -r '.sidecars["image.sha256"].sha256' "$root/source.json")"
            test "$(cat "$RUNNER_TEMP/e52-transport/image.sha256")" = \
              "$(jq -r '.sidecars["image.sha256"].content' "$root/source.json")"
            test "$(sha256sum "$RUNNER_TEMP/e52-transport/nfb-path.txt" | cut -d ' ' -f 1)" = \
              "$(jq -r '.sidecars["nfb-path.txt"].sha256' "$root/source.json")"
            test "$(cat "$RUNNER_TEMP/e52-transport/nfb-path.txt")" = \
              "$(jq -r .nixFastBuild.path "$root/source.json")"
          else
            test "$(jq -r .releaseId "$root/helper.json")" = "$(jq -r .releaseId "$root/source.json")"
            test "$(jq -r .manifestSha256 "$root/helper.json")" = "$(jq -r .manifestSha256 "$root/source.json")"
            test "$(jq -r .image "$root/helper.json")" = "$RUNNER_TEMP/e52-release/image.dmg"
            if [ "$TREATMENT" = legacy ]; then
              jq -e '.workers == 4 and (.selectionSeconds >= 0) and (.restoreSeconds >= 0)' \
                "$root/helper.json" >/dev/null
            else
              jq -e '.workers == 1 and (.selectionSeconds >= 0) and (.restoreSeconds >= 0)
                and (.downloadSeconds >= 0) and (.verificationSeconds >= 0)
                and (.decompressionSeconds >= 0)' "$root/helper.json" >/dev/null
              if [ "$TREATMENT" = single ]; then
                jq -e '.encodedBytes == .imageBytes and .encodedSha256 == .imageSha256' \
                  "$root/helper.json" >/dev/null
              else
                jq -e --slurpfile source "$root/source.json" '
                  .encodedBytes == $source[0].transport.imageBytes
                  and .encodedSha256 == $source[0].transport.imageSha256
                ' "$root/helper.json" >/dev/null
              fi
            fi
            test "$(jq -r .imageBytes "$root/helper.json")" = "$RAW_IMAGE_BYTES"
            test "$(jq -r .imageSha256 "$root/helper.json")" = "$RAW_IMAGE_SHA256"
            test "$(jq -cS .source "$RUNNER_TEMP/e52-release/manifest.json")" = \
              "$(jq -cS 'del(.releaseId,.manifestSha256)' "$root/source.json")"
            mv "$RUNNER_TEMP/e52-release" "$RUNNER_TEMP/e52-transport"
            mv "$RUNNER_TEMP/e52-transport/image.dmg" "$RUNNER_TEMP/e52-transport/image"
            printf '%s  image\n' "$RAW_IMAGE_SHA256" > "$RUNNER_TEMP/e52-transport/image.sha256"
            image="$RUNNER_TEMP/e52-transport/image"
          fi
          test "$(stat -c %s "$image")" = "$RAW_IMAGE_BYTES"
          test "$(sha256sum "$image" | cut -d ' ' -f 1)" = "$RAW_IMAGE_SHA256"
          echo "E52_IMAGE=$image" >> "$GITHUB_ENV"
          date +%s.%N > "$root/transport-end.txt"
          awk '/^cpu / {print $2+$3+$4+$7+$8}' /proc/stat > "$root/transport-cpu-end.txt"
          awk 'NR > 2 && $1 != "lo:" {sum += $2} END {printf "%.0f\n", sum}' /proc/net/dev \
            > "$root/transport-rx-end.txt"
      - name: Mount pinned image with writable overlay
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e52-evidence"
          date +%s.%N > "$root/mount-start.txt"
          awk '/^cpu / {print $2+$3+$4+$7+$8}' /proc/stat > "$root/mount-cpu-start.txt"
          bash "$RUNNER_TEMP/e52-harness/linux-lifecycle-image.sh" mount-overlay erofs "$E52_IMAGE"
          nfb="$(jq -r .nixFastBuild.path "$root/source.json")"
          test -x "$nfb/bin/nix-fast-build"
          "$nfb/bin/nix-fast-build" --help >/dev/null
          printf '%s\n' "$nfb" > "$root/nfb-path.txt"
          echo "E52_NFB=$nfb/bin/nix-fast-build" >> "$GITHUB_ENV"
          date +%s.%N > "$root/mount-end.txt"
          awk '/^cpu / {print $2+$3+$4+$7+$8}' /proc/stat > "$root/mount-cpu-end.txt"
      - name: Start Nix installation timing
        run: |
          date +%s.%N > "$RUNNER_TEMP/e52-evidence/install-start.txt"
          awk '/^cpu / {print $2+$3+$4+$7+$8}' /proc/stat \
            > "$RUNNER_TEMP/e52-evidence/install-cpu-start.txt"
      - uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=
      - name: Finish Nix installation timing
        run: |
          date +%s.%N > "$RUNNER_TEMP/e52-evidence/install-end.txt"
          awk '/^cpu / {print $2+$3+$4+$7+$8}' /proc/stat \
            > "$RUNNER_TEMP/e52-evidence/install-cpu-end.txt"
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run exact ten-record workload and publish proof
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          FAST_CI_FORWARD_EVENTS: '1'
          FAST_CI_SAMPLE_MEMORY: '1'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e52-evidence"
          date +%s.%N > "$root/workload-start.txt"
          awk '/^cpu / {print $2+$3+$4+$7+$8}' /proc/stat > "$root/workload-cpu-start.txt"
          awk 'NR > 2 && $1 != "lo:" {sum += $2} END {printf "%.0f\n", sum}' /proc/net/dev \
            > "$root/workload-rx-start.txt"
          timeout --signal=TERM --kill-after=30s 1200 \
            python3 "$RUNNER_TEMP/e52-harness/fast-ci-measure.py" "$root" -- \
            "$E52_NFB" --flake .#ci.linux-hosts --systems 'x86_64-linux aarch64-linux' \
            --eval-workers 3 --store ssh-ng://eu.nixbuild.net --option max-jobs 2 --retries 2 \
            --result-file "$root/results.json" -j 50 --stream-json-lines
          jq -ce -f "$RUNNER_TEMP/e52-harness/nix-fast-build-records.jq" \
            "$root/results.json" > "$root/records.json"
          test "$(jq length "$root/records.json")" -eq 10
          jq -cS 'map({attr,kind,name,storePath}) | sort_by(.attr)' "$root/records.json" \
            > "$root/actual-map.json"
          cmp "$root/expected-map.json" "$root/actual-map.json"
          while IFS= read -r path; do
            nix path-info --store https://whitestrake.cachix.org "$path" >/dev/null
          done < <(jq -r '.[].storePath' "$root/records.json")
          jq -cnS --arg schema linux-release-e51-proof-v1 --arg scope seed-x86 \
            --arg revision "$RELEASE_TARGET_SHA" \
            --argjson records "$(jq -c 'map({attr,storePath}) | sort_by(.attr)' "$root/records.json")" \
            '{schema:$schema,scope:$scope,revision:$revision,records:$records}' > "$root/proof.json"
          proof_path="$(nix store add --mode flat --name linux-release-e51-proof.json "$root/proof.json")"
          cachix push whitestrake "$proof_path"
          nix path-info --store https://whitestrake.cachix.org "$proof_path" >/dev/null
          printf '%s\n' "$proof_path" > "$root/proof-path.txt"
          date +%s.%N > "$root/workload-end.txt"
          date +%s.%N > "$root/complete-end.txt"
          awk '/^cpu / {print $2+$3+$4+$7+$8}' /proc/stat > "$root/workload-cpu-end.txt"
          awk 'NR > 2 && $1 != "lo:" {sum += $2} END {printf "%.0f\n", sum}' /proc/net/dev \
            > "$root/workload-rx-end.txt"
      - name: Record measurements and raw timings
        if: always()
        env:
          ROUND: ${{ inputs.round }}
          TREATMENT: ${{ inputs.treatment }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/e52-evidence"
          duration() { awk 'NR == FNR {start=$1; next} {print $1-start}' "$1" "$2"; }
          delta() { awk 'NR == FNR {start=$1; next} {print $1-start}' "$1" "$2"; }
          helper() {
            if [ -f "$root/helper.json" ]; then
              jq -r --arg field "$1" 'if has($field) then .[$field] else null end' "$root/helper.json"
            else
              printf 'null\n'
            fi
          }
          test -f "$root/complete-end.txt"
          preflight=null
          if [ -f "$root/control-preflight-end.txt" ]; then
            preflight="$(duration "$root/control-preflight-start.txt" "$root/control-preflight-end.txt")"
          fi
          jq -n \
            --argjson descriptorStart "$(cat "$root/descriptor-start.txt")" \
            --argjson descriptorEnd "$(cat "$root/descriptor-end.txt")" \
            --argjson completeStart "$(cat "$root/complete-start.txt")" \
            --argjson completeEnd "$(cat "$root/complete-end.txt")" \
            --argjson transportStart "$(cat "$root/transport-start.txt")" \
            --argjson transportEnd "$(cat "$root/transport-end.txt")" \
            --argjson mountStart "$(cat "$root/mount-start.txt")" \
            --argjson mountEnd "$(cat "$root/mount-end.txt")" \
            --argjson installStart "$(cat "$root/install-start.txt")" \
            --argjson installEnd "$(cat "$root/install-end.txt")" \
            --argjson workloadStart "$(cat "$root/workload-start.txt")" \
            --argjson workloadEnd "$(cat "$root/workload-end.txt")" \
            --argjson transportCpuStart "$(cat "$root/transport-cpu-start.txt")" \
            --argjson transportCpuEnd "$(cat "$root/transport-cpu-end.txt")" \
            --argjson mountCpuStart "$(cat "$root/mount-cpu-start.txt")" \
            --argjson mountCpuEnd "$(cat "$root/mount-cpu-end.txt")" \
            --argjson installCpuStart "$(cat "$root/install-cpu-start.txt")" \
            --argjson installCpuEnd "$(cat "$root/install-cpu-end.txt")" \
            --argjson workloadCpuStart "$(cat "$root/workload-cpu-start.txt")" \
            --argjson workloadCpuEnd "$(cat "$root/workload-cpu-end.txt")" \
            --argjson transportRxStart "$(cat "$root/transport-rx-start.txt")" \
            --argjson transportRxEnd "$(cat "$root/transport-rx-end.txt")" \
            --argjson workloadRxStart "$(cat "$root/workload-rx-start.txt")" \
            --argjson workloadRxEnd "$(cat "$root/workload-rx-end.txt")" '$ARGS.named' \
            > "$root/raw-timings.json"
          cpu_model="$(jq -r '[.lscpu[] | select(.field == "Model name:" or .field == "Model:"
            or .field == "Vendor ID:" or .field == "Architecture:") | .data | select(length > 0)]
            | join(" | ")' "$root/lscpu.json")"
          test -n "$cpu_model"
          jq -n --arg round "$ROUND" --arg treatment "$TREATMENT" \
            --argjson runnerStartEpochNs "$(cat "$root/runner-start-epoch-ns.txt")" \
            --arg fixture "$RELEASE_TARGET_SHA" --arg imageSha "$RAW_IMAGE_SHA256" \
            --arg nfb "$(cat "$root/nfb-path.txt")" --arg proof "$(cat "$root/proof-path.txt")" \
            --arg runnerImage "${ImageVersion:-unknown}" --arg cpuModel "$cpu_model" \
            --argjson imageBytes "$RAW_IMAGE_BYTES" \
            --argjson cacheArchiveBytes "$(jq -r .sourceCache.archiveBytes "$root/source.json")" \
            --argjson encodedBytes "$(helper encodedBytes)" \
            --argjson encodedSha256 "$(helper encodedSha256 | jq -R 'if . == "null" then null else . end')" \
            --argjson responseBytes "$(helper responseBytes)" \
            --argjson uniqueResponseBytes "$(helper uniqueResponseBytes)" \
            --argjson preflightSeconds "$preflight" \
            --argjson completeSeconds "$(duration "$root/complete-start.txt" "$root/complete-end.txt")" \
            --argjson transportSeconds "$(duration "$root/transport-start.txt" "$root/transport-end.txt")" \
            --argjson selectionSeconds "$(helper selectionSeconds)" \
            --argjson restoreSeconds "$(helper restoreSeconds)" \
            --argjson downloadSeconds "$(helper downloadSeconds)" \
            --argjson verificationSeconds "$(helper verificationSeconds)" \
            --argjson decompressionSeconds "$(helper decompressionSeconds)" \
            --argjson mountSeconds "$(duration "$root/mount-start.txt" "$root/mount-end.txt")" \
            --argjson installSeconds "$(duration "$root/install-start.txt" "$root/install-end.txt")" \
            --argjson workloadSeconds "$(duration "$root/workload-start.txt" "$root/workload-end.txt")" \
            --argjson transportCpu "$(delta "$root/transport-cpu-start.txt" "$root/transport-cpu-end.txt")" \
            --argjson mountCpu "$(delta "$root/mount-cpu-start.txt" "$root/mount-cpu-end.txt")" \
            --argjson installCpu "$(delta "$root/install-cpu-start.txt" "$root/install-cpu-end.txt")" \
            --argjson workloadCpu "$(delta "$root/workload-cpu-start.txt" "$root/workload-cpu-end.txt")" \
            --argjson transportRx "$(delta "$root/transport-rx-start.txt" "$root/transport-rx-end.txt")" \
            --argjson workloadRx "$(delta "$root/workload-rx-start.txt" "$root/workload-rx-end.txt")" \
            --argjson cpuCount "$(getconf _NPROCESSORS_ONLN)" --argjson clockTicks "$(getconf CLK_TCK)" \
            --slurpfile records "$root/records.json" --slurpfile source "$root/source.json" '
              {schema:"linux-seed-e52-result-v1",round:$round,treatment:$treatment,
               runnerStartEpochNs:$runnerStartEpochNs,fixtureRevision:$fixture,source:$source[0],
               image:{bytes:$imageBytes,sha256:$imageSha},transport:{encodedBytes:$encodedBytes,
                 encodedSha256:$encodedSha256,responseBytes:$responseBytes,
                 uniqueResponseBytes:$uniqueResponseBytes,cacheArchiveBytes:$cacheArchiveBytes},
               nixFastBuild:$nfb,proofStorePath:$proof,records:$records[0],runnerImage:$runnerImage,
               cpu:{model:$cpuModel,count:$cpuCount,unit:"runner-wide busy jiffies",
                 clockTicksPerSecond:$clockTicks,transport:$transportCpu,mount:$mountCpu,
                 install:$installCpu,workloadPublication:$workloadCpu},
               network:{unit:"received payload bytes",transportInterface:$transportRx,
                 workloadInterface:$workloadRx},
               seconds:{controlIdentityPreflight:$preflightSeconds,completeEndpoint:$completeSeconds,
                 transportTotal:$transportSeconds,releaseSelectionApi:$selectionSeconds,
                 releaseRestore:$restoreSeconds,releaseDownload:$downloadSeconds,
                 releaseVerification:$verificationSeconds,decompression:$decompressionSeconds,
                 mount:$mountSeconds,nixInstall:$installSeconds,workloadAndProofPublication:$workloadSeconds},
               scope:"one E52 seed lane; not full all-platform CI"}' > "$root/result.json"
          jq . "$root/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: linux-seed-e52-${{ inputs.round }}-${{ inputs.treatment }}
          path: ${{ runner.temp }}/e52-evidence
      - name: Unmount disposable image
        if: always()
        run: |
          if mountpoint -q /nix; then
            bash "$RUNNER_TEMP/e52-harness/linux-lifecycle-image.sh" unmount-overlay erofs || true
          fi
