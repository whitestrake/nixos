name: "CD"
run-name: >-
  ${{
    inputs.deployment_source == 'continuous-integration'
    && 'CI Automated Continuous Deployment'
    || 'Triggered Deployment'
  }}

on:
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: "Commit SHA to deploy."
        required: true
        type: string
      deployment_source:
        description: "Deployment source label."
        required: true
        type: string
      matrix:
        description: "Deployment matrix JSON."
        required: true
        type: string
      force:
        description: "Redeploy even when deployed-host-* already matches the target."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      deployment_sha:
        description: "Commit SHA to deploy."
        required: true
        type: string
      deployment_source:
        description: "Deployment source label."
        required: true
        type: string
      matrix:
        description: "Deployment matrix JSON."
        required: true
        type: string
      force:
        description: "Redeploy even when deployed-host-* already matches the target."
        required: false
        default: false
        type: boolean
    secrets:
      CACHIX_ACTIVATE_TOKEN:
        required: true
      CACHIX_AUTH_TOKEN:
        required: true

concurrency:
  group: cachix-deploy-master
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  preflight:
    name: "Preflight"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.revision.outputs.proceed }}
    steps:
      - name: Refuse stale automated deployment
        id: revision
        shell: bash
        env:
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
          DEPLOYMENT_SOURCE: ${{ inputs.deployment_source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$DEPLOYMENT_SOURCE" in
            github-actions)
              echo "Manual deployment; stale-revision check bypassed."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            continuous-integration)
              ;;
            *)
              echo "::error ::Unknown deployment source: $DEPLOYMENT_SOURCE"
              exit 1
              ;;
          esac

          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error ::Automated deployments must target master: $GITHUB_REF"
            exit 1
          fi

          current_rev="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
              --jq '.object.sha'
          )"

          if [ "$DEPLOYMENT_SHA" != "$current_rev" ]; then
            echo "Skipping stale automated deployment: requested=$DEPLOYMENT_SHA current=$current_rev"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: "Deploy ${{ matrix.host }}"
    needs: preflight
    if: ${{ needs.preflight.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.deployment_sha }}

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Deploy Cachix agent
        shell: bash
        env:
          CACHIX_CACHE_NAME: whitestrake
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
          CACHIX_DEPLOY_FORCE: ${{ inputs.force }}
          CACHIX_DEPLOY_OUTPUT_DIR: ${{ runner.temp }}/cachix-deploy-host
          CACHIX_DEPLOYED_PIN_KEEP_REVISIONS: "1"
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
          DEPLOYMENT_SOURCE: ${{ inputs.deployment_source }}
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_SYSTEM: ${{ matrix.system }}
          DEPLOY_STORE_PATH: ${{ matrix.storePath }}
          DEPLOY_ROLLBACK_SCRIPT: ${{ matrix.rollbackScript }}
          GH_TOKEN: ${{ github.token }}
        run: bash modules/deployment/scripts/cachix-github-deploy-host.sh
