        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Build configuration
        shell: bash
        run: |
          set -euo pipefail

          started="$SECONDS"
          nix build \
            --accept-flake-config \
            --print-build-logs \
            --print-out-paths \
            --no-link \
            "${{ matrix.build.attr }}"
          duration="$((SECONDS - started))"
          echo "GHCI_READER_BUILD_COMPLETE system=$NIX_ROOT_SYSTEM name=${{ matrix.build.name }} attr=${{ matrix.build.attr }} durationSeconds=$duration"

      - name: Detach sparsebundle Nix root
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if mount | grep -q ' on /nix '; then
            started="$SECONDS"
            sync
            if sudo hdiutil detach /nix; then
              :
            else
              sudo hdiutil detach -force /nix
            fi
            duration="$((SECONDS - started))"
            echo "NIX_ROOT_IMAGE_DETACHED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE_BUNDLE mountPoint=/nix durationSeconds=$duration"
          fi

