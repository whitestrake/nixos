          set -euo pipefail

          if mount | grep -q ' on /nix '; then
            started="$SECONDS"
            sync
            if sudo hdiutil detach /nix; then
              :
            else
              sudo hdiutil detach -force /nix
            fi
            duration="$((SECONDS - started))"
            echo "NIX_ROOT_IMAGE_DETACHED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE_BUNDLE mountPoint=/nix durationSeconds=$duration"
          fi

      - name: Save sparsebundle cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nix-root-aarch64-darwin/nix-root.sparsebundle
          key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report sparsebundle cache save
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          save_duration="$(($(date +%s) - NIX_ROOT_CACHE_SAVE_STARTED_AT))"
          echo "NIX_ROOT_CACHE_UPLOAD_COMPLETE system=$NIX_ROOT_SYSTEM key=$NIX_ROOT_CACHE_KEY_PREFIX-${{ github.run_id }}-${{ github.run_attempt }} durationSeconds=$save_duration"
