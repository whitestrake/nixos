          fi

          started="$SECONDS"
          sudo hdiutil attach \
            -mountpoint /nix \
            -nobrowse \
            "$NIX_ROOT_IMAGE_BUNDLE"
          duration="$((SECONDS - started))"
          echo "NIX_ROOT_IMAGE_ATTACHED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE_BUNDLE mountPoint=/nix durationSeconds=$duration"

          sudo chown "$USER" /nix
          chmod u+rwx /nix

