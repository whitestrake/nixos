            echo "NIX_ROOT_IMAGE_READY system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE_BUNDLE source=cache"
          else
            started="$SECONDS"
            hdiutil create \
              -size "$NIX_ROOT_IMAGE_SIZE" \
              -type SPARSEBUNDLE \
              -fs 'Case-sensitive Journaled HFS+' \
              -volname NixStore \
              "$NIX_ROOT_IMAGE_BUNDLE"
            duration="$((SECONDS - started))"
