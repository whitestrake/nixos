        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Build and root lane configurations
        shell: bash
        run: |
          set -euo pipefail

          root_dir="/nix/var/nix/gcroots/ghci-cache-lanes/$NIX_ROOT_SYSTEM"
          rm -rf "$root_dir"
