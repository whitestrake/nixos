  x86-64-linux-writer:
    name: "GHCI x86_64-linux Writer"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    needs:
      - eval-ghci
      - x86-64-linux-readers
    if: ${{ success() && needs.eval-ghci.outputs.x86_64_linux != '[]' }}
    permissions:
      actions: write
      contents: read
    concurrency:
      group: ghci-cache-lane-x86_64-linux-${{ github.ref }}
      cancel-in-progress: false
    env:
      GHCI_BUILDS_JSON: ${{ needs.eval-ghci.outputs.x86_64_linux }}
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-x86_64-linux-ext4-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-x86_64-linux
      NIX_ROOT_IMAGE_SIZE: 8G
      NIX_ROOT_SYSTEM: x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start ext4 cache restore
        shell: bash
        run: |
          set -euo pipefail

          image_dir="$RUNNER_TEMP/$NIX_ROOT_IMAGE_DIR_NAME"
          image="$image_dir/nix-root.ext4"
          archive="$image.zst"

          mkdir -p "$image_dir"

          {
            printf 'NIX_ROOT_IMAGE=%s\n' "$image"
            printf 'NIX_ROOT_IMAGE_ARCHIVE=%s\n' "$archive"
            printf 'NIX_ROOT_CACHE_RESTORE_STARTED_AT=%s\n' "$(date +%s)"
          } >> "$GITHUB_ENV"

          df -h

      - name: Restore ext4 image cache
        id: nix-root-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/nix-root-x86_64-linux/nix-root.ext4.zst
          key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}-writer
          restore-keys: |
            ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-

      - name: Prepare ext4 Nix image
        shell: bash
        env:
          CACHE_HIT: ${{ steps.nix-root-cache-restore.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.nix-root-cache-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail

          restore_duration="$(($(date +%s) - NIX_ROOT_CACHE_RESTORE_STARTED_AT))"
          echo "NIX_ROOT_CACHE_RESTORE_DONE system=$NIX_ROOT_SYSTEM hit=${CACHE_HIT:-} matchedKey=${CACHE_MATCHED_KEY:-} durationSeconds=$restore_duration"

          for tool in zstd mkfs.ext4 truncate mount df du jq; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error ::$tool is required for ext4 Nix image cache lanes."
              exit 1
            fi
          done

          if [ -s "$NIX_ROOT_IMAGE_ARCHIVE" ]; then
            started="$SECONDS"
            rm -f "$NIX_ROOT_IMAGE"
            zstd --sparse -d -f "$NIX_ROOT_IMAGE_ARCHIVE" -o "$NIX_ROOT_IMAGE"
            duration="$((SECONDS - started))"
            echo "NIX_ROOT_IMAGE_DECOMPRESSED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE archive=$NIX_ROOT_IMAGE_ARCHIVE durationSeconds=$duration"
          else
            started="$SECONDS"
            rm -f "$NIX_ROOT_IMAGE" "$NIX_ROOT_IMAGE_ARCHIVE"
            truncate -s "$NIX_ROOT_IMAGE_SIZE" "$NIX_ROOT_IMAGE"
            mkfs.ext4 -F -m 0 "$NIX_ROOT_IMAGE"
            duration="$((SECONDS - started))"
            echo "NIX_ROOT_IMAGE_CREATED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE size=$NIX_ROOT_IMAGE_SIZE fs=ext4 durationSeconds=$duration"
          fi

          ls -lh "$NIX_ROOT_IMAGE" || true
          du -h "$NIX_ROOT_IMAGE" || true
          du -h --apparent-size "$NIX_ROOT_IMAGE" || true

          sudo mkdir -p /nix
          if mountpoint -q /nix; then
            echo "::error ::/nix is already a mountpoint."
            findmnt /nix || true
            exit 1
          fi
          if [ -n "$(sudo find /nix -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error ::/nix exists and is not empty before mounting the image."
            sudo ls -la /nix
            exit 1
          fi

