            sudo mount -o loop "$NIX_ROOT_IMAGE" /nix
            mount_options=loop
          fi
          duration="$((SECONDS - started))"
          echo "NIX_ROOT_IMAGE_MOUNTED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE mountPoint=/nix options=$mount_options durationSeconds=$duration"

          sudo chown "$USER" /nix
          chmod u+rwx /nix
          df -h /nix

