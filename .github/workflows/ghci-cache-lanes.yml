          sudo du -sh /nix /nix/store /nix/var/nix || true

          started="$SECONDS"
          nix store gc
          duration="$((SECONDS - started))"
          echo "NIX_ROOT_STORE_GC_COMPLETE system=$NIX_ROOT_SYSTEM durationSeconds=$duration"

          df -h /nix
          sudo du -sh /nix /nix/store /nix/var/nix || true

          started="$SECONDS"
          optimise_status=0
          nix store optimise || optimise_status=$?
          duration="$((SECONDS - started))"
          echo "NIX_ROOT_STORE_OPTIMISE_COMPLETE system=$NIX_ROOT_SYSTEM status=$optimise_status durationSeconds=$duration"

          df -h /nix
          sudo du -sh /nix /nix/store /nix/var/nix || true

          sudo fstrim -v /nix || true

          started="$SECONDS"
          sync
          if ! sudo umount /nix; then
            echo "::error ::/nix is still busy; refusing to fsck and save a live ext4 image."
            findmnt /nix || true
            sudo fuser -vm /nix || true
            exit 1
          fi
          duration="$((SECONDS - started))"
          echo "NIX_ROOT_IMAGE_UNMOUNTED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE mountPoint=/nix durationSeconds=$duration"

          e2fsck_status=0
          sudo e2fsck -pf "$NIX_ROOT_IMAGE" || e2fsck_status=$?
          if [ "$e2fsck_status" -ne 0 ] && [ "$e2fsck_status" -ne 1 ]; then
            echo "::error ::e2fsck failed with status $e2fsck_status."
            exit "$e2fsck_status"
          fi
          echo "NIX_ROOT_IMAGE_FSCK_COMPLETE system=$NIX_ROOT_SYSTEM status=$e2fsck_status"

          started="$SECONDS"
          zstd --sparse -T0 -3 -f "$NIX_ROOT_IMAGE" -o "$NIX_ROOT_IMAGE_ARCHIVE"
          duration="$((SECONDS - started))"
          echo "NIX_ROOT_IMAGE_COMPRESSED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE archive=$NIX_ROOT_IMAGE_ARCHIVE level=3 durationSeconds=$duration"

          ls -lh "$NIX_ROOT_IMAGE" "$NIX_ROOT_IMAGE_ARCHIVE" || true
          du -h "$NIX_ROOT_IMAGE" "$NIX_ROOT_IMAGE_ARCHIVE" || true
          du -h --apparent-size "$NIX_ROOT_IMAGE" "$NIX_ROOT_IMAGE_ARCHIVE" || true

      - name: Prune previous ext4 caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh cache list \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --key "$NIX_ROOT_CACHE_KEY_PREFIX-" \
            --limit 100 \
            --json id,key \
            --jq '.[] | [.id, .key] | @tsv' \
            | while IFS=$'\t' read -r cache_id cache_key; do
                [ -n "$cache_id" ] || continue

                echo "NIX_ROOT_CACHE_PRUNE_DELETE system=$NIX_ROOT_SYSTEM ref=$GITHUB_REF id=$cache_id key=$cache_key"
                gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
              done

          echo "NIX_ROOT_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Unmount ext4 Nix image after failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if mountpoint -q /nix; then
            sync
            started="$SECONDS"
            if sudo umount /nix; then
              :
            else
              sudo umount -l /nix
            fi
            duration="$((SECONDS - started))"
            echo "NIX_ROOT_IMAGE_UNMOUNTED system=$NIX_ROOT_SYSTEM path=$NIX_ROOT_IMAGE mountPoint=/nix durationSeconds=$duration"
          fi

      - name: Save ext4 image cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nix-root-x86_64-linux/nix-root.ext4.zst
          key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report ext4 cache save
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          save_duration="$(($(date +%s) - NIX_ROOT_CACHE_SAVE_STARTED_AT))"
          echo "NIX_ROOT_CACHE_UPLOAD_COMPLETE system=$NIX_ROOT_SYSTEM key=$NIX_ROOT_CACHE_KEY_PREFIX-${{ github.run_id }}-${{ github.run_attempt }} durationSeconds=$save_duration"

