name: Package Report

on:
  pull_request:
    branches: [master]
    paths: [flake.lock]
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request against master
        required: true
        type: string
      cache_release_id:
        description: Optional pinned Release ID for eager readers
        default: ""
        type: string

concurrency:
  group: package-report-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      trusted: ${{ steps.pr.outputs.trusted }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Resolve and validate current pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$EVENT_HEAD" '
            .state == "open" and .base.ref == "master" and .head.repo.full_name == $repo and
            ($head == "" or .head.sha == $head)
          ' <<< "$pr" >/dev/null
          trusted="$(jq -er '.base.sha' <<< "$pr")"
          head="$(jq -er '.head.sha' <<< "$pr")"
          base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$trusted...$head" --jq '.merge_base_commit.sha')"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "base=$base"
            echo "head=$head"
            echo "trusted=$trusted"
            echo "number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"
  compile:
    name: "Build ${{ matrix.system }}"
    needs: context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-darwin
            runner: macos-26
    env:
      BASE_SHA: ${{ needs.context.outputs.base }}
      HEAD_SHA: ${{ needs.context.outputs.head }}
      NIX_ROOT_SYSTEM: ${{ matrix.system }}
      PR_NUMBER: ${{ needs.context.outputs.number }}
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Validate pull request revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e \
            --arg head "$HEAD_SHA" \
            '
              .state == "open"
              and .base.ref == "master"
              and .head.repo.full_name == env.GITHUB_REPOSITORY
              and .head.sha == $head
            ' <<< "$pr_json" >/dev/null; then
            echo "::error ::Rejecting stale, closed, or non-master package report."
            exit 1
          fi

      - name: Select cache generation
        uses: ./.github/actions/ci-cache-select
        with:
          release-id: ${{ inputs.cache_release_id }}
      - name: Prepare Linux build environment
        uses: ./.github/actions/ci-cache-restore
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          component: linux-full-${{ matrix.system }}
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=
      - name: Prepare Darwin build environment
        uses: ./.github/actions/ci-darwin-prepare
        if: runner.os == 'macOS'
        with:
          mode: eager
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=

      - name: Build CI lane
        id: build
        env:
          CI_LANE_SYSTEM: ${{ env.NIX_ROOT_SYSTEM }}
          CI_NFB_JOURNAL: ${{ runner.temp }}/ci-nfb-journal.json
        run: bash .github/scripts/ci-nfb.sh "$CI_LANE_SYSTEM" "$CI_LANE_SYSTEM"

      - name: Check out PR merge base
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false

      - name: Collect package report fragments
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          CI_PACKAGE_REPORT_DIR: ${{ runner.temp }}/ci-package-reports
          CI_NFB_JOURNAL: ${{ runner.temp }}/ci-nfb-journal.json
        run: |
          set -euo pipefail
          dix="$(nix build --inputs-from baseline --no-link --print-out-paths nixpkgs-unstable#dix)"
          DIX_BIN="$dix/bin/dix" python3 .github/scripts/nix_fast_build_package_report.py \
            --journal "$CI_NFB_JOURNAL" --base-dir baseline \
            --report-dir "$CI_PACKAGE_REPORT_DIR" --system "$NIX_ROOT_SYSTEM" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: Upload package reports
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-report-${{ matrix.system }}
          path: ${{ runner.temp }}/ci-package-reports/${{ matrix.system }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: "Publish"
    needs: [context, compile]
    if: ${{ needs.compile.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ needs.context.outputs.base }}
      HEAD_SHA: ${{ needs.context.outputs.head }}
      TRUSTED_SHA: ${{ needs.context.outputs.trusted }}
      PR_NUMBER: ${{ needs.context.outputs.number }}
    steps:
      - name: Check out report tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TRUSTED_SHA }}
          persist-credentials: false

      - name: Download package reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-report-*
          path: package-reports
          merge-multiple: true

      - name: Render package report
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/flake_lock_package_report.py \
            --diff-dir package-reports \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --output package-report.md

      - name: Revalidate pull request revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e \
            --arg head "$HEAD_SHA" \
            '
              .state == "open"
              and .base.ref == "master"
              and .head.repo.full_name == env.GITHUB_REPOSITORY
              and .head.sha == $head
            ' <<< "$pr_json" >/dev/null; then
            echo "::error ::Rejecting stale, closed, or non-master package report."
            exit 1
          fi
          current_master="$(jq -er '.base.sha' <<< "$pr_json")"
          current_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$current_master...$HEAD_SHA" --jq '.merge_base_commit.sha')"
          if [ "$current_base" != "$BASE_SHA" ]; then
            echo "::error ::PR merge base changed during package reporting."
            exit 1
          fi

      - name: Update package report comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          marker="<!-- flake-lock-package-report:comment -->"
          comment_id="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              | jq -r \
                --arg marker "$marker" \
                '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))][0].id // empty'
          )"

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F "body=@package-report.md" \
              --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F "body=@package-report.md" \
              --silent
          fi
