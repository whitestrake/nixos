name: Package Report

on:
  pull_request:
    branches: [master]
    paths: [flake.lock]
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request against master
        required: true
        type: string
      cache_release_id:
        description: Optional pinned Release ID for eager readers
        default: ""
        type: string

concurrency:
  group: package-report-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Resolve and validate current pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg base "$EVENT_BASE" --arg head "$EVENT_HEAD" '
            .state == "open" and .base.ref == "master" and .head.repo.full_name == $repo and
            ($base == "" or .base.sha == $base) and ($head == "" or .head.sha == $head)
          ' <<< "$pr" >/dev/null
          {
            echo "base=$(jq -r .base.sha <<< "$pr")"
            echo "head=$(jq -r .head.sha <<< "$pr")"
            echo "number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"
  compile:
    name: "Build ${{ matrix.system }}"
    needs: context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-darwin
            runner: macos-26
    env:
      BASE_SHA: ${{ needs.context.outputs.base }}
      HEAD_SHA: ${{ needs.context.outputs.head }}
      NIX_ROOT_SYSTEM: ${{ matrix.system }}
      PR_NUMBER: ${{ needs.context.outputs.number }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Validate pull request revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            '
              .state == "open"
              and .base.ref == "master"
              and .base.sha == $base
              and .head.sha == $head
            ' <<< "$pr_json" >/dev/null; then
            echo "::error ::Rejecting stale, closed, or non-master package report."
            exit 1
          fi

      - uses: ./.github/actions/ci-cache-select
        with:
          release-id: ${{ inputs.cache_release_id }}
      - uses: ./.github/actions/ci-cache-restore
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          selection: ${{ runner.temp }}/selection.json
          component: linux-full-${{ matrix.system }}
          format: squashfs
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=
      - uses: ./.github/actions/ci-darwin-prepare
        if: runner.os == 'macOS'
        with:
          mode: eager
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=

      - name: Resolve accepted build proof
        id: proof
        shell: bash
        run: |
          set -euo pipefail

          source modules/deployment/scripts/cachix-pin-functions.sh
          proof_path="$(cachix_pin_path_strict "$(cachix_fetch_pins whitestrake)" successful-master-build)"

          proof_file="$RUNNER_TEMP/ci-build-proof.json"
          nix store cat --store https://whitestrake.cachix.org "$proof_path" > "$proof_file"
          jq -ceS -f .github/scripts/ci-build-proof.jq "$proof_file" > "$proof_file.canonical"
          mv "$proof_file.canonical" "$proof_file"

          proof_revision="$(jq -er '.revision' "$proof_file")"
          records="$(jq -ce --arg system "$NIX_ROOT_SYSTEM" '[.records[] | select(.system == $system)]' "$proof_file")"
          if [ "$records" = '[]' ]; then
            echo "::error ::Accepted build proof has no records for $NIX_ROOT_SYSTEM."
            exit 1
          fi

          {
            printf 'proof_store_path=%s\n' "$proof_path"
            printf 'proof_revision=%s\n' "$proof_revision"
            printf 'records=%s\n' "$records"
          } >> "$GITHUB_OUTPUT"

      - name: Build and report CI lane
        uses: ./.github/actions/nix-root-build
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}
          package-report: true
          baseline-records-json: ${{ steps.proof.outputs.records }}
          proof-store-path: ${{ steps.proof.outputs.proof_store_path }}
          proof-revision: ${{ steps.proof.outputs.proof_revision }}

      - name: Upload package reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-report-${{ matrix.system }}
          path: ${{ runner.temp }}/ci-package-reports/${{ matrix.system }}
          compression-level: 0
          retention-days: 7

      - name: Detach Darwin store
        if: always() && runner.os == 'macOS'
        run: |
          if [ -d "$RUNNER_TEMP/darwin" ]; then
            "$HOST_PYTHON" .github/scripts/ci_darwin.py cleanup --state "$RUNNER_TEMP/darwin"
          fi

  publish:
    name: "Publish"
    needs: [context, compile]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ needs.context.outputs.base }}
      HEAD_SHA: ${{ needs.context.outputs.head }}
      PR_NUMBER: ${{ needs.context.outputs.number }}
    steps:
      - name: Checkout reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false

      - name: Download package reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-report-*
          path: package-reports
          merge-multiple: true

      - name: Render package report
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/flake_lock_package_report.py \
            --diff-dir package-reports \
            --head-sha "$HEAD_SHA" \
            --output package-report.md

      - name: Revalidate pull request revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            '
              .state == "open"
              and .base.ref == "master"
              and .base.sha == $base
              and .head.sha == $head
            ' <<< "$pr_json" >/dev/null; then
            echo "::error ::Rejecting stale, closed, or non-master package report."
            exit 1
          fi

      - name: Update package report comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          marker="<!-- flake-lock-package-report:comment -->"
          comment_id="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              | jq -r \
                --arg marker "$marker" \
                '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))][0].id // empty'
          )"

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F "body=@package-report.md" \
              --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F "body=@package-report.md" \
              --silent
          fi
