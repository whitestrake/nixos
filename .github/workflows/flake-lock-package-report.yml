name: "Flake.lock: package report"
run-name: "Flake.lock package report"

on:
  workflow_run:
    workflows: ["GitHub CI"]
    types: [completed]
    branches: [update-flake-lock]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: flake-lock-package-report-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  update-pr-comment:
    name: "Update PR comment"
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout reporter script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve pull request revisions
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr view "$HEAD_BRANCH" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid,number)"
          base_sha="$(jq -r '.baseRefOid' <<< "$pr_json")"
          head_sha="$(jq -r '.headRefOid' <<< "$pr_json")"
          pr_number="$(jq -r '.number' <<< "$pr_json")"

          {
            echo "base_sha=$base_sha"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

          if [ "$head_sha" != "$HEAD_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Skipping stale workflow run for $HEAD_SHA; current branch head is $head_sha."
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download GHCI reports
        if: ${{ steps.pr.outputs.stale == 'false' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: ghci-toplevel-*
          path: ghci-toplevel

      - name: Render package report
        if: ${{ steps.pr.outputs.stale == 'false' }}
        run: |
          set -euo pipefail

          python3 .github/scripts/flake_lock_package_report.py \
            --diff-dir ghci-toplevel \
            --head-sha "$HEAD_SHA" \
            --base-sha "${{ steps.pr.outputs.base_sha }}" \
            --output package-report.md

      - name: Create GitHub App token
        if: ${{ steps.pr.outputs.stale == 'false' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WHITESTRAKE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHITESTRAKE_BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Update package report comment
        if: ${{ steps.pr.outputs.stale == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          marker="<!-- flake-lock-package-report:comment -->"
          comment_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F "body=@package-report.md" \
              --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F "body=@package-report.md" \
              --silent
          fi
