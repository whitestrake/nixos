name: "GitHub CI"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-ghci:
    name: "Evaluate Configurations"
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Emit build matrices
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          records="$(
            nix eval --impure --json --expr '
              let
                flake = builtins.getFlake (toString ./.);
                mkNixos = name: cfg: {
                  name = name;
                  kind = "nixosConfiguration";
                  system = cfg.pkgs.stdenv.hostPlatform.system;
                  attr = ".#ci.linux.${name}";
                  nixFastBuildStorePath = toString flake.inputs.nixpkgs-unstable.legacyPackages.${cfg.pkgs.stdenv.hostPlatform.system}.nix-fast-build;
                };
                mkDarwin = name: cfg: {
                  name = name;
                  kind = "darwinConfiguration";
                  system = cfg.pkgs.stdenv.hostPlatform.system;
                  attr = ".#ci.darwin.${name}";
                  nixFastBuildStorePath = toString flake.inputs.nixpkgs-unstable.legacyPackages.${cfg.pkgs.stdenv.hostPlatform.system}.nix-fast-build;
                };
                nixos = builtins.attrValues (builtins.mapAttrs mkNixos (flake.nixosConfigurations or {}));
                darwin = builtins.attrValues (builtins.mapAttrs mkDarwin (flake.darwinConfigurations or {}));
              in
                nixos ++ darwin
            '
          )"

          builds="$(
            jq -c '
              map(
                if .system == "aarch64-darwin" then
                  . + {
                    runner: "macos-26",
                    cacheKind: "sparsebundle",
                    cachePrefix: "nix-root-ci-aarch64-darwin-sparsebundle-v1",
                    imageDir: "nix-root-ci-aarch64-darwin",
                    imageSize: "64g"
                  }
                elif .system == "aarch64-linux" then
                  . + {
                    runner: "ubuntu-24.04-arm",
                    cacheKind: "ext4",
                    cachePrefix: "nix-root-ci-aarch64-linux-ext4-v1",
                    imageDir: "nix-root-ci-aarch64-linux",
                    imageSize: "32G"
                  }
                elif .system == "x86_64-linux" then
                  . + {
                    runner: "ubuntu-24.04",
                    cacheKind: "ext4",
                    cachePrefix: "nix-root-ci-x86_64-linux-ext4-v1",
                    imageDir: "nix-root-ci-x86_64-linux",
                    imageSize: "32G"
                  }
                else
                  error("unsupported CI system: \(.system)")
                end
              )
            ' <<< "$records"
          )"

          {
            printf 'builds=%s\n' "$builds"
          } >> "$GITHUB_OUTPUT"

          echo "GHCI_MATRIX builds=$builds"

  build:
    name: "Build ${{ matrix.build.name }} (${{ matrix.build.system }})"
    runs-on: ${{ matrix.build.runner }}
    timeout-minutes: 355
    needs: eval-ghci
    if: ${{ needs.eval-ghci.outputs.builds != '[]' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.eval-ghci.outputs.builds) }}
    env:
      NIX_ROOT_CACHE_KEY_PREFIX: ${{ matrix.build.cachePrefix }}
      NIX_ROOT_IMAGE_DIR_NAME: ${{ matrix.build.imageDir }}
      NIX_ROOT_IMAGE_SIZE: ${{ matrix.build.imageSize }}
      NIX_ROOT_SYSTEM: ${{ matrix.build.system }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore ext4 Nix root cache
        if: ${{ matrix.build.cacheKind == 'ext4' }}
        uses: ./.github/actions/nix-ext4-cache-restore
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: reader-${{ matrix.build.name }}
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Restore sparsebundle Nix root cache
        if: ${{ matrix.build.cacheKind == 'sparsebundle' }}
        uses: ./.github/actions/nix-sparsebundle-cache-restore
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: reader-${{ matrix.build.name }}
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Mount ext4 Nix root
        if: ${{ matrix.build.cacheKind == 'ext4' }}
        uses: ./.github/actions/nix-ext4-mount
        with:
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Mount sparsebundle Nix root
        if: ${{ matrix.build.cacheKind == 'sparsebundle' }}
        uses: ./.github/actions/nix-sparsebundle-mount
        with:
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Push build results to Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true

      - name: Build configuration
        shell: bash
        run: |
          set -euo pipefail

          started="$SECONDS"
          out_paths="$(
            nix build \
              --accept-flake-config \
              --print-build-logs \
              --print-out-paths \
              --no-link \
              "${{ matrix.build.attr }}"
          )"
          store_path="${out_paths##*$'\n'}"
          duration="$((SECONDS - started))"

          mkdir -p "$RUNNER_TEMP/ghci-toplevel"
          jq -n \
            --arg kind "${{ matrix.build.kind }}" \
            --arg name "${{ matrix.build.name }}" \
            --arg system "$NIX_ROOT_SYSTEM" \
            --arg attr "${{ matrix.build.attr }}" \
            --arg storePath "$store_path" \
            --arg nixFastBuildStorePath "${{ matrix.build.nixFastBuildStorePath }}" \
            '{
              kind: $kind,
              name: $name,
              system: $system,
              attr: $attr,
              storePath: $storePath,
              nixFastBuildStorePath: $nixFastBuildStorePath
            }' > "$RUNNER_TEMP/ghci-toplevel/record.json"

          echo "GHCI_READER_BUILD_COMPLETE system=$NIX_ROOT_SYSTEM name=${{ matrix.build.name }} attr=${{ matrix.build.attr }} outPath=$store_path durationSeconds=$duration"

      - name: Resolve flake lock baseline run
        id: flake-lock-baseline
        if: ${{ github.ref == 'refs/heads/update-flake-lock' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if ! pr_json="$(gh pr view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json baseRefOid)"; then
            echo "No flake lock pull request found for $GITHUB_REF_NAME."
            echo "base_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(jq -r '.baseRefOid' <<< "$pr_json")"
          base_run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/github-ci.yml/runs" \
              --method GET \
              --paginate \
              -f branch="$DEFAULT_BRANCH" \
              -f status=success \
              -F per_page=100 \
              --jq ".workflow_runs[] | select(.head_sha == \"$base_sha\" and .conclusion == \"success\") | .id" \
              | head -n 1
          )"

          echo "base_run_id=$base_run_id" >> "$GITHUB_OUTPUT"
          if [ -z "$base_run_id" ]; then
            echo "No successful GitHub CI run artifact found for base $base_sha."
          else
            echo "Using GitHub CI run $base_run_id as flake lock package-report baseline."
          fi

      - name: Download flake lock baseline artifact
        id: download-baseline-artifact
        if: ${{ github.ref == 'refs/heads/update-flake-lock' && steps.flake-lock-baseline.outputs.base_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.flake-lock-baseline.outputs.base_run_id }}
          github-token: ${{ github.token }}
          name: ghci-toplevel-${{ matrix.build.system }}-${{ matrix.build.kind }}-${{ matrix.build.name }}
          path: ${{ runner.temp }}/ghci-baseline

      - name: Add flake lock package report
        if: ${{ github.ref == 'refs/heads/update-flake-lock' }}
        shell: bash
        env:
          BASELINE_DOWNLOAD_OUTCOME: ${{ steps.download-baseline-artifact.outcome }}
          FLAKE_LOCK_BASE_RUN_ID: ${{ steps.flake-lock-baseline.outputs.base_run_id }}
        run: |
          set -euo pipefail

          record="$RUNNER_TEMP/ghci-toplevel/record.json"
          baseline_record="$RUNNER_TEMP/ghci-baseline/record.json"
          diff_output="$RUNNER_TEMP/dix.json"

          write_package_report() {
            local status="$1"
            local message="$2"
            local diff_file="${3:-}"

            if [ -n "$diff_file" ]; then
              jq \
                --arg status "$status" \
                --arg message "$message" \
                --slurpfile diff "$diff_file" \
                '. + {packageReport: {status: $status, message: $message, diff: $diff[0]}}' \
                "$record" > "$record.tmp"
            else
              jq \
                --arg status "$status" \
                --arg message "$message" \
                '. + {packageReport: {status: $status, message: $message, diff: null}}' \
                "$record" > "$record.tmp"
            fi

            mv "$record.tmp" "$record"
          }

          run_with_timeout() {
            perl -e 'alarm shift; exec @ARGV' "$@"
          }

          if [ -z "$FLAKE_LOCK_BASE_RUN_ID" ]; then
            write_package_report failed "baseline GitHub CI artifact unavailable"
            exit 0
          fi

          if [ "$BASELINE_DOWNLOAD_OUTCOME" != "success" ] || [ ! -s "$baseline_record" ]; then
            write_package_report failed "baseline artifact did not download"
            exit 0
          fi

          old_path="$(jq -r '.storePath' "$baseline_record")"
          new_path="$(jq -r '.storePath' "$record")"

          if ! run_with_timeout 240 nix-store --realise "$old_path" >/dev/null; then
            write_package_report failed "baseline closure did not realise within 4m"
            exit 0
          fi

          if ! nix run --accept-flake-config --inputs-from . nixpkgs-unstable#dix -- \
            --color never \
            --output json \
            "$old_path" "$new_path" > "$diff_output"; then
            write_package_report failed "closure diff failed"
            exit 0
          fi

          write_package_report success "" "$diff_output"

      - name: Upload top-level output artifact
        if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/update-flake-lock') }}
        uses: actions/upload-artifact@v7
        with:
          name: ghci-toplevel-${{ matrix.build.system }}-${{ matrix.build.kind }}-${{ matrix.build.name }}
          path: ${{ runner.temp }}/ghci-toplevel/record.json
          compression-level: 0

      - name: Report Nix usage
        if: ${{ always() && matrix.build.cacheKind == 'ext4' }}
        shell: bash
        run: |
          set -euo pipefail

          if mountpoint -q /nix; then
            df -h /nix
            sudo du -sh /nix /nix/store /nix/var/nix || true
          fi

  complete:
    name: "GitHub CI Complete"
    runs-on: ubuntu-24.04
    needs:
      - eval-ghci
      - build
    if: always()
    steps:
      - name: Check build result
        shell: bash
        env:
          EVAL_RESULT: ${{ needs.eval-ghci.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          if [ "$EVAL_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ]; then
            echo "::error ::GitHub CI did not complete successfully: eval=$EVAL_RESULT build=$BUILD_RESULT"
            exit 1
          fi

          echo "GitHub CI completed successfully."
