name: "GitHub CI"
run-name: "GitHub CI"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-ghci:
    name: "Evaluate Configurations"
    runs-on: ubuntu-24.04
    outputs:
      aarch64_darwin: ${{ steps.matrix.outputs.aarch64_darwin }}
      aarch64_linux: ${{ steps.matrix.outputs.aarch64_linux }}
      x86_64_linux: ${{ steps.matrix.outputs.x86_64_linux }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Emit build matrices
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          records="$(
            nix eval --impure --json --expr '
              let
                flake = builtins.getFlake (toString ./.);
                mkNixos = name: cfg: {
                  name = name;
                  kind = "nixosConfiguration";
                  system = cfg.pkgs.stdenv.hostPlatform.system;
                  attr = ".#nixosConfigurations.${name}.config.system.build.toplevel";
                };
                mkDarwin = name: cfg: {
                  name = name;
                  kind = "darwinConfiguration";
                  system = cfg.pkgs.stdenv.hostPlatform.system;
                  attr = ".#darwinConfigurations.${name}.config.system.build.toplevel";
                };
                nixos = builtins.attrValues (builtins.mapAttrs mkNixos (flake.nixosConfigurations or {}));
                darwin = builtins.attrValues (builtins.mapAttrs mkDarwin (flake.darwinConfigurations or {}));
              in
                nixos ++ darwin
            '
          )"

          aarch64_darwin="$(jq -c '[.[] | select(.system == "aarch64-darwin")]' <<< "$records")"
          aarch64_linux="$(jq -c '[.[] | select(.system == "aarch64-linux")]' <<< "$records")"
          x86_64_linux="$(jq -c '[.[] | select(.system == "x86_64-linux")]' <<< "$records")"

          {
            printf 'aarch64_darwin=%s\n' "$aarch64_darwin"
            printf 'aarch64_linux=%s\n' "$aarch64_linux"
            printf 'x86_64_linux=%s\n' "$x86_64_linux"
          } >> "$GITHUB_OUTPUT"

          echo "GHCI_MATRIX aarch64-darwin=$aarch64_darwin"
          echo "GHCI_MATRIX aarch64-linux=$aarch64_linux"
          echo "GHCI_MATRIX x86_64-linux=$x86_64_linux"

  aarch64-linux:
    name: "${{ matrix.build.name }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    needs: eval-ghci
    if: ${{ needs.eval-ghci.outputs.aarch64_linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.eval-ghci.outputs.aarch64_linux) }}
    env:
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-aarch64-linux-ext4-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-aarch64-linux
      NIX_ROOT_IMAGE_SIZE: 8G
      NIX_ROOT_SYSTEM: aarch64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mount ext4 Nix root
        uses: ./.github/actions/nix-ext4-mount
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: reader-${{ matrix.build.name }}
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Build and pack Nix store handoff
        shell: bash
        run: |
          set -euo pipefail

          build_name="${{ matrix.build.name }}"
          handoff_dir="$RUNNER_TEMP/nix-store-handoff-$build_name"
          file_store="$handoff_dir/file-store"
          upload_dir="$handoff_dir/upload"
          archive="$upload_dir/nix-store-handoff.tar.zst"
          manifest="$upload_dir/out-paths.txt"

          rm -rf "$handoff_dir"
          mkdir -p "$file_store" "$upload_dir"

          started="$SECONDS"
          out_paths_text="$(nix build \
            --accept-flake-config \
            --print-build-logs \
            --print-out-paths \
            --no-link \
            "${{ matrix.build.attr }}")"
          duration="$((SECONDS - started))"
          mapfile -t out_paths <<< "$out_paths_text"
          printf '%s\n' "${out_paths[@]}" > "$manifest"

          echo "GHCI_READER_BUILD_COMPLETE system=$NIX_ROOT_SYSTEM name=${{ matrix.build.name }} attr=${{ matrix.build.attr }} durationSeconds=$duration"

          started="$SECONDS"
          nix copy --to "file://$file_store" "${out_paths[@]}"
          duration="$((SECONDS - started))"
          echo "GHCI_HANDOFF_STORE_COPY_COMPLETE system=$NIX_ROOT_SYSTEM name=$build_name path=$file_store durationSeconds=$duration"

          started="$SECONDS"
          tar -C "$file_store" -I 'zstd -T0 -3' -cf "$archive" .
          duration="$((SECONDS - started))"
          echo "GHCI_HANDOFF_PACK_COMPLETE system=$NIX_ROOT_SYSTEM name=$build_name archive=$archive durationSeconds=$duration"

          ls -lh "$archive" "$manifest"
          du -sh "$file_store" "$upload_dir" || true

      - name: Upload Nix store handoff
        uses: actions/upload-artifact@v7
        with:
          name: nix-store-handoff-${{ env.NIX_ROOT_SYSTEM }}-${{ github.run_attempt }}-${{ matrix.build.name }}
          path: ${{ runner.temp }}/nix-store-handoff-${{ matrix.build.name }}/upload
          retention-days: 1
          compression-level: 0

      - name: Report Nix usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if mountpoint -q /nix; then
            df -h /nix
            sudo du -sh /nix /nix/store /nix/var/nix || true
          fi

      - name: Unmount ext4 Nix image
        if: always()
        uses: ./.github/actions/nix-ext4-unmount
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

  aarch64-linux-writer:
    name: "Cache aarch64-linux"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    needs:
      - eval-ghci
      - aarch64-linux
    if: ${{ success() && needs.eval-ghci.outputs.aarch64_linux != '[]' }}
    permissions:
      actions: write
      contents: read
    concurrency:
      group: github-cache-lane-aarch64-linux-${{ github.ref }}
      cancel-in-progress: false
    env:
      GHCI_BUILDS_JSON: ${{ needs.eval-ghci.outputs.aarch64_linux }}
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-aarch64-linux-ext4-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-aarch64-linux
      NIX_ROOT_IMAGE_SIZE: 8G
      NIX_ROOT_SYSTEM: aarch64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mount ext4 Nix root
        uses: ./.github/actions/nix-ext4-mount
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: writer
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: List Nix store handoffs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          handoff_prefix="nix-store-handoff-$NIX_ROOT_SYSTEM-$GITHUB_RUN_ATTEMPT-"
          handoffs="$RUNNER_TEMP/ghci-handoff-artifacts.tsv"
          actual_names="$RUNNER_TEMP/ghci-handoff-actual.txt"
          expected_names="$RUNNER_TEMP/ghci-handoff-expected.txt"

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | [.id, .name, .expired] | @tsv' \
            | awk -v prefix="$handoff_prefix" 'BEGIN { FS = OFS = "\t" } index($2, prefix) == 1 && $3 == "false" { print $1, $2 }' \
            > "$handoffs"

          cut -f2 "$handoffs" | sort > "$actual_names"
          jq -r --arg prefix "$handoff_prefix" '.[] | $prefix + .name' <<< "$GHCI_BUILDS_JSON" | sort > "$expected_names"

          count="$(wc -l < "$handoffs" | tr -d ' ')"
          expected_count="$(wc -l < "$expected_names" | tr -d ' ')"
          if ! diff -u "$expected_names" "$actual_names"; then
            echo "::error ::Nix store handoff artifact set does not match expected builds for prefix $handoff_prefix"
            exit 1
          fi

          echo "GHCI_HANDOFF_ARTIFACTS_FOUND system=$NIX_ROOT_SYSTEM count=$count expected=$expected_count prefix=$handoff_prefix"
          cat "$handoffs"

      - name: Download Nix store handoffs
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/ghci-handoffs
          pattern: nix-store-handoff-${{ env.NIX_ROOT_SYSTEM }}-${{ github.run_attempt }}-*

      - name: Import and root Nix store handoffs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          handoff_prefix="nix-store-handoff-$NIX_ROOT_SYSTEM-$GITHUB_RUN_ATTEMPT-"
          handoffs="$RUNNER_TEMP/ghci-handoff-artifacts.tsv"
          download_dir="$RUNNER_TEMP/ghci-handoffs"
          legacy_root_dir="/nix/var/nix/gcroots/ghci-cache-lanes/$NIX_ROOT_SYSTEM"
          root_dir="/nix/var/nix/gcroots/github-ci/$NIX_ROOT_SYSTEM"

          rm -rf "$legacy_root_dir"
          rm -rf "$root_dir"
          mkdir -p "$root_dir"

          while IFS=$'\t' read -r artifact_id artifact_name; do
            [ -n "$artifact_id" ] || continue

            build_name="${artifact_name#"$handoff_prefix"}"
            case "$build_name" in
              "" | */* | *..* | *[!A-Za-z0-9._-]*)
                echo "::error ::Unsafe handoff build name for gcroot path: $build_name"
                exit 1
                ;;
            esac

            artifact_dir="$download_dir/$artifact_name"
            if [ ! -d "$artifact_dir" ]; then
              artifact_dir="$download_dir"
            fi

            archive="$artifact_dir/nix-store-handoff.tar.zst"
            manifest="$artifact_dir/out-paths.txt"
            import_store="$RUNNER_TEMP/ghci-handoff-import-$artifact_id"

            if [ ! -s "$archive" ] || [ ! -s "$manifest" ]; then
              echo "::error ::Incomplete Nix store handoff artifact: $artifact_name"
              find "$artifact_dir" -maxdepth 2 -type f -print || true
              exit 1
            fi

            rm -rf "$import_store"
            mkdir -p "$import_store"

            started="$SECONDS"
            tar -C "$import_store" -I zstd -xf "$archive"
            duration="$((SECONDS - started))"
            echo "GHCI_HANDOFF_UNPACK_COMPLETE system=$NIX_ROOT_SYSTEM name=$build_name artifactId=$artifact_id durationSeconds=$duration"

            mapfile -t out_paths < "$manifest"
            if [ "${#out_paths[@]}" -eq 0 ]; then
              echo "::error ::No output paths in Nix store handoff manifest: $manifest"
              exit 1
            fi

            started="$SECONDS"
            nix copy --no-check-sigs --from "file://$import_store" "${out_paths[@]}"
            duration="$((SECONDS - started))"

            out_path="${out_paths[$((${#out_paths[@]} - 1))]}"
            ln -sfn "$out_path" "$root_dir/$build_name"
            echo "GHCI_HANDOFF_IMPORT_COMPLETE system=$NIX_ROOT_SYSTEM name=$build_name outPath=$out_path gcroot=$root_dir/$build_name durationSeconds=$duration"

            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; then
              echo "GHCI_HANDOFF_ARTIFACT_DELETED system=$NIX_ROOT_SYSTEM name=$build_name artifactId=$artifact_id"
            else
              echo "::warning title=Artifact cleanup failed::Could not delete Nix store handoff artifact $artifact_id after import."
              echo "GHCI_HANDOFF_ARTIFACT_DELETE_FAILED system=$NIX_ROOT_SYSTEM name=$build_name artifactId=$artifact_id"
            fi
          done < "$handoffs"

      - name: Pack ext4 Nix root
        uses: ./.github/actions/nix-ext4-pack
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Unmount ext4 Nix image
        if: always()
        uses: ./.github/actions/nix-ext4-unmount
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Start cache save timer
        if: success()
        shell: bash
        run: echo "NIX_ROOT_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Save ext4 image cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nix-root-ci-aarch64-linux/nix-root.ext4.zst
          key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report ext4 cache save
        if: success()
        uses: ./.github/actions/github-cache-save-report
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Prune cache lane
        if: success()
        uses: ./.github/actions/github-cache-prune
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          keep-cache-key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

  x86_64-linux:
    name: "${{ matrix.build.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    needs: eval-ghci
    if: ${{ needs.eval-ghci.outputs.x86_64_linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.eval-ghci.outputs.x86_64_linux) }}
    env:
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-x86_64-linux-ext4-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-x86_64-linux
      NIX_ROOT_IMAGE_SIZE: 8G
      NIX_ROOT_SYSTEM: x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mount ext4 Nix root
        uses: ./.github/actions/nix-ext4-mount
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: reader-${{ matrix.build.name }}
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Build configuration
        shell: bash
        run: |
          set -euo pipefail

          started="$SECONDS"
          nix build \
            --accept-flake-config \
            --print-build-logs \
            --print-out-paths \
            --no-link \
            "${{ matrix.build.attr }}"
          duration="$((SECONDS - started))"
          echo "GHCI_READER_BUILD_COMPLETE system=$NIX_ROOT_SYSTEM name=${{ matrix.build.name }} attr=${{ matrix.build.attr }} durationSeconds=$duration"

      - name: Report Nix usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if mountpoint -q /nix; then
            df -h /nix
            sudo du -sh /nix /nix/store /nix/var/nix || true
          fi

      - name: Unmount ext4 Nix image
        if: always()
        uses: ./.github/actions/nix-ext4-unmount
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

  x86-64-linux-writer:
    name: "Cache x86_64-linux"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    needs:
      - eval-ghci
      - x86_64-linux
    if: ${{ success() && needs.eval-ghci.outputs.x86_64_linux != '[]' }}
    permissions:
      actions: write
      contents: read
    concurrency:
      group: github-cache-lane-x86_64-linux-${{ github.ref }}
      cancel-in-progress: false
    env:
      GHCI_BUILDS_JSON: ${{ needs.eval-ghci.outputs.x86_64_linux }}
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-x86_64-linux-ext4-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-x86_64-linux
      NIX_ROOT_IMAGE_SIZE: 16G
      NIX_ROOT_SYSTEM: x86_64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mount ext4 Nix root
        uses: ./.github/actions/nix-ext4-mount
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: writer
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Build and root GHCI lane
        uses: ./.github/actions/nix-root-build
        with:
          builds-json: ${{ env.GHCI_BUILDS_JSON }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Pack ext4 Nix root
        uses: ./.github/actions/nix-ext4-pack
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Unmount ext4 Nix image
        if: always()
        uses: ./.github/actions/nix-ext4-unmount
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Start cache save timer
        if: success()
        shell: bash
        run: echo "NIX_ROOT_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Save ext4 image cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nix-root-ci-x86_64-linux/nix-root.ext4.zst
          key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report ext4 cache save
        if: success()
        uses: ./.github/actions/github-cache-save-report
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Prune cache lane
        if: success()
        uses: ./.github/actions/github-cache-prune
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          keep-cache-key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

  aarch64-darwin:
    name: "${{ matrix.build.name }}"
    runs-on: macos-26
    timeout-minutes: 355
    needs: eval-ghci
    if: ${{ needs.eval-ghci.outputs.aarch64_darwin != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.eval-ghci.outputs.aarch64_darwin) }}
    env:
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-aarch64-darwin-sparsebundle-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-aarch64-darwin
      NIX_ROOT_IMAGE_SIZE: 30g
      NIX_ROOT_SYSTEM: aarch64-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mount sparsebundle Nix root
        uses: ./.github/actions/nix-sparsebundle-mount
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: reader-${{ matrix.build.name }}
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Build configuration
        shell: bash
        run: |
          set -euo pipefail

          started="$SECONDS"
          nix build \
            --accept-flake-config \
            --print-build-logs \
            --print-out-paths \
            --no-link \
            "${{ matrix.build.attr }}"
          duration="$((SECONDS - started))"
          echo "GHCI_READER_BUILD_COMPLETE system=$NIX_ROOT_SYSTEM name=${{ matrix.build.name }} attr=${{ matrix.build.attr }} durationSeconds=$duration"

      - name: Detach sparsebundle Nix root
        if: always()
        uses: ./.github/actions/nix-sparsebundle-unmount
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

  aarch64-darwin-writer:
    name: "Cache aarch64-darwin"
    runs-on: macos-26
    timeout-minutes: 355
    needs:
      - eval-ghci
      - aarch64-darwin
    if: ${{ success() && needs.eval-ghci.outputs.aarch64_darwin != '[]' }}
    permissions:
      actions: write
      contents: read
    concurrency:
      group: github-cache-lane-aarch64-darwin-${{ github.ref }}
      cancel-in-progress: false
    env:
      GHCI_BUILDS_JSON: ${{ needs.eval-ghci.outputs.aarch64_darwin }}
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-aarch64-darwin-sparsebundle-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-aarch64-darwin
      NIX_ROOT_IMAGE_SIZE: 30g
      NIX_ROOT_SYSTEM: aarch64-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mount sparsebundle Nix root
        uses: ./.github/actions/nix-sparsebundle-mount
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: writer
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Build and root GHCI lane
        uses: ./.github/actions/nix-root-build
        with:
          builds-json: ${{ env.GHCI_BUILDS_JSON }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Pack sparsebundle Nix root
        uses: ./.github/actions/nix-sparsebundle-pack
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Detach sparsebundle Nix root after failure
        if: always()
        uses: ./.github/actions/nix-sparsebundle-unmount
        with:
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Start cache save timer
        if: success()
        shell: bash
        run: echo "NIX_ROOT_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Save sparsebundle cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nix-root-ci-aarch64-darwin/nix-root.sparsebundle
          key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report sparsebundle cache save
        if: success()
        uses: ./.github/actions/github-cache-save-report
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Prune cache lane
        if: success()
        uses: ./.github/actions/github-cache-prune
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          keep-cache-key: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          system: ${{ env.NIX_ROOT_SYSTEM }}
