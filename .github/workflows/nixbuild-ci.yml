name: "Nixbuild CI"
run-name: "Nixbuild CI"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Builders:
    name: "${{ matrix.build.name }} (${{ matrix.build.system }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: jaeger
            system: aarch64-linux
            attr: .#nixosConfigurations.jaeger.config.system.build.toplevel
          - name: kronos
            system: x86_64-linux
            attr: .#nixosConfigurations.kronos.config.system.build.toplevel
          - name: oculus
            system: x86_64-linux
            attr: .#nixosConfigurations.oculus.config.system.build.toplevel
          - name: omnius
            system: x86_64-linux
            attr: .#nixosConfigurations.omnius.config.system.build.toplevel
          - name: onager
            system: x86_64-linux
            attr: .#nixosConfigurations.onager.config.system.build.toplevel
          - name: orthus
            system: x86_64-linux
            attr: .#nixosConfigurations.orthus.config.system.build.toplevel
          - name: pascal
            system: x86_64-linux
            attr: .#nixosConfigurations.pascal.config.system.build.toplevel
          - name: rapier
            system: x86_64-linux
            attr: .#nixosConfigurations.rapier.config.system.build.toplevel
          - name: sortie
            system: x86_64-linux
            attr: .#nixosConfigurations.sortie.config.system.build.toplevel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            narinfo-cache-negative-ttl = 0
            max-jobs = auto

      - name: Configure nixbuild.net
        uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Linux configuration in nixbuild remote store
        shell: bash
        run: |
          set -euo pipefail

          df -h
          started="$SECONDS"
          nix build \
            --accept-flake-config \
            --print-build-logs \
            --print-out-paths \
            --builders "" \
            --max-jobs 2 \
            --eval-store auto \
            --store ssh-ng://eu.nixbuild.net \
            "${{ matrix.build.attr }}"
          duration="$((SECONDS - started))"
          echo "NIXBUILD_REMOTE_STORE_BUILD_COMPLETE name=${{ matrix.build.name }} system=${{ matrix.build.system }} attr=${{ matrix.build.attr }} store=ssh-ng://eu.nixbuild.net durationSeconds=$duration"
