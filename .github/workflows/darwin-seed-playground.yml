name: Darwin Compressed Image Playground

on:
  push:
    branches: [feat/ci-optimisation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darwin-seed-playground-${{ github.ref }}
  cancel-in-progress: false

env:
  FIXTURE_SHA: 14a8d7657900a917560ddbe77577c0d5a1b77638
  CONTROL_KEY: nix-root-ci-aarch64-darwin-sparsebundle-v1-fp-33ae17904b7a7bedebd628346a9f600e8ddf3b990dd6a60fbe8d5f2b11f5caa6-33891132223-1

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/nix-root-ci-aarch64-darwin/nix-root.sparsebundle
          key: ${{ env.CONTROL_KEY }}
          fail-on-cache-miss: true
      - name: Convert full frozen store to LZFSE DMG
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/darwin-dmg"
          started="$SECONDS"
          hdiutil convert "$RUNNER_TEMP/nix-root-ci-aarch64-darwin/nix-root.sparsebundle" \
            -format ULFO -o "$RUNNER_TEMP/darwin-dmg/nix-root.dmg"
          elapsed="$((SECONDS - started))"
          cd "$RUNNER_TEMP/darwin-dmg"
          shasum -a 256 nix-root.dmg > image.sha256
          jq -n --arg source "$CONTROL_KEY" --arg producer "$GITHUB_SHA" \
            --argjson bytes "$(stat -f %z nix-root.dmg)" --argjson seconds "$elapsed" \
            '{source:$source,producer:$producer,imageBytes:$bytes,convertSeconds:$seconds,format:"ULFO"}' > metadata.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/darwin-dmg
          key: fast-ci-darwin-dmg-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: darwin-dmg-metadata
          path: |
            ${{ runner.temp }}/darwin-dmg/*.json
            ${{ runner.temp }}/darwin-dmg/*.sha256

  trial:
    needs: seed
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: [1, 2, 3]
        pack: [full, dmg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start timing
        env:
          IMAGE_DIR: nix-root-ci-aarch64-darwin
        run: |
          echo "NIX_ROOT_IMAGE_BUNDLE=$RUNNER_TEMP/$IMAGE_DIR/nix-root.sparsebundle" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/measurements"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/setup-start.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          path: fixture
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: matrix.pack == 'full'
        with:
          path: ${{ runner.temp }}/nix-root-ci-aarch64-darwin/nix-root.sparsebundle
          key: ${{ env.CONTROL_KEY }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: matrix.pack == 'dmg'
        with:
          path: ${{ runner.temp }}/darwin-dmg
          key: fast-ci-darwin-dmg-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/nix-sparsebundle-mount
        if: matrix.pack == 'full'
        with:
          image-size: 64g
          system: aarch64-darwin
      - name: Mount compressed image with writable shadow
        if: matrix.pack == 'dmg'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/darwin-dmg"
          shasum -a 256 --check image.sha256
          sudo touch /etc/synthetic.conf
          if ! grep -qx nix /etc/synthetic.conf; then
            if grep -qE '^nix($|[[:space:]])' /etc/synthetic.conf; then
              echo 'Conflicting synthetic /nix entry'
              exit 1
            fi
            printf 'nix\n' | sudo tee -a /etc/synthetic.conf >/dev/null
          fi
          sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -B >/dev/null 2>&1 \
            || sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -t >/dev/null 2>&1 \
            || true
          test -d /nix
          test ! -L /nix
          # SHA-256 above verifies compressed bytes without eagerly decoding the image.
          sudo hdiutil attach -noverify -mountpoint /nix -nobrowse \
            -shadow "$RUNNER_TEMP/nix-root.shadow" nix-root.dmg
          sudo chown "$USER" /nix
          chmod u+rwx /nix
      - uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Measure Darwin build
        working-directory: fixture
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/build-start.txt"
          python3 ../.github/scripts/fast-ci-measure.py "$RUNNER_TEMP/measurements" -- \
            nix run .#packages.aarch64-darwin.nix-fast-build -- \
            --flake .#ci.darwin --systems aarch64-darwin --eval-workers 1 \
            --cachix-cache whitestrake --retries 2 \
            --result-file "$RUNNER_TEMP/measurements/results.json" -j 50 --stream-json-lines
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/build-end.txt"
      - name: Record environment
        if: always()
        env:
          PACK: ${{ matrix.pack }}
          ROUND: ${{ matrix.round }}
        run: |
          jq -n --arg treatment "$PACK" --arg fixture "$FIXTURE_SHA" --arg harness "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg round "$ROUND" --arg runnerImage "${ImageVersion:-unknown}" \
            --arg cpu "$(sysctl -n machdep.cpu.brand_string)" \
            '{treatment:$treatment,fixture:$fixture,harness:$harness,run:$run,round:$round,runnerImage:$runnerImage,cpu:$cpu}' \
            > "$RUNNER_TEMP/measurements/environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trial-${{ matrix.round }}-${{ matrix.pack }}
          path: ${{ runner.temp }}/measurements
