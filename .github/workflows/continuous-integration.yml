name: CI
on:
  push:
    branches: ['**']
    tags-ignore: ['ci-cache-v1-*']
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Optional Release restore or cold reconstruction
        type: choice
        options: [warm, cold]
        default: warm
      cache_release_id:
        description: Optional pinned Release ID
        type: string
        default: ""
permissions:
  contents: read
# The newest run on a ref wins; a cancelled deploy is picked up from the deployed-host pins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-builds:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
      actions: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select cache generation
        uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - name: Prepare Linux build environment
        uses: ./.github/actions/ci-cache-restore
        with:
          component: linux-seed-x86_64-linux
      - name: Configure remote Linux builders
        uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Linux configurations
        run: bash .github/scripts/ci-nfb.sh linux-hosts x86_64-linux
      - name: Publish Linux build records
        id: records
        run: echo "records=$(cat "$RUNNER_TEMP/ci-results/records.json")" >> "$GITHUB_OUTPUT"
  source-checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select cache generation
        uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - name: Prepare Linux build environment
        uses: ./.github/actions/ci-cache-restore
        with:
          component: linux-seed-x86_64-linux
      - name: Run source checks
        run: bash .github/scripts/ci-nfb.sh linux-checks x86_64-linux
  darwin-builds:
    name: Darwin
    runs-on: macos-26
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
      actions: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select cache generation
        uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - name: Prepare Darwin build environment
        uses: ./.github/actions/ci-darwin-prepare
        with:
          mode: hot
          configure-cachix: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Darwin configurations
        timeout-minutes: ${{ inputs.cache_mode == 'cold' && 330 || 60 }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          "$HOST_PYTHON" .github/scripts/ci_darwin.py run --state "$RUNNER_TEMP/darwin" \
            -- /bin/bash .github/scripts/ci-nfb.sh darwin aarch64-darwin
      - name: Publish selected Darwin records
        id: records
        run: echo "records=$(cat "$RUNNER_TEMP/darwin/selected/records.json")" >> "$GITHUB_OUTPUT"
        # The hosted VM owns final store disposal; recovery still detaches before reuse.
  all-builds:
    name: "All Builds"
    needs:
      - linux-builds
      - darwin-builds
      - source-checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.promote.outputs.matrix }}
    concurrency:
      group: >-
        ${{
          github.ref == 'refs/heads/master'
          && 'cachix-deploy-master'
          || format('ci-all-builds-{0}', github.run_id)
        }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Report platform lane durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name == "Linux" or .name == "Darwin" or .name == "Checks") | select(.completed_at)
              | [.name, ((.completed_at | fromdate) - (.started_at | fromdate))] | @tsv' > "$RUNNER_TEMP/lanes.tsv"
          { echo '| Lane | Seconds |'; echo '|---|---:|'; awk -F'\t' '{print "| " $1 " | " $2 " |"}' "$RUNNER_TEMP/lanes.tsv"; } >> "$GITHUB_STEP_SUMMARY"
          awk -F'\t' '$2 > 180 {print "::warning ::" $1 " lane took " $2 " s (budget 180 s)"}' "$RUNNER_TEMP/lanes.tsv"

      - name: Require successful platform builds
        env:
          LINUX_RESULT: ${{ needs.linux-builds.result }}
          DARWIN_RESULT: ${{ needs.darwin-builds.result }}
          SOURCE_RESULT: ${{ needs.source-checks.result }}
        run: |
          if [ "$LINUX_RESULT" != success ] || [ "$DARWIN_RESULT" != success ] || [ "$SOURCE_RESULT" != success ]; then
            echo "::error ::Every build and source check must succeed: linux=$LINUX_RESULT darwin=$DARWIN_RESULT source=$SOURCE_RESULT"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Publish proof and promote built configurations
        id: promote
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LINUX_RECORDS: ${{ needs.linux-builds.outputs.records }}
          DARWIN_RECORDS: ${{ needs.darwin-builds.outputs.records }}
        run: |
          set -euo pipefail
          source modules/deployment/scripts/cachix-pin-functions.sh
          cache=https://whitestrake.cachix.org
          records="$(jq -cn --argjson linux "$LINUX_RECORDS" --argjson darwin "$DARWIN_RECORDS" '$linux + $darwin')"
          mapfile -t paths < <(jq -r '.[].storePath' <<< "$records")
          nix path-info --store "$cache" "${paths[@]}" >/dev/null

          # Only toplevels built with the cachix-agent aspect carry deploy-rollback.
          mkdir "$RUNNER_TEMP/meta"
          pids=()
          while IFS=$'\t' read -r name path; do
            (
              set -euo pipefail
              system="$(nix store cat --store "$cache" "$path/system")"
              rollback=""
              if nix store ls --json --store "$cache" "$path" | jq -e '.entries | has("deploy-rollback")' >/dev/null; then
                rollback="$(nix store cat --store "$cache" "$path/deploy-rollback")"
              fi
              jq -cn --arg name "$name" --arg system "$system" --arg rollback "$rollback" \
                '{$name, $system} + if $rollback == "" then {} else {rollbackScript: $rollback} end' > "$RUNNER_TEMP/meta/$name.json"
            ) &
            pids+=("$!")
          done < <(jq -r '.[] | [.name, .storePath] | @tsv' <<< "$records")
          for pid in "${pids[@]}"; do wait "$pid"; done
          records="$(jq -cs --argjson records "$records" 'INDEX(.[]; .name) as $meta | $records | map(. + $meta[.name]) | sort_by(.system, .attr)' "$RUNNER_TEMP"/meta/*.json)"

          jq -cS --arg revision "$GITHUB_SHA" '{$revision, records: map({attr, system, storePath})}' <<< "$records" > "$RUNNER_TEMP/ci-build-proof.json"
          proof_path="$(nix store add --mode flat --name ci-build-proof.json "$RUNNER_TEMP/ci-build-proof.json")"
          cachix push whitestrake "$proof_path"

          pins="$(cachix_fetch_pins whitestrake)"
          matrix="$(jq -c --argjson pins "$pins" '
            (INDEX($pins[]?; .name) | map_values(.lastRevision.storePath)) as $pinned
            | {include: map(select(has("rollbackScript") and $pinned["deployed-host-" + .name] != .storePath)
                | {host: .name, system, storePath, rollbackScript})}' <<< "$records")"
          {
            echo "Proof: \`$proof_path\`"
            echo
            echo '```json'
            jq . <<< "$matrix"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$GITHUB_REF" = refs/heads/master ] || exit 0
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping stale promotion: run=$GITHUB_SHA master=$current"
            exit 0
          fi
          while IFS=$'\t' read -r name path; do
            if [ "$(cachix_pin_path "$pins" "built-host-$name")" != "$path" ]; then
              cachix_pin_store_path whitestrake "built-host-$name" "$path" 3
            fi
          done < <(jq -r '.[] | [.name, .storePath] | @tsv' <<< "$records")
          cachix_pin_store_path whitestrake successful-master-build "$proof_path" 3
          if [ "$(jq '.include | length' <<< "$matrix")" != 0 ]; then
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    needs: all-builds
    if: ${{ github.ref == 'refs/heads/master' && needs.all-builds.outputs.matrix != '' }}
    uses: ./.github/workflows/continuous-deployment.yml
    with:
      deployment_sha: ${{ github.sha }}
      deployment_source: continuous-integration
      matrix: ${{ needs.all-builds.outputs.matrix }}
    secrets:
      CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
