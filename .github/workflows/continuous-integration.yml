name: "CI"

on:
  push:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
      nfb-version:
        description: "Temporary nix-fast-build version"
        required: false
        default: 1.6.0
        type: choice
        options:
          - 1.6.0
          - 2.0.1
      eval-workers:
        description: "Linux nix-fast-build evaluation workers"
        required: false
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      publish-checks:
        description: "Publish Linux Checks API updates"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-builds:
    name: "Linux"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Configure nixbuild.net
        uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Linux configurations
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NFB_VERSION: ${{ inputs.nfb-version || '1.6.0' }}
          NFB_EVAL_WORKERS: ${{ inputs.eval-workers || '3' }}
          NFB_PUBLISH_CHECKS: ${{ inputs.publish-checks || 'true' }}
        run: |
          set -euo pipefail

          case "$NFB_VERSION" in
            1.6.0) nix_fast_build_package_attr=nix-fast-build ;;
            2.0.1) nix_fast_build_package_attr=nix-fast-build-gate3 ;;
            *) echo "::error::Unsupported nix-fast-build version: $NFB_VERSION"; exit 1 ;;
          esac
          case "$NFB_EVAL_WORKERS" in
            1 | 2 | 3) ;;
            *) echo "::error::Unsupported evaluation worker count: $NFB_EVAL_WORKERS"; exit 1 ;;
          esac
          publish_checks=()
          case "$NFB_PUBLISH_CHECKS" in
            true) publish_checks=(--publish-checks) ;;
            false) ;;
            *) echo "::error::Unsupported Checks API setting: $NFB_PUBLISH_CHECKS"; exit 1 ;;
          esac

          monotonic_milliseconds() {
            python3 -c 'import time; print(time.monotonic_ns() // 1_000_000)'
          }
          nix_fast_build_bootstrap_started="$(monotonic_milliseconds)"
          nix_fast_build_store_path="$(
            nix build \
              --option builders '' \
              --option max-jobs auto \
              --no-link \
              --print-out-paths \
              ".#packages.x86_64-linux.$nix_fast_build_package_attr"
          )"
          nix_fast_build_bootstrap_finished="$(monotonic_milliseconds)"
          nix_fast_build=("$nix_fast_build_store_path/bin/nix-fast-build")
          echo "NFB_GATE3_BOOTSTRAP_COMPLETE version=$NFB_VERSION durationMilliseconds=$((nix_fast_build_bootstrap_finished - nix_fast_build_bootstrap_started))"
          echo "NFB_GATE3_CELL version=$NFB_VERSION evalWorkers=$NFB_EVAL_WORKERS nixVersion=$(nix --version | awk '{print $3}') packageAttr=$nix_fast_build_package_attr packagePath=$nix_fast_build_store_path"

          nix_fast_build_lane_started="$(monotonic_milliseconds)"
          nix_fast_build_status=0
          python3 .github/scripts/nix_fast_build.py "${publish_checks[@]}" \
            --event-log "$RUNNER_TEMP/ci-linux-events.jsonl" \
            -- \
            "${nix_fast_build[@]}" \
            --flake .#ci.linux \
            --systems 'x86_64-linux aarch64-linux' \
            --eval-workers "$NFB_EVAL_WORKERS" \
            --store ssh-ng://eu.nixbuild.net \
            --option builders '' \
            --option max-jobs 2 \
            --retries 2 \
            --result-file "$RUNNER_TEMP/ci-linux-results.json" \
            -j 50 || nix_fast_build_status=$?
          nix_fast_build_lane_finished="$(monotonic_milliseconds)"
          result_sha256=unavailable
          eval_count=0
          build_count=0
          if [ -s "$RUNNER_TEMP/ci-linux-events.jsonl" ]; then
            eval_count="$(jq -s '[.[] | select(.type == "EVAL")] | length' "$RUNNER_TEMP/ci-linux-events.jsonl")"
            build_count="$(jq -s '[.[] | select(.type == "BUILD")] | length' "$RUNNER_TEMP/ci-linux-events.jsonl")"
          fi
          if [ -s "$RUNNER_TEMP/ci-linux-results.json" ]; then
            if ! result_sha256="$(
              jq -cS \
                '[.results[] | select(.type == "EVAL" or .type == "BUILD") | {type, attr, success, outputs: (.outputs // {})}] | sort_by(.type, .attr, .success, (.outputs | tojson))' \
                "$RUNNER_TEMP/ci-linux-results.json" \
                | sha256sum \
                | cut -d' ' -f1
            )"; then
              result_sha256=malformed
            fi
          fi
          echo "NFB_GATE3_COMPLETE version=$NFB_VERSION evalWorkers=$NFB_EVAL_WORKERS status=$nix_fast_build_status durationMilliseconds=$((nix_fast_build_lane_finished - nix_fast_build_lane_started)) resultSha256=$result_sha256 evalCount=$eval_count buildCount=$build_count"
          exit "$nix_fast_build_status"

      - name: Upload Linux NFB results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-linux-results
          path: |
            ${{ runner.temp }}/ci-linux-results.json
            ${{ runner.temp }}/ci-linux-events.jsonl
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7

  darwin-builds:
    name: "Darwin"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'linux' }}
    runs-on: macos-26
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
    env:
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-aarch64-darwin-sparsebundle-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-aarch64-darwin
      NIX_ROOT_IMAGE_SIZE: 64g
      NIX_ROOT_SYSTEM: aarch64-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore sparsebundle Nix root cache
        uses: ./.github/actions/nix-sparsebundle-cache-restore
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: reader
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Mount sparsebundle Nix root
        uses: ./.github/actions/nix-sparsebundle-mount
        with:
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build Darwin configurations
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          df -h

          nix_fast_build_prepare_started="$SECONDS"
          cached_nix_fast_build="/nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build"
          nix_fast_build=()
          if [ -d "$cached_nix_fast_build" ]; then
            cached_nix_fast_build="$(cd -P "$cached_nix_fast_build" && pwd)/bin/nix-fast-build"
            if [ -x "$cached_nix_fast_build" ] && "$cached_nix_fast_build" --help >/dev/null; then
              nix_fast_build=("$cached_nix_fast_build")
              echo "NIX_FAST_BUILD_SOURCE source=cache-root path=$cached_nix_fast_build"
            fi
          fi
          if [ "${#nix_fast_build[@]}" -eq 0 ]; then
            nix_fast_build_store_path="$(
              nix build \
                --no-link \
                --print-out-paths \
                .#packages.aarch64-darwin.nix-fast-build
            )"
            nix_fast_build=("$nix_fast_build_store_path/bin/nix-fast-build")
            echo "NIX_FAST_BUILD_SOURCE source=nix-build path=${nix_fast_build[0]}"

            nix_eval_jobs_store_path="$(
              nix build \
                --inputs-from . \
                --no-link \
                --print-out-paths \
                nixpkgs-unstable#nix-eval-jobs
            )"
            migration_started="$SECONDS"
            set +e
            perl -e 'alarm shift; exec @ARGV' \
              60 \
              "$nix_eval_jobs_store_path/bin/nix-eval-jobs" \
              --workers 1 \
              --expr '{}' \
              >/dev/null
            migration_status="$?"
            set -e
            if [ "$migration_status" -ne 0 ]; then
              echo "::error ::Nix store migration preflight failed with status $migration_status."
              lsof -F pcfn /nix/var/nix/db/big-lock || true
              exit "$migration_status"
            fi
            echo "NIX_STORE_MIGRATION_PREFLIGHT_COMPLETE durationSeconds=$((SECONDS - migration_started))"
          fi
          echo "NIX_FAST_BUILD_PREPARE_COMPLETE durationSeconds=$((SECONDS - nix_fast_build_prepare_started))"

          python3 .github/scripts/nix_fast_build.py --publish-checks -- \
            "${nix_fast_build[@]}" \
            --flake .#ci.darwin \
            --systems aarch64-darwin \
            --eval-workers 1 \
            --cachix-cache whitestrake \
            --retries 2 \
            --result-file "$RUNNER_TEMP/ci-darwin-results.json" \
            -j 50

      - name: Upload Darwin NFB results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-darwin-results
          path: ${{ runner.temp }}/ci-darwin-results.json
          compression-level: 0
          retention-days: 7

  all-builds:
    name: "All Builds"
    needs:
      - linux-builds
      - darwin-builds
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.platform != 'linux') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      actions: write
      contents: read
    steps:
      - name: Require successful platform builds
        env:
          LINUX_RESULT: ${{ needs.linux-builds.result }}
          DARWIN_RESULT: ${{ needs.darwin-builds.result }}
        run: |
          if [ "$LINUX_RESULT" != success ] || [ "$DARWIN_RESULT" != success ]; then
            echo "::error ::Linux and Darwin builds must both succeed: linux=$LINUX_RESULT darwin=$DARWIN_RESULT"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Download Linux NFB results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-linux-results
          path: ${{ runner.temp }}

      - name: Download Darwin NFB results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-darwin-results
          path: ${{ runner.temp }}

      - name: Assemble build manifest
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          jq -ce -f .github/scripts/nix-fast-build-records.jq \
            "$RUNNER_TEMP/ci-linux-results.json" > "$RUNNER_TEMP/ci-linux-records.json"
          jq -ce -f .github/scripts/nix-fast-build-records.jq \
            "$RUNNER_TEMP/ci-darwin-results.json" > "$RUNNER_TEMP/ci-darwin-records.json"

          records="$(
            jq -sce 'add' \
              "$RUNNER_TEMP/ci-linux-records.json" \
              "$RUNNER_TEMP/ci-darwin-records.json"
          )"

          if ! jq -e '
            type == "array"
            and length > 0
            and all(.[]; (
              type == "object"
              and (.attr | type == "string" and test("^(nixosConfigurations|darwinConfigurations)\\.[A-Za-z0-9_-]+$"))
              and (.kind | type == "string" and length > 0)
              and (.name | type == "string" and test("^[A-Za-z0-9_-]+$"))
              and (.storePath | type == "string" and test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$"))
            ))
          ' <<< "$records" >/dev/null; then
            echo "::error ::Nix Fast Build produced malformed configuration records."
            exit 1
          fi

          artifact_metadata_dir="$RUNNER_TEMP/ci-artifact-metadata"
          mkdir -p "$artifact_metadata_dir"
          artifact_pids=()
          while IFS=$'\t' read -r index kind name store_path; do
            (
              set -euo pipefail

              cache_store="https://whitestrake.cachix.org"
              system="$(nix store cat --store "$cache_store" "$store_path/system")"
              rollback_script=""
              if [ "$kind" = "nixosConfiguration" ]; then
                dependencies="$(nix store cat --store "$cache_store" "$store_path/extra-dependencies")"
                rollback_matches="$(
                  jq -cn \
                    --arg dependencies "$dependencies" \
                    --arg name "$name" \
                    '[
                      $dependencies
                      | scan("/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+")
                      | select(endswith("-deploy-health-rollback-script-" + $name))
                    ]'
                )"
                rollback_count="$(jq -r 'length' <<< "$rollback_matches")"
                if [ "$rollback_count" -gt 1 ]; then
                  echo "::error ::Multiple host-specific rollback scripts found for $name."
                  exit 1
                elif [ "$rollback_count" = 1 ]; then
                  rollback_script="$(jq -r '.[0]' <<< "$rollback_matches")"
                fi
              fi

              jq -cn \
                --argjson index "$index" \
                --arg system "$system" \
                --arg rollbackScript "$rollback_script" \
                '{
                  index: $index,
                  system: $system
                } + if $rollbackScript == "" then {} else {rollbackScript: $rollbackScript} end' \
                > "$artifact_metadata_dir/$index.json"
            ) &
            artifact_pids+=("$!")
          done < <(
            jq -r 'to_entries[] | [.key, .value.kind, .value.name, .value.storePath] | @tsv' <<< "$records"
          )

          artifact_status=0
          for artifact_pid in "${artifact_pids[@]}"; do
            if ! wait "$artifact_pid"; then
              artifact_status=1
            fi
          done
          if [ "$artifact_status" -ne 0 ]; then
            echo "::error ::Failed to read one or more CI artefacts from Cachix."
            exit 1
          fi

          artifact_metadata="$(jq -sc '.' "$artifact_metadata_dir"/*.json)"
          mkdir -p "$RUNNER_TEMP/ci-build-records"
          jq -cne \
            --argjson records "$records" \
            --argjson metadata "$artifact_metadata" '
              ($records | to_entries) as $entries
              | if ($metadata | length) != ($entries | length) then
                  error("Cachix artefact metadata count does not match build records")
                elif (($metadata | map(.index) | sort) != [range(0; ($entries | length))]) then
                  error("Cachix artefact metadata indexes are not unique and complete")
                elif any($metadata[]; (
                  type != "object"
                  or (.index | type != "number")
                  or (.system | type != "string")
                  or (has("rollbackScript") and (.rollbackScript | type != "string"))
                )) then
                  error("invalid Cachix artefact metadata")
                else
                  $entries
                  | map(
                      . as $entry
                      | ($metadata[] | select(.index == $entry.key)) as $metadata_entry
                      | $entry.value
                        + {system: $metadata_entry.system}
                        + (if ($metadata_entry.rollbackScript // "") == ""
                           then {}
                           else {rollbackScript: $metadata_entry.rollbackScript}
                           end)
                    )
                end
              | sort_by(.system, .attr) as $records
              | ($records
                  | map(select(.system != "aarch64-darwin" and .system != "aarch64-linux" and .system != "x86_64-linux") | .system)
                  | unique) as $unknown_systems
              | ($records | group_by(.attr) | map(select(length > 1) | .[0].attr)) as $duplicate_attrs
              | ($records | group_by(.name) | map(select(length > 1) | .[0].name)) as $duplicate_names
              | if ($unknown_systems | length) > 0 then
                  error("unknown CI systems: \($unknown_systems | join(", "))")
                elif ($duplicate_attrs | length) > 0 then
                  error("duplicate CI attributes: \($duplicate_attrs | join(", "))")
                elif ($duplicate_names | length) > 0 then
                  error("duplicate CI configuration names: \($duplicate_names | join(", "))")
                elif (["aarch64-darwin", "aarch64-linux", "x86_64-linux"] - ($records | map(.system) | unique) | length) > 0 then
                  error("CI records do not cover all systems")
                elif any($records[]; (
                  (.attr | type != "string" or test("^(nixosConfigurations|darwinConfigurations)\\.[A-Za-z0-9_-]+$") | not)
                  or (.kind | type != "string" or length == 0)
                  or (.name | type != "string" or test("^[A-Za-z0-9_-]+$") | not)
                  or (.system | type != "string" or (. == "aarch64-darwin" or . == "aarch64-linux" or . == "x86_64-linux") | not)
                  or (.storePath | type != "string" or test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$") | not)
                  or (has("rollbackScript") and (
                    . as $record
                    | $record.kind != "nixosConfiguration"
                      or ($record.rollbackScript | type != "string" or test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$") | not)
                      or ($record.rollbackScript | endswith("-deploy-health-rollback-script-" + $record.name) | not)
                  ))
                )) then
                  error("invalid CI build record")
                elif any($records[]; (
                  (.attr | split(".")) as $parts
                  | .name != $parts[1]
                    or .kind != (if $parts[0] == "nixosConfigurations" then "nixosConfiguration" else "darwinConfiguration" end)
                )) then
                  error("CI build record identity does not match its attribute")
                else
                  $records
                end
            ' > "$RUNNER_TEMP/ci-build-records/records.json"

      - name: Upload build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-build-records
          path: ${{ runner.temp }}/ci-build-records/records.json
          compression-level: 0
          retention-days: 7

      - name: Validate, promote, and dispatch successfully built configurations
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEPLOYMENT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source modules/deployment/scripts/cachix-pin-functions.sh

          records="$(jq -ce '.' "$RUNNER_TEMP/ci-build-records/records.json")"
          pins="$(cachix_fetch_pins whitestrake)"
          built_pin_delta="$(
            jq -cn \
              --argjson pins "$pins" \
              --argjson records "$records" \
              '
                def pinPath($name):
                  (($pins[]? | select(.name == $name) | .lastRevision.storePath) // "");

                $records
                | map(
                    . as $record
                    | ("built-host-" + $record.name) as $pin
                    | pinPath($pin) as $current
                    | select($current != $record.storePath)
                    | {
                        host: $record.name,
                        pin: $pin,
                        currentStorePath: $current,
                        targetStorePath: $record.storePath
                      }
                  )
                | sort_by(.host)
              '
          )"
          deployment_matrix="$(
            jq -cn \
              --argjson pins "$pins" \
              --argjson records "$records" \
              '
                def pinPath($name):
                  (($pins[]? | select(.name == $name) | .lastRevision.storePath) // "");

                {
                  include: (
                    $records
                    | map(
                        select(has("rollbackScript"))
                        | ("deployed-host-" + .name) as $deploy_pin
                        | select(pinPath($deploy_pin) != .storePath)
                        | {
                            host: .name,
                            system,
                            storePath,
                            rollbackScript
                          }
                      )
                    | sort_by(.host)
                  )
                }
              '
          )"

          echo "Prospective Cachix built-pin changes for $GITHUB_SHA:"
          jq . <<< "$built_pin_delta"
          echo "Prospective Cachix deployment matrix for $GITHUB_SHA:"
          jq . <<< "$deployment_matrix"
          {
            echo "### Prospective Cachix promotion and deployment"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "#### Built-pin changes"
            echo
            echo '```json'
            jq . <<< "$built_pin_delta"
            echo '```'
            echo
            echo "#### Deployment matrix"
            echo
            echo '```json'
            jq . <<< "$deployment_matrix"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GITHUB_REF" != refs/heads/master ]; then
            exit 0
          fi

          current_rev="$(
            curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_DEPLOYMENT_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" \
              | jq -r '.object.sha // empty'
          )"
          if [ "$current_rev" != "$GITHUB_SHA" ]; then
            echo "Skipping stale CI promotion and deployment: run=$GITHUB_SHA current=$current_rev"
            exit 0
          fi

          while IFS=$'\t' read -r host store_path; do
            pin_name="built-host-$host"
            if [ "$(cachix_pin_path "$pins" "$pin_name")" = "$store_path" ]; then
              echo "Built state already pinned: $pin_name -> $store_path"
            else
              echo "Pinning built state: $pin_name -> $store_path"
              cachix_pin_store_path whitestrake "$pin_name" "$store_path" 3
            fi
          done < <(jq -r '.[] | [.name, .storePath] | @tsv' <<< "$records")

          if [ "$(jq -r '.include | length' <<< "$deployment_matrix")" = 0 ]; then
            echo "No deployable hosts changed; not dispatching continuous deployment."
            exit 0
          fi

          echo "Dispatching continuous deployment matrix: $deployment_matrix"
          gh workflow run continuous-deployment.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --raw-field deployment_sha="$GITHUB_SHA" \
            --raw-field deployment_source=continuous-integration \
            --raw-field force=false \
            --raw-field matrix="$deployment_matrix"
