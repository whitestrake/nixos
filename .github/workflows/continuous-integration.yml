name: CI
on:
  push:
    branches: ['**']
    tags-ignore: ['ci-cache-v1-*']
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Optional Release restore or cold reconstruction
        type: choice
        options: [warm, cold]
        default: warm
      cache_release_id:
        description: Optional pinned Release ID
        type: string
        default: ""
permissions:
  contents: read
# The newest run on a ref wins; a cancelled deploy is picked up from the deployed-host pins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-builds:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
      actions: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select cache generation
        uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - name: Prepare Linux build environment
        uses: ./.github/actions/ci-cache-restore
        with:
          component: linux-seed-x86_64-linux
      - name: Configure remote Linux builders
        uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Linux configurations
        id: build
        run: bash .github/scripts/ci-nfb.sh linux-hosts x86_64-linux
      # CI Retry re-runs this attempt's failed jobs when the marker is present.
      - name: Flag transient nixbuild.net failures
        id: transient
        if: failure() && steps.build.outcome == 'failure'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ci-results"
          [ -f "$dir/results.json" ] && [ -f "$dir/nix-fast-build.log" ] || exit 0
          hosts="$(python3 .github/scripts/nixbuild_transient.py "$dir/results.json" "$dir/nix-fast-build.log")"
          [ -n "$hosts" ] || exit 0
          mkdir "$RUNNER_TEMP/nixbuild-transient"
          printf '%s\n' "$hosts" > "$RUNNER_TEMP/nixbuild-transient/hosts"
          echo "::notice ::Only opaque nixbuild.net errors: $(paste -sd ' ' <<< "$hosts")"
          echo "flagged=true" >> "$GITHUB_OUTPUT"
      - name: Upload transient failure marker
        if: failure() && steps.transient.outputs.flagged == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nixbuild-transient-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nixbuild-transient
          retention-days: 1
      - name: Publish Linux build records
        id: records
        run: echo "records=$(cat "$RUNNER_TEMP/ci-results/records.json")" >> "$GITHUB_OUTPUT"
  source-checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
      actions: read
    outputs:
      lock-changed: ${{ steps.lock.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      # Off the critical path: decides whether Package Report runs at all.
      - name: Detect flake.lock changes against master
        id: lock
        if: github.ref != 'refs/heads/master'
        # Only gates the optional report, so an API failure must not fail Checks.
        run: |
          changed=false
          for attempt in 1 2 3; do
            if result="$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$GITHUB_SHA" \
              --jq '[.files[]?.filename] | index("flake.lock") != null')"; then
              changed="$result"
              break
            fi
            [ "$attempt" = 3 ] || sleep $((attempt * 2))
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select cache generation
        uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - name: Prepare Linux build environment
        uses: ./.github/actions/ci-cache-restore
        with:
          component: linux-seed-x86_64-linux
      - name: Configure Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Run source checks
        run: bash .github/scripts/ci-nfb.sh linux-checks x86_64-linux
  # Nix substitutes a locked input from a binary cache before it contacts GitHub,
  # so caching every input's source tree lets a store without GitHub API access
  # (such as a Claude cloud session) evaluate this flake. Off the critical path.
  cache-sources:
    name: Cache sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: ./.github/actions/install-nix
      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Push flake input sources to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # cache.nixos.org already serves the nixpkgs trees, so only push what neither cache has.
          caches=(https://whitestrake.cachix.org https://cache.nixos.org)
          # The dry run derives every source path from the lock file's narHash
          # without fetching, so an unchanged lock costs a few narinfo lookups.
          archive="$(nix flake archive --dry-run --json)"
          # den also fetches nix-effects and gen with builtins.fetchTarball pinned
          # by sha256, which Nix substitutes the same way. Evaluating the list
          # fetches them (small), so they are checked even when every input is cached.
          fetched="$(nix eval --impure --json --expr \
            'import ./.github/scripts/den-fetched-sources.nix { den = builtins.fetchTree (builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.den.locked; }')"
          mapfile -t sources < <({
            jq -r '.inputs | .. | .path? // empty' <<< "$archive"
            jq -r '.[]' <<< "$fetched"
          } | sort -u)
          missing=()
          for source in "${sources[@]}"; do
            for cache in "${caches[@]}"; do
              if nix path-info --store "$cache" "$source" >/dev/null 2>&1; then continue 2; fi
            done
            missing+=("$source")
          done
          if [ "${#missing[@]}" = 0 ]; then
            echo "Every source is already cached"
            exit 0
          fi
          printf 'Caching %s\n' "${missing[@]}"
          nix flake archive
          cachix push whitestrake "${missing[@]}"
  darwin-builds:
    name: Darwin
    runs-on: macos-26
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
      actions: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select cache generation
        uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - name: Prepare Darwin build environment
        id: darwin-prepare
        uses: ./.github/actions/ci-darwin-prepare
        with:
          mode: hot
          configure-cachix: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Look up Darwin nixpkgs trees
        id: darwin-sources
        continue-on-error: true
        run: |
          set -euo pipefail
          missing=false
          while IFS= read -r path; do
            nix path-info "$path" > /dev/null 2>&1 || missing=true
          done < <(bash .github/scripts/darwin-sources.sh paths)
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "key=darwin-sources-$(bash .github/scripts/darwin-sources.sh key)" >> "$GITHUB_OUTPUT"
      # Saved by Update Packages after a lock bump; ci-nfb.sh substitutes from it.
      - name: Restore Darwin nixpkgs trees
        if: steps.darwin-sources.outputs.missing == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Must match the save in Update Packages exactly (see there).
          path: ~/darwin-sources
          key: ${{ steps.darwin-sources.outputs.key }}
      - name: Build Darwin configurations
        # Keyed on the mounted store: a warm request can still fall back to cold.
        timeout-minutes: ${{ steps.darwin-prepare.outputs.mode == 'cold' && 330 || 60 }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          "$HOST_PYTHON" .github/scripts/ci_darwin.py run --state "$RUNNER_TEMP/darwin" \
            -- /bin/bash .github/scripts/ci-nfb.sh darwin aarch64-darwin
      - name: Publish selected Darwin records
        id: records
        run: echo "records=$(cat "$RUNNER_TEMP/darwin/selected/records.json")" >> "$GITHUB_OUTPUT"
        # The hosted VM owns final store disposal; recovery still detaches before reuse.
  all-builds:
    name: "All Builds"
    needs:
      - linux-builds
      - darwin-builds
      - source-checks
    # Still runs after a lane fails, to report it, but not for superseded runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.promote.outputs.matrix }}
    concurrency:
      group: >-
        ${{
          github.ref == 'refs/heads/master'
          && 'cachix-deploy-master'
          || format('ci-all-builds-{0}', github.run_id)
        }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Report platform lane durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name == "Linux" or .name == "Darwin" or .name == "Checks") | select(.completed_at)
              | [.name, ((.completed_at | fromdate) - (.started_at | fromdate))] | @tsv' > "$RUNNER_TEMP/lanes.tsv"
          { echo '| Lane | Seconds |'; echo '|---|---:|'; awk -F'\t' '{print "| " $1 " | " $2 " |"}' "$RUNNER_TEMP/lanes.tsv"; } >> "$GITHUB_STEP_SUMMARY"
          awk -F'\t' '$2 > 180 {print "::warning ::" $1 " lane took " $2 " s (budget 180 s)"}' "$RUNNER_TEMP/lanes.tsv"

      - name: Require successful platform builds
        env:
          LINUX_RESULT: ${{ needs.linux-builds.result }}
          DARWIN_RESULT: ${{ needs.darwin-builds.result }}
          SOURCE_RESULT: ${{ needs.source-checks.result }}
        run: |
          if [ "$LINUX_RESULT" != success ] || [ "$DARWIN_RESULT" != success ] || [ "$SOURCE_RESULT" != success ]; then
            echo "::error ::Every build and source check must succeed: linux=$LINUX_RESULT darwin=$DARWIN_RESULT source=$SOURCE_RESULT"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Publish proof and promote built configurations
        id: promote
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LINUX_RECORDS: ${{ needs.linux-builds.outputs.records }}
          DARWIN_RECORDS: ${{ needs.darwin-builds.outputs.records }}
        run: |
          set -euo pipefail
          source modules/deployment/scripts/cachix-pin-functions.sh
          cache=https://whitestrake.cachix.org
          records="$(jq -cn --argjson linux "$LINUX_RECORDS" --argjson darwin "$DARWIN_RECORDS" '$linux + $darwin')"
          mapfile -t paths < <(jq -r '.[].storePath' <<< "$records")
          cachix_verify_store_paths whitestrake "${paths[@]}"

          # Only toplevels built with the cachix-agent aspect carry deploy-rollback.
          mkdir "$RUNNER_TEMP/meta"
          pids=()
          while IFS=$'\t' read -r name path; do
            (
              set -euo pipefail
              system="$(nix store cat --store "$cache" "$path/system")"
              rollback=""
              if nix store ls --json --store "$cache" "$path" | jq -e '.entries | has("deploy-rollback")' >/dev/null; then
                rollback="$(nix store cat --store "$cache" "$path/deploy-rollback")"
              fi
              jq -cn --arg name "$name" --arg system "$system" --arg rollback "$rollback" \
                '{$name, $system} + if $rollback == "" then {} else {rollbackScript: $rollback} end' > "$RUNNER_TEMP/meta/$name.json"
            ) &
            pids+=("$!")
          done < <(jq -r '.[] | [.name, .storePath] | @tsv' <<< "$records")
          for pid in "${pids[@]}"; do wait "$pid"; done
          records="$(jq -cs --argjson records "$records" 'INDEX(.[]; .name) as $meta | $records | map(. + $meta[.name]) | sort_by(.system, .attr)' "$RUNNER_TEMP"/meta/*.json)"

          jq -cS --arg revision "$GITHUB_SHA" '{$revision, records: map({attr, system, storePath})}' <<< "$records" > "$RUNNER_TEMP/ci-build-proof.json"
          proof_path="$(nix store add --mode flat --name ci-build-proof.json "$RUNNER_TEMP/ci-build-proof.json")"
          cachix push whitestrake "$proof_path"

          pins="$(cachix_fetch_pins whitestrake)"
          matrix="$(jq -c --argjson pins "$pins" '
            (INDEX($pins[]?; .name) | map_values(.lastRevision.storePath)) as $pinned
            | {include: map(select(has("rollbackScript") and $pinned["deployed-host-" + .name] != .storePath)
                | {host: .name, system, storePath, rollbackScript})}' <<< "$records")"
          {
            echo "Proof: \`$proof_path\`"
            echo
            echo '```json'
            jq . <<< "$matrix"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$GITHUB_REF" = refs/heads/master ] || exit 0
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping stale promotion: run=$GITHUB_SHA master=$current"
            exit 0
          fi
          while IFS=$'\t' read -r name path; do
            if [ "$(cachix_pin_path "$pins" "built-host-$name")" != "$path" ]; then
              cachix_pin_store_path whitestrake "built-host-$name" "$path" 3
            fi
          done < <(jq -r '.[] | [.name, .storePath] | @tsv' <<< "$records")
          cachix_pin_store_path whitestrake successful-master-build "$proof_path" 3
          if [ "$(jq '.include | length' <<< "$matrix")" != 0 ]; then
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    needs: all-builds
    if: ${{ github.ref == 'refs/heads/master' && needs.all-builds.outputs.matrix != '' }}
    uses: ./.github/workflows/continuous-deployment.yml
    with:
      deployment_sha: ${{ github.sha }}
      deployment_source: continuous-integration
      matrix: ${{ needs.all-builds.outputs.matrix }}
    secrets:
      CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  package-report:
    name: Package Report
    needs:
      - source-checks
      - linux-builds
      - darwin-builds
    if: ${{ needs.source-checks.outputs.lock-changed == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out merge base
        id: lock
        run: |
          set -euo pipefail
          base="$(git merge-base origin/master HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Select cache generation
        uses: ./.github/actions/ci-cache-select
      - name: Prepare Linux evaluation environment
        uses: ./.github/actions/ci-cache-restore
        with:
          component: linux-seed-x86_64-linux
      - name: Configure remote Linux builders
        uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Report package changes
        env:
          BASE_SHA: ${{ steps.lock.outputs.base }}
          LINUX_RECORDS: ${{ needs.linux-builds.outputs.records }}
          DARWIN_RECORDS: ${{ needs.darwin-builds.outputs.records }}
        run: |
          set -euo pipefail
          # nixbuild-action sets max-jobs = 0: substitute from Cachix or build on nixbuild.net.
          # nixbuild.net can fail a build on a slow Cachix push that later lands; retry.
          for attempt in 1 2 3; do
            if out="$(nix build --no-link --print-out-paths .#dix-snapshot)"; then break; fi
            [ "$attempt" -lt 3 ] || exit 1
          done
          dix_snapshot="$out/bin/dix-snapshot"
          jq -ne --argjson linux "$LINUX_RECORDS" --argjson darwin "$DARWIN_RECORDS" \
            '$linux + $darwin' > "$RUNNER_TEMP/records.json"
          report="$RUNNER_TEMP/package-report.md"
          python3 .github/scripts/narinfo_package_report.py --records "$RUNNER_TEMP/records.json" \
            --base-dir "$RUNNER_TEMP/base" --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA" \
            --dix-snapshot "$dix_snapshot" --output "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base master \
            --state open --json number --jq '.[0].number // empty')"
          [ -n "$pr" ] || exit 0
          comment_id="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              | jq -r --arg marker "<!-- flake-lock-package-report:comment -->" \
                '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker)))][0].id // empty'
          )"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F "body=@$report" --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F "body=@$report" --silent
          fi
