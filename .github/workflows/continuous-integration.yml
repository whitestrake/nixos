name: CI
on:
  push:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Optional Release restore or cold reconstruction
        type: choice
        options: [warm, cold]
        default: warm
      cache_release_id:
        description: Optional pinned Release ID
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  linux-builds:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
      actions: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - uses: ./.github/actions/ci-cache-restore
        with:
          repository: ${{ github.repository }}
          selection: ${{ runner.temp }}/selection.json
          component: linux-seed-x86_64-linux
          format: erofs
      - uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Linux
        run: bash .github/scripts/ci-nfb.sh linux-hosts x86_64-linux
      - name: Publish records
        id: records
        run: echo "records=$(cat "$RUNNER_TEMP/ci-results/records.json")" >> "$GITHUB_OUTPUT"
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - uses: ./.github/actions/ci-cache-restore
        with:
          repository: ${{ github.repository }}
          selection: ${{ runner.temp }}/selection.json
          component: linux-seed-x86_64-linux
          format: erofs
      - name: Build Source checks
        run: bash .github/scripts/ci-nfb.sh linux-checks x86_64-linux
  darwin-builds:
    name: Darwin
    runs-on: macos-26
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
      actions: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI_PUBLISH_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-cache-select
        with:
          mode: ${{ inputs.cache_mode || 'warm' }}
          release-id: ${{ inputs.cache_release_id }}
      - uses: ./.github/actions/ci-darwin-prepare
        with:
          configure-cachix: "true"
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Darwin configurations
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          "$HOST_PYTHON" .github/scripts/ci_darwin.py run --state "$RUNNER_TEMP/darwin" \
            -- /bin/bash .github/scripts/ci-nfb.sh darwin aarch64-darwin
      - name: Publish selected Darwin records
        id: records
        run: echo "records=$(cat "$RUNNER_TEMP/darwin/selected/records.json")" >> "$GITHUB_OUTPUT"
      - name: Detach Darwin store
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/darwin" ]; then
            "$HOST_PYTHON" .github/scripts/ci_darwin.py cleanup --state "$RUNNER_TEMP/darwin"
          fi
  all-builds:
    name: "All Builds"
    needs:
      - linux-builds
      - darwin-builds
      - source-checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    concurrency:
      group: >-
        ${{
          github.ref == 'refs/heads/master'
          && 'cachix-deploy-master'
          || format('ci-all-builds-{0}', github.run_id)
        }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require successful platform builds
        env:
          LINUX_RESULT: ${{ needs.linux-builds.result }}
          DARWIN_RESULT: ${{ needs.darwin-builds.result }}
          SOURCE_RESULT: ${{ needs.source-checks.result }}
        run: |
          if [ "$LINUX_RESULT" != success ] || [ "$DARWIN_RESULT" != success ] || [ "$SOURCE_RESULT" != success ]; then
            echo "::error ::Every build and source check must succeed: linux=$LINUX_RESULT darwin=$DARWIN_RESULT source=$SOURCE_RESULT"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Assemble build manifest
        shell: bash
        env:
          LINUX_RECORDS: ${{ needs.linux-builds.outputs.records }}
          DARWIN_RECORDS: ${{ needs.darwin-builds.outputs.records }}
        run: |
          set -euo pipefail

          if [ -z "$LINUX_RECORDS" ] || [ -z "$DARWIN_RECORDS" ]; then
            echo "::error ::Linux and Darwin build records must both be present."
            exit 1
          fi

          records="$(
            jq -cne \
              --argjson linux "$LINUX_RECORDS" \
              --argjson darwin "$DARWIN_RECORDS" \
              'if ($linux | type) != "array" or ($darwin | type) != "array" then
                 error("Linux and Darwin build records must be arrays")
               elif ($linux | length) == 0 or ($darwin | length) == 0 then
                 error("Linux and Darwin build records must be non-empty")
               else
                 $linux + $darwin
               end'
          )"

          if ! jq -e '
            type == "array"
            and length > 0
            and all(.[]; (
              type == "object"
              and (.attr | type == "string" and test("^(nixosConfigurations|darwinConfigurations)\\.[A-Za-z0-9_-]+$"))
              and (.kind | type == "string" and length > 0)
              and (.name | type == "string" and test("^[A-Za-z0-9_-]+$"))
              and (.storePath | type == "string" and test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$"))
            ))
          ' <<< "$records" >/dev/null; then
            echo "::error ::Nix Fast Build produced malformed configuration records."
            exit 1
          fi

          artifact_metadata_dir="$RUNNER_TEMP/ci-artifact-metadata"
          mkdir -p "$artifact_metadata_dir"
          artifact_pids=()
          while IFS=$'\t' read -r index kind name store_path; do
            (
              set -euo pipefail

              cache_store="https://whitestrake.cachix.org"
              system="$(nix store cat --store "$cache_store" "$store_path/system")"
              rollback_script=""
              if [ "$kind" = "nixosConfiguration" ]; then
                dependencies="$(nix store cat --store "$cache_store" "$store_path/extra-dependencies")"
                rollback_matches="$(
                  jq -cn \
                    --arg dependencies "$dependencies" \
                    --arg name "$name" \
                    '[
                      $dependencies
                      | scan("/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+")
                      | select(endswith("-deploy-health-rollback-script-" + $name))
                    ]'
                )"
                nondeployable_matches="$(
                  jq -cn \
                    --arg dependencies "$dependencies" \
                    --arg name "$name" \
                    '[
                      $dependencies
                      | scan("/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+")
                      | select(endswith("-cachix-nondeployable-" + $name))
                    ]'
                )"
                rollback_count="$(jq -r 'length' <<< "$rollback_matches")"
                nondeployable_count="$(jq -r 'length' <<< "$nondeployable_matches")"
                marker_count=$((rollback_count + nondeployable_count))
                if [ "$rollback_count" -gt 1 ] || [ "$nondeployable_count" -gt 1 ] || [ "$marker_count" -ne 1 ]; then
                  echo "::error ::Expected exactly one deployability marker for $name (one rollback script or one nondeployable sentinel)."
                  exit 1
                elif [ "$rollback_count" = 1 ]; then
                  rollback_script="$(jq -r '.[0]' <<< "$rollback_matches")"
                fi
              fi

              jq -cn \
                --argjson index "$index" \
                --arg system "$system" \
                --arg rollbackScript "$rollback_script" \
                '{
                  index: $index,
                  system: $system
                } + if $rollbackScript == "" then {} else {rollbackScript: $rollbackScript} end' \
                > "$artifact_metadata_dir/$index.json"
            ) &
            artifact_pids+=("$!")
          done < <(
            jq -r 'to_entries[] | [.key, .value.kind, .value.name, .value.storePath] | @tsv' <<< "$records"
          )

          artifact_status=0
          for artifact_pid in "${artifact_pids[@]}"; do
            if ! wait "$artifact_pid"; then
              artifact_status=1
            fi
          done
          if [ "$artifact_status" -ne 0 ]; then
            echo "::error ::Failed to read one or more CI artefacts from Cachix."
            exit 1
          fi

          artifact_metadata="$(jq -sc '.' "$artifact_metadata_dir"/*.json)"
          jq -cne \
            --argjson records "$records" \
            --argjson metadata "$artifact_metadata" '
              ($records | to_entries) as $entries
              | if ($metadata | length) != ($entries | length) then
                  error("Cachix artefact metadata count does not match build records")
                elif (($metadata | map(.index) | sort) != [range(0; ($entries | length))]) then
                  error("Cachix artefact metadata indexes are not unique and complete")
                elif any($metadata[]; (
                  type != "object"
                  or (.index | type != "number")
                  or (.system | type != "string")
                  or (has("rollbackScript") and (.rollbackScript | type != "string"))
                )) then
                  error("invalid Cachix artefact metadata")
                else
                  $entries
                  | map(
                      . as $entry
                      | ($metadata[] | select(.index == $entry.key)) as $metadata_entry
                      | $entry.value
                        + {system: $metadata_entry.system}
                        + (if ($metadata_entry.rollbackScript // "") == ""
                           then {}
                           else {rollbackScript: $metadata_entry.rollbackScript}
                           end)
                    )
                end
              | sort_by(.system, .attr) as $records
              | ($records
                  | map(select(.system != "aarch64-darwin" and .system != "aarch64-linux" and .system != "x86_64-linux") | .system)
                  | unique) as $unknown_systems
              | ($records | group_by(.attr) | map(select(length > 1) | .[0].attr)) as $duplicate_attrs
              | ($records | group_by(.name) | map(select(length > 1) | .[0].name)) as $duplicate_names
              | if ($unknown_systems | length) > 0 then
                  error("unknown CI systems: \($unknown_systems | join(", "))")
                elif ($duplicate_attrs | length) > 0 then
                  error("duplicate CI attributes: \($duplicate_attrs | join(", "))")
                elif ($duplicate_names | length) > 0 then
                  error("duplicate CI configuration names: \($duplicate_names | join(", "))")
                elif (["aarch64-darwin", "aarch64-linux", "x86_64-linux"] - ($records | map(.system) | unique) | length) > 0 then
                  error("CI records do not cover all systems")
                elif any($records[]; (
                  (.attr | type != "string" or test("^(nixosConfigurations|darwinConfigurations)\\.[A-Za-z0-9_-]+$") | not)
                  or (.kind | type != "string" or length == 0)
                  or (.name | type != "string" or test("^[A-Za-z0-9_-]+$") | not)
                  or (.system | type != "string" or (. == "aarch64-darwin" or . == "aarch64-linux" or . == "x86_64-linux") | not)
                  or (.storePath | type != "string" or test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$") | not)
                  or (has("rollbackScript") and (
                    . as $record
                    | $record.kind != "nixosConfiguration"
                      or ($record.rollbackScript | type != "string" or test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$") | not)
                      or ($record.rollbackScript | endswith("-deploy-health-rollback-script-" + $record.name) | not)
                  ))
                )) then
                  error("invalid CI build record")
                elif any($records[]; (
                  (.attr | split(".")) as $parts
                  | .name != $parts[1]
                    or .kind != (if $parts[0] == "nixosConfigurations" then "nixosConfiguration" else "darwinConfiguration" end)
                )) then
                  error("CI build record identity does not match its attribute")
                else
                  $records
                end
            ' > "$RUNNER_TEMP/ci-enriched-records.json"

      - name: Validate, promote, and dispatch successfully built configurations
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source modules/deployment/scripts/cachix-pin-functions.sh

          current_master_revision() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
              --jq '.object.sha'
          }

          records="$(jq -ce '.' "$RUNNER_TEMP/ci-enriched-records.json")"
          proof_file="$RUNNER_TEMP/ci-build-proof.json"
          proof_canonical_file="$RUNNER_TEMP/ci-build-proof.canonical.json"
          jq -cn \
            --arg revision "$GITHUB_SHA" \
            --argjson records "$records" \
            '{
              revision: $revision,
              records: ($records | map({attr, system, storePath}))
            }' > "$proof_file"
          jq -ceS -f .github/scripts/ci-build-proof.jq "$proof_file" > "$proof_canonical_file"
          mv "$proof_canonical_file" "$proof_file"
          proof_path="$(nix store add --mode flat --name ci-build-proof.json "$proof_file")"
          cachix push whitestrake "$proof_path"
          mapfile -t recorded_paths < <(jq -r '.[].storePath' <<< "$records")
          nix path-info --store https://whitestrake.cachix.org "${recorded_paths[@]}" >/dev/null
          echo "Published durable CI build proof: $proof_path"
          {
            echo "### Durable CI build proof"
            echo
            echo "Revision: \`$GITHUB_SHA\`"
            echo
            echo "Store path: \`$proof_path\`"
          } >> "$GITHUB_STEP_SUMMARY"
          pins="$(cachix_fetch_pins whitestrake)"
          built_pin_delta="$(
            jq -cn \
              --argjson pins "$pins" \
              --argjson records "$records" \
              '
                def pinPath($name):
                  (($pins[]? | select(.name == $name) | .lastRevision.storePath) // "");

                $records
                | map(
                    . as $record
                    | ("built-host-" + $record.name) as $pin
                    | pinPath($pin) as $current
                    | select($current != $record.storePath)
                    | {
                        host: $record.name,
                        pin: $pin,
                        currentStorePath: $current,
                        targetStorePath: $record.storePath
                      }
                  )
                | sort_by(.host)
              '
          )"
          deployment_matrix="$(
            jq -cn \
              --argjson pins "$pins" \
              --argjson records "$records" \
              '
                def pinPath($name):
                  (($pins[]? | select(.name == $name) | .lastRevision.storePath) // "");

                {
                  include: (
                    $records
                    | map(
                        select(has("rollbackScript"))
                        | ("deployed-host-" + .name) as $deploy_pin
                        | select(pinPath($deploy_pin) != .storePath)
                        | {
                            host: .name,
                            system,
                            storePath,
                            rollbackScript
                          }
                      )
                    | sort_by(.host)
                  )
                }
              '
          )"

          echo "Prospective Cachix built-pin changes for $GITHUB_SHA:"
          jq . <<< "$built_pin_delta"
          echo "Prospective Cachix deployment matrix for $GITHUB_SHA:"
          jq . <<< "$deployment_matrix"
          {
            echo "### Prospective Cachix promotion and deployment"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "#### Built-pin changes"
            echo
            echo '```json'
            jq . <<< "$built_pin_delta"
            echo '```'
            echo
            echo "#### Deployment matrix"
            echo
            echo '```json'
            jq . <<< "$deployment_matrix"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GITHUB_REF" != refs/heads/master ]; then
            exit 0
          fi

          current_rev="$(current_master_revision)"
          if [ "$current_rev" != "$GITHUB_SHA" ]; then
            echo "Skipping stale CI promotion and deployment: run=$GITHUB_SHA current=$current_rev"
            exit 0
          fi

          while IFS=$'\t' read -r host store_path; do
            pin_name="built-host-$host"
            if [ "$(cachix_pin_path "$pins" "$pin_name")" = "$store_path" ]; then
              echo "Built state already pinned: $pin_name -> $store_path"
            else
              current_rev="$(current_master_revision)"
              if [ "$current_rev" != "$GITHUB_SHA" ]; then
                echo "Skipping stale CI promotion before pin mutation: run=$GITHUB_SHA current=$current_rev"
                exit 0
              fi
              echo "Pinning built state: $pin_name -> $store_path"
              cachix_pin_store_path whitestrake "$pin_name" "$store_path" 3
            fi
          done < <(jq -r '.[] | [.name, .storePath] | @tsv' <<< "$records")

          current_rev="$(current_master_revision)"
          if [ "$current_rev" != "$GITHUB_SHA" ]; then
            echo "Skipping stale successful-master-build promotion: run=$GITHUB_SHA current=$current_rev"
            exit 0
          fi
          cachix_pin_store_path whitestrake successful-master-build "$proof_path" 3

          if [ "$(jq -r '.include | length' <<< "$deployment_matrix")" = 0 ]; then
            echo "No deployable hosts changed; not dispatching continuous deployment."
            exit 0
          fi

          current_rev="$(current_master_revision)"
          if [ "$current_rev" != "$GITHUB_SHA" ]; then
            echo "Skipping stale CI deployment dispatch: run=$GITHUB_SHA current=$current_rev"
            exit 0
          fi

          echo "Dispatching continuous deployment matrix: $deployment_matrix"
          gh workflow run continuous-deployment.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --raw-field deployment_sha="$GITHUB_SHA" \
            --raw-field deployment_source=continuous-integration \
            --raw-field force=false \
            --raw-field matrix="$deployment_matrix"
