name: "CI"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  all-builds:
    name: "All Builds"
    runs-on: macos-26
    timeout-minutes: 355
    permissions:
      actions: write
      checks: write
      contents: read
    env:
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-aarch64-darwin-sparsebundle-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-aarch64-darwin
      NIX_ROOT_IMAGE_SIZE: 64g
      NIX_ROOT_SYSTEM: aarch64-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore sparsebundle Nix root cache
        uses: ./.github/actions/nix-sparsebundle-cache-restore
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          cache-key-suffix: reader
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Mount sparsebundle Nix root
        uses: ./.github/actions/nix-sparsebundle-mount
        with:
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Configure nixbuild.net
        uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Push build results to Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Build all configurations
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          df -h
          started="$SECONDS"

          cached_nix_fast_build="/nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build"
          nix_fast_build=()
          if [ -d "$cached_nix_fast_build" ]; then
            cached_nix_fast_build="$(cd -P "$cached_nix_fast_build" && pwd)/bin/nix-fast-build"
            if [ -x "$cached_nix_fast_build" ] && "$cached_nix_fast_build" --help >/dev/null; then
              nix_fast_build=("$cached_nix_fast_build")
              echo "NIX_FAST_BUILD_SOURCE source=cache-root path=$cached_nix_fast_build"
            fi
          fi
          if [ "${#nix_fast_build[@]}" -eq 0 ]; then
            nix_fast_build=(nix run --inputs-from . nixpkgs-unstable#nix-fast-build --)
            echo "NIX_FAST_BUILD_SOURCE source=nix-run"
          fi

          linux_pid=""
          darwin_pid=""

          forward_and_wait() {
            signal="$1"
            status="$2"
            trap - INT TERM

            if [ -n "$linux_pid" ]; then
              kill -"$signal" "$linux_pid" 2>/dev/null || true
            fi
            if [ -n "$darwin_pid" ]; then
              kill -"$signal" "$darwin_pid" 2>/dev/null || true
            fi
            if [ -n "$linux_pid" ]; then
              wait "$linux_pid" || true
            fi
            if [ -n "$darwin_pid" ]; then
              wait "$darwin_pid" || true
            fi
            exit "$status"
          }

          trap 'forward_and_wait INT 130' INT
          trap 'forward_and_wait TERM 143' TERM

          python3 .github/scripts/nix_fast_build.py --publish-checks -- \
            "${nix_fast_build[@]}" \
            --flake .#ci.linux \
            --systems 'x86_64-linux aarch64-linux' \
            --eval-workers 3 \
            --store ssh-ng://eu.nixbuild.net \
            --option builders '' \
            --option max-jobs 2 \
            --retries 2 \
            --result-file "$RUNNER_TEMP/ci-linux-results.json" \
            -j 50 &
          linux_pid="$!"

          python3 .github/scripts/nix_fast_build.py --publish-checks -- \
            "${nix_fast_build[@]}" \
            --flake .#ci.darwin \
            --systems aarch64-darwin \
            --eval-workers 1 \
            --result-file "$RUNNER_TEMP/ci-darwin-results.json" \
            -j 50 &
          darwin_pid="$!"

          set +e
          wait "$linux_pid"
          linux_status="$?"
          linux_pid=""
          wait "$darwin_pid"
          darwin_status="$?"
          darwin_pid=""
          set -e
          trap - INT TERM

          echo "NIX_FAST_BUILD_COMPLETE linuxStatus=$linux_status darwinStatus=$darwin_status durationSeconds=$((SECONDS - started))"
          if [ "$linux_status" -ne 0 ] || [ "$darwin_status" -ne 0 ]; then
            echo "::error ::Nix Fast Build failed: linux=$linux_status darwin=$darwin_status"
            exit 1
          fi

          jq -ce -f .github/scripts/nix-fast-build-records.jq \
            "$RUNNER_TEMP/ci-linux-results.json" > "$RUNNER_TEMP/ci-linux-records.json"
          jq -ce -f .github/scripts/nix-fast-build-records.jq \
            "$RUNNER_TEMP/ci-darwin-results.json" > "$RUNNER_TEMP/ci-darwin-records.json"

          # shellcheck disable=SC2016
          nix_fast_build_paths="$(
            nix eval --impure --json --expr '
              let
                flake = builtins.getFlake (toString ./.);
                systems = [
                  "aarch64-darwin"
                  "aarch64-linux"
                  "x86_64-linux"
                ];
              in
                builtins.listToAttrs (
                  builtins.map
                    (system: {
                      name = system;
                      value =
                        toString flake.inputs.nixpkgs-unstable.legacyPackages.${system}.nix-fast-build;
                    })
                    systems
                )
            '
          )"

          enrich_records() {
            input_file="$1"
            store="$2"

            jq -c '.[]' "$input_file" |
              while IFS= read -r record; do
                drv_path="$(jq -er '.drvPath' <<< "$record")"
                if [ -n "$store" ]; then
                  derivation="$(nix derivation show --store "$store" "$drv_path")"
                else
                  derivation="$(nix derivation show "$drv_path")"
                fi
                system="$(
                  jq -er '
                    if type == "object" and length == 1
                    then to_entries[0].value.system
                    else error("expected exactly one evaluated derivation")
                    end
                    | select(type == "string" and length > 0)
                  ' <<< "$derivation"
                )"
                nix_fast_build_store_path="$(
                  jq -er --arg system "$system" '.[$system] // empty' \
                    <<< "$nix_fast_build_paths"
                )"
                jq -c \
                  --arg system "$system" \
                  --arg nixFastBuildStorePath "$nix_fast_build_store_path" \
                  '. + {
                    system: $system,
                    nixFastBuildStorePath: $nixFastBuildStorePath
                  } | del(.drvPath)' <<< "$record"
              done
          }

          mkdir -p "$RUNNER_TEMP/ci-build-records"
          {
            enrich_records "$RUNNER_TEMP/ci-linux-records.json" ssh-ng://eu.nixbuild.net
            enrich_records "$RUNNER_TEMP/ci-darwin-records.json" ""
          } | jq -sce '
            sort_by(.system, .attr) as $records
            | ($records | map(
                select(
                  .system != "aarch64-darwin"
                  and .system != "aarch64-linux"
                  and .system != "x86_64-linux"
                )
                | .system
              ) | unique) as $unknown_systems
            | ($records
                | group_by([.system, .attr])
                | map(select(length > 1) | "\(.[0].system):\(.[0].attr)"))
              as $duplicate_attrs
            | ($records
                | group_by(.name)
                | map(select(length > 1) | .[0].name))
              as $duplicate_names
            | ($records
                | group_by(.system)
                | map(
                    select([.[].nixFastBuildStorePath] | unique | length > 1)
                    | .[0].system
                  ))
              as $multiple_nix_fast_build_paths
            | if ($unknown_systems | length) > 0
              then error("unknown CI systems: \($unknown_systems | join(", "))")
              elif ($duplicate_attrs | length) > 0
              then error("duplicate CI attributes within a system: \($duplicate_attrs | join(", "))")
              elif ($duplicate_names | length) > 0
              then error("duplicate CI configuration names: \($duplicate_names | join(", "))")
              elif ($multiple_nix_fast_build_paths | length) > 0
              then error("multiple nix-fast-build paths for systems: \($multiple_nix_fast_build_paths | join(", "))")
              elif all($records[]; (
                (.attr | type == "string" and length > 0)
                and (.kind | type == "string" and length > 0)
                and (.name | type == "string" and length > 0)
                and (.system | type == "string" and length > 0)
                and (.storePath | type == "string" and startswith("/nix/store/"))
                and (.nixFastBuildStorePath | type == "string" and startswith("/nix/store/"))
              )) | not
              then error("invalid CI build record")
              else $records
              end
          ' > "$RUNNER_TEMP/ci-build-records/records.json"

      - name: Upload build manifest
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-records
          path: ${{ runner.temp }}/ci-build-records/records.json
          compression-level: 0
          retention-days: 7

      - name: Validate, promote, and dispatch successfully built configurations
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEPLOYMENT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source modules/deployment/scripts/cachix-pin-functions.sh

          records="$(jq -ce '.' "$RUNNER_TEMP/ci-build-records/records.json")"
          deploy_targets="$(nix eval --accept-flake-config --json .#deploy.targets)"

          if ! jq -en \
            --argjson records "$records" \
            --argjson targets "$deploy_targets" \
            '
              def recordPath($host):
                (($records[] | select(.name == $host) | .storePath) // "");

              ($targets | type == "object" and length > 0)
              and all(
                $targets | to_entries[];
                (.key | type == "string" and length > 0)
                and (.value | type == "object")
                and (.value.system | type == "string" and length > 0)
                and (.value.storePath | type == "string" and startswith("/nix/store/"))
                and (.value.rollbackScript | type == "string" and startswith("/nix/store/"))
                and (.value.deployPin | type == "string" and startswith("deployed-host-"))
                and recordPath(.key) == .value.storePath
              )
            ' >/dev/null; then
            echo "::error ::Deploy targets are malformed or do not match successful NFB outputs."
            exit 1
          fi

          store_paths=()
          while IFS= read -r store_path; do
            store_paths+=("$store_path")
          done < <(
            jq -r '.[].storePath' <<< "$records"
            jq -r '.[].rollbackScript' <<< "$deploy_targets"
          )
          cachix_verify_store_paths_http whitestrake "${store_paths[@]}"

          echo "Validated successful configuration and rollback outputs in Cachix."
          pins="$(cachix_fetch_pins whitestrake)"
          built_pin_delta="$(
            jq -cn \
              --argjson pins "$pins" \
              --argjson records "$records" \
              '
                def pinPath($name):
                  (($pins[]? | select(.name == $name) | .lastRevision.storePath) // "");

                $records
                | map(
                    . as $record
                    | ("built-host-" + $record.name) as $pin
                    | pinPath($pin) as $current
                    | select($current != $record.storePath)
                    | {
                        host: $record.name,
                        pin: $pin,
                        currentStorePath: $current,
                        targetStorePath: $record.storePath
                      }
                  )
                | sort_by(.host)
              '
          )"
          deployment_matrix="$(
            jq -cn \
              --argjson pins "$pins" \
              --argjson targets "$deploy_targets" \
              '
                def pinPath($name):
                  (($pins[]? | select(.name == $name) | .lastRevision.storePath) // "");

                {
                  include: (
                    $targets
                    | to_entries
                    | map(
                        select(pinPath(.value.deployPin) != .value.storePath)
                        | {
                            host: .key,
                            system: .value.system,
                            storePath: .value.storePath,
                            rollbackScript: .value.rollbackScript
                          }
                      )
                    | sort_by(.host)
                  )
                }
              '
          )"

          echo "Prospective Cachix built-pin changes for $GITHUB_SHA:"
          jq . <<< "$built_pin_delta"
          echo "Prospective Cachix deployment matrix for $GITHUB_SHA:"
          jq . <<< "$deployment_matrix"
          {
            echo "### Prospective Cachix promotion and deployment"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "#### Built-pin changes"
            echo
            echo '```json'
            jq . <<< "$built_pin_delta"
            echo '```'
            echo
            echo "#### Deployment matrix"
            echo
            echo '```json'
            jq . <<< "$deployment_matrix"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GITHUB_REF" != refs/heads/master ]; then
            exit 0
          fi

          current_rev="$(
            curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_DEPLOYMENT_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" \
              | jq -r '.object.sha // empty'
          )"
          if [ "$current_rev" != "$GITHUB_SHA" ]; then
            echo "Skipping stale CI promotion and deployment: run=$GITHUB_SHA current=$current_rev"
            exit 0
          fi

          while IFS=$'\t' read -r host store_path; do
            pin_name="built-host-$host"
            if [ "$(cachix_pin_path "$pins" "$pin_name")" = "$store_path" ]; then
              echo "Built state already pinned: $pin_name -> $store_path"
            else
              echo "Pinning built state: $pin_name -> $store_path"
              cachix_pin_store_path whitestrake "$pin_name" "$store_path" 3
            fi
          done < <(jq -r '.[] | [.name, .storePath] | @tsv' <<< "$records")

          if [ "$(jq -r '.include | length' <<< "$deployment_matrix")" = 0 ]; then
            echo "No deployable hosts changed; not dispatching continuous deployment."
            exit 0
          fi

          echo "Dispatching continuous deployment matrix: $deployment_matrix"
          gh workflow run continuous-deployment.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --raw-field deployment_sha="$GITHUB_SHA" \
            --raw-field deployment_source=continuous-integration \
            --raw-field force=false \
            --raw-field matrix="$deployment_matrix"
