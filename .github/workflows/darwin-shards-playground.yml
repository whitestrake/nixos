name: Darwin Sharded Cache Restore Probe

on:
  workflow_dispatch:
    inputs:
      reader_pairs:
        description: Number of sequential control/candidate reader pairs
        type: choice
        options: ['1', '3']
        default: '1'
      source_generation:
        description: Existing sharded cache generation as run-attempt; empty creates one
        type: string
        default: ''
      deep_verify:
        description: Run an untimed full NAR content verification after each reader
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: darwin-shards-playground-${{ github.ref }}
  cancel-in-progress: false

env:
  FIXTURE_SHA: 33c5637ef5d9508786481530a5909a19c59d836f
  SOURCE_CACHE_ID: '7381391064'
  SOURCE_CACHE_KEY: darwin-lifecycle-v1-34026984404-aed47803728f84ad1076f48223f143ecb3ccc012-compacted
  SOURCE_CACHE_REF: refs/heads/feat/ci-optimisation
  SOURCE_CACHE_SIZE: '2051447771'
  SOURCE_CACHE_VERSION: 99b8147302caa48cd22aa865621741139ffb01c10d47c65b4818671da4075ee8
  EXPECTED_RECORDS: '[{"attr":"darwinConfigurations.andred","kind":"darwinConfiguration","name":"andred","storePath":"/nix/store/3qm99r4kgpcwfrgn3j6xlscblfz04qr9-darwin-system-26.05.c3e90c8"}]'

jobs:
  produce:
    if: github.event_name == 'push' || inputs.source_generation == ''
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      manifest-key: ${{ steps.prepare.outputs.manifest-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Pin source cache identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_CACHE_REF" --key "$SOURCE_CACHE_KEY" \
            --limit 10 --json id,key,sizeInBytes,version > "$RUNNER_TEMP/source-cache.json"
          jq -e --arg key "$SOURCE_CACHE_KEY" --arg id "$SOURCE_CACHE_ID" \
            --arg size "$SOURCE_CACHE_SIZE" --arg version "$SOURCE_CACHE_VERSION" '
              length == 1 and .[0].key == $key and (.[0].id | tostring) == $id
              and (.[0].sizeInBytes | tostring) == $size and .[0].version == $version
            ' "$RUNNER_TEMP/source-cache.json"
          mkdir -p "$RUNNER_TEMP/darwin-lifecycle/compacted"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: source
        with:
          path: ${{ runner.temp }}/darwin-lifecycle/compacted/nix-root.sparsebundle
          key: ${{ env.SOURCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Split frozen sparsebundle and write draft manifest
        id: prepare
        env:
          MATCHED_KEY: ${{ steps.source.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.source.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$SOURCE_CACHE_KEY"
          generation="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          manifest_key="darwin-shards-v1-$generation-manifest"
          echo "manifest-key=$manifest_key" >> "$GITHUB_OUTPUT"
          node .harness/.github/scripts/darwin-sharded-cache.mjs split \
            "$RUNNER_TEMP/darwin-lifecycle/compacted/nix-root.sparsebundle" \
            "$RUNNER_TEMP/darwin-shards/payloads" \
            "$RUNNER_TEMP/darwin-shards/manifest/manifest.json" \
            "$generation" "$SOURCE_CACHE_KEY" "$SOURCE_CACHE_ID" "$SOURCE_CACHE_VERSION" "$SOURCE_CACHE_SIZE"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/darwin-shards/payloads/metadata
          key: darwin-shards-v1-${{ github.run_id }}-${{ github.run_attempt }}-metadata
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/darwin-shards/payloads/band-1
          key: darwin-shards-v1-${{ github.run_id }}-${{ github.run_attempt }}-band-1
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/darwin-shards/payloads/band-2
          key: darwin-shards-v1-${{ github.run_id }}-${{ github.run_attempt }}-band-2
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/darwin-shards/payloads/band-3
          key: darwin-shards-v1-${{ github.run_id }}-${{ github.run_attempt }}-band-3
      - name: Bind saved cache identities into manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="darwin-shards-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-"
          mkdir "$RUNNER_TEMP/shard-cache-inventory"
          for role in metadata band-1 band-2 band-3; do
            for _ in 1 2 3 4 5; do
              gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix$role" \
                --limit 10 --json id,key,sizeInBytes,version > "$RUNNER_TEMP/shard-cache-inventory/$role.json"
              test "$(jq length "$RUNNER_TEMP/shard-cache-inventory/$role.json")" -eq 1 && break
              sleep 2
            done
          done
          jq -s 'add' "$RUNNER_TEMP"/shard-cache-inventory/*.json > "$RUNNER_TEMP/shard-caches.json"
          node .harness/.github/scripts/darwin-sharded-cache.mjs finalise \
            "$RUNNER_TEMP/darwin-shards/manifest/manifest.json" "$RUNNER_TEMP/shard-caches.json"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/darwin-shards/manifest
          key: ${{ steps.prepare.outputs.manifest-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: darwin-shards-producer
          path: ${{ runner.temp }}/darwin-shards/manifest/manifest.json

  reader:
    needs: produce
    if: ${{ always() && (needs.produce.result == 'success' || (needs.produce.result == 'skipped' && inputs.source_generation != '')) }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      actions: read
      checks: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || inputs.reader_pairs == '1') && '[{"pair":1,"treatment":"control"},{"pair":1,"treatment":"sharded"}]' || '[{"pair":1,"treatment":"control"},{"pair":1,"treatment":"sharded"},{"pair":2,"treatment":"sharded"},{"pair":2,"treatment":"control"},{"pair":3,"treatment":"control"},{"pair":3,"treatment":"sharded"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Start complete reader timing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measurements" "$RUNNER_TEMP/darwin-lifecycle/compacted" "$RUNNER_TEMP/darwin-shards/manifest"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/setup-start.txt"
      - name: Resolve immutable manifest generation
        id: generation
        env:
          PRODUCED_KEY: ${{ needs.produce.outputs.manifest-key }}
          SOURCE_GENERATION: ${{ inputs.source_generation }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_GENERATION" ]; then
            [[ "$SOURCE_GENERATION" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
            manifest_key="darwin-shards-v1-$SOURCE_GENERATION-manifest"
          else
            [[ "$PRODUCED_KEY" =~ ^darwin-shards-v1-[1-9][0-9]*-[1-9][0-9]*-manifest$ ]]
            manifest_key="$PRODUCED_KEY"
          fi
          echo "manifest-key=$manifest_key" >> "$GITHUB_OUTPUT"
      - name: Recheck frozen control identity
        if: matrix.treatment == 'control'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_CACHE_REF" --key "$SOURCE_CACHE_KEY" \
            --limit 10 --json id,key,sizeInBytes,version > "$RUNNER_TEMP/source-cache.json"
          jq -e --arg key "$SOURCE_CACHE_KEY" --arg id "$SOURCE_CACHE_ID" \
            --arg size "$SOURCE_CACHE_SIZE" --arg version "$SOURCE_CACHE_VERSION" '
              length == 1 and .[0].key == $key and (.[0].id | tostring) == $id
              and (.[0].sizeInBytes | tostring) == $size and .[0].version == $version
            ' "$RUNNER_TEMP/source-cache.json"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/restore-start.txt"
          nohup iostat -w 1 > "$RUNNER_TEMP/measurements/restore-iostat.txt" 2>&1 &
          echo "RESTORE_IOSTAT_PID=$!" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: control
        if: matrix.treatment == 'control'
        with:
          path: ${{ runner.temp }}/darwin-lifecycle/compacted/nix-root.sparsebundle
          key: ${{ env.SOURCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Require exact control restore
        if: matrix.treatment == 'control'
        env:
          CACHE_HIT: ${{ steps.control.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.control.outputs.cache-matched-key }}
        run: |
          kill "$RESTORE_IOSTAT_PID" 2>/dev/null || true
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$SOURCE_CACHE_KEY"
          echo "NIX_ROOT_IMAGE_BUNDLE=$RUNNER_TEMP/darwin-lifecycle/compacted/nix-root.sparsebundle" >> "$GITHUB_ENV"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/restore-end.txt"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: manifest
        if: matrix.treatment == 'sharded'
        with:
          path: ${{ runner.temp }}/darwin-shards/manifest
          key: ${{ steps.generation.outputs.manifest-key }}
          fail-on-cache-miss: true
      - name: Prepare bounded concurrent shard restore
        if: matrix.treatment == 'sharded'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_HIT: ${{ steps.manifest.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.manifest.outputs.cache-matched-key }}
          MANIFEST_KEY: ${{ steps.generation.outputs.manifest-key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$MANIFEST_KEY"
          jq -r '.caches[].key' "$RUNNER_TEMP/darwin-shards/manifest/manifest.json" | while IFS= read -r key; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$key" \
              --limit 10 --json id,key,sizeInBytes,version
          done | jq -s 'add' > "$RUNNER_TEMP/shard-caches.json"
          node .harness/.github/scripts/darwin-sharded-cache.mjs preflight \
            "$RUNNER_TEMP/darwin-shards/manifest/manifest.json" "$RUNNER_TEMP/shard-caches.json"
          toolkit_started="$SECONDS"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/toolkit-install-start.txt"
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/actions-cache" @actions/cache@6.1.0
          test "$(jq -r .version "$RUNNER_TEMP/actions-cache/node_modules/@actions/cache/package.json")" = 6.1.0
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/toolkit-install-end.txt"
          echo "$((SECONDS - toolkit_started))" > "$RUNNER_TEMP/measurements/toolkit-install-seconds.txt"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/restore-start.txt"
          nohup iostat -w 1 > "$RUNNER_TEMP/measurements/restore-iostat.txt" 2>&1 &
          echo "RESTORE_IOSTAT_PID=$!" >> "$GITHUB_ENV"
      - name: Restore and validate complete sharded image
        id: sharded
        if: matrix.treatment == 'sharded'
        continue-on-error: true
        uses: ./.harness/.github/actions/darwin-shard-restore
        env:
          ACTIONS_CACHE_MODULE: ${{ runner.temp }}/actions-cache/node_modules/@actions/cache/lib/cache.js
          SHARD_MANIFEST: ${{ runner.temp }}/darwin-shards/manifest/manifest.json
          SHARD_TELEMETRY: ${{ runner.temp }}/measurements/restore-attempts.json
      - name: Assemble validated shards
        if: matrix.treatment == 'sharded' && steps.sharded.outcome == 'success'
        run: |
          set -euo pipefail
          node .harness/.github/scripts/darwin-sharded-cache.mjs assemble \
            "$RUNNER_TEMP/darwin-shards/manifest/manifest.json" "$RUNNER_TEMP/darwin-shards/assembled/nix-root.sparsebundle"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/restore-end.txt"
      - name: Stop shard restore I/O sampling
        if: always() && matrix.treatment == 'sharded'
        run: kill "${RESTORE_IOSTAT_PID:-}" 2>/dev/null || true
      - name: Start explicit monolithic fallback
        if: matrix.treatment == 'sharded' && steps.sharded.outcome != 'success'
        run: python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/fallback-start.txt"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: fallback
        if: matrix.treatment == 'sharded' && steps.sharded.outcome != 'success'
        with:
          path: ${{ runner.temp }}/darwin-lifecycle/compacted/nix-root.sparsebundle
          key: ${{ env.SOURCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Select validated reader image
        env:
          FALLBACK_HIT: ${{ steps.fallback.outputs.cache-hit }}
          FALLBACK_KEY: ${{ steps.fallback.outputs.cache-matched-key }}
          SHARDED_OUTCOME: ${{ steps.sharded.outcome }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.treatment }}" = control ]; then
            image="$RUNNER_TEMP/darwin-lifecycle/compacted/nix-root.sparsebundle"
            resolved=control
          elif [ "$SHARDED_OUTCOME" = success ]; then
            image="$RUNNER_TEMP/darwin-shards/assembled/nix-root.sparsebundle"
            resolved=sharded
          else
            test "$FALLBACK_HIT" = true
            test "$FALLBACK_KEY" = "$SOURCE_CACHE_KEY"
            image="$RUNNER_TEMP/darwin-lifecycle/compacted/nix-root.sparsebundle"
            resolved=monolithic-fallback
            python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/restore-end.txt"
          fi
          test -d "$image"
          echo "NIX_ROOT_IMAGE_BUNDLE=$image" >> "$GITHUB_ENV"
          echo "$resolved" > "$RUNNER_TEMP/measurements/resolved-treatment.txt"
      - name: Start mount timing
        run: python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/mount-start.txt"
      - uses: ./.harness/.github/actions/nix-sparsebundle-mount
        with:
          image-size: 64g
          system: aarch64-darwin
      - name: Finish mount timing
        run: python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/mount-end.txt"
      - uses: ./.harness/.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Measure full Darwin output and publication
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/build-start.txt"
          nfb=/nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build/bin/nix-fast-build
          test -x "$nfb"
          "$nfb" --help >/dev/null
          readlink /nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build > "$RUNNER_TEMP/measurements/nfb-path.txt"
          python3 .harness/.github/scripts/fast-ci-measure.py "$RUNNER_TEMP/measurements" -- \
            "$nfb" --flake .#ci.aarch64-darwin --systems aarch64-darwin --eval-workers 1 \
            --option builders '' --option max-jobs auto --cachix-cache whitestrake --retries 2 \
            --result-file "$RUNNER_TEMP/measurements/results.json" -j 50 --stream-json-lines
          jq -ce -f .harness/.github/scripts/nix-fast-build-records.jq \
            "$RUNNER_TEMP/measurements/results.json" > "$RUNNER_TEMP/measurements/records.json"
          test "$(jq -c 'map({attr,kind,name,storePath}) | sort_by(.attr)' "$RUNNER_TEMP/measurements/records.json")" = \
            "$(jq -c 'map({attr,kind,name,storePath}) | sort_by(.attr)' <<< "$EXPECTED_RECORDS")"
          jq -e 'any(.results[]; .type == "CACHIX" and .success == true)' "$RUNNER_TEMP/measurements/results.json"
          jq -r '.[].storePath' "$RUNNER_TEMP/measurements/records.json" | while IFS= read -r path; do
            nix path-info --store https://whitestrake.cachix.org "$path" >/dev/null
          done
          jq -cnS --arg revision "$FIXTURE_SHA" --argjson records "$EXPECTED_RECORDS" \
            '{revision:$revision,records:($records | map({attr,storePath}))}' > "$RUNNER_TEMP/measurements/darwin-proof.json"
          proof_path="$(nix store add --mode flat --name darwin-shards-proof.json "$RUNNER_TEMP/measurements/darwin-proof.json")"
          cachix push whitestrake "$proof_path"
          nix path-info --store https://whitestrake.cachix.org "$proof_path" >/dev/null
          echo "$proof_path" > "$RUNNER_TEMP/measurements/proof-path.txt"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/build-end.txt"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/completion-end.txt"
      - name: Run separate deep NAR acceptance check
        if: inputs.deep_verify
        run: |
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/deep-verify-start.txt"
          nix store verify --all
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/measurements/deep-verify-end.txt"
      - name: Record reader environment
        if: always()
        run: |
          jq -n --arg pair "${{ matrix.pair }}" --arg requested "${{ matrix.treatment }}" \
            --arg resolved "$(cat "$RUNNER_TEMP/measurements/resolved-treatment.txt" 2>/dev/null || echo failed)" \
            --arg fixture "$FIXTURE_SHA" --arg harness "$GITHUB_SHA" --arg runnerImage "${ImageVersion:-unknown}" \
            --arg cpu "$(sysctl -n machdep.cpu.brand_string)" \
            '{pair:$pair,requestedTreatment:$requested,resolvedTreatment:$resolved,fixture:$fixture,harness:$harness,runnerImage:$runnerImage,cpu:$cpu,requiredValidation:"manifest coverage, sizes and modes plus native cache integrity",toolkitInstallIncludedInCompletion:true,toolkitInstallIncludedInRestoreInterval:false,deepVerificationTimed:false}' \
            > "$RUNNER_TEMP/measurements/environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-shards-reader-${{ matrix.pair }}-${{ matrix.treatment }}
          path: ${{ runner.temp }}/measurements

  compare:
    needs: reader
    if: always() && needs.reader.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: darwin-shards-reader-*
          path: ${{ runner.temp }}/readers
      - name: Verify every control/candidate pair has identical published output
        env:
          PAIRS: ${{ github.event_name == 'push' && '1' || inputs.reader_pairs }}
        run: |
          set -euo pipefail
          for pair in $(seq 1 "$PAIRS"); do
            control="$RUNNER_TEMP/readers/darwin-shards-reader-$pair-control"
            sharded="$RUNNER_TEMP/readers/darwin-shards-reader-$pair-sharded"
            test "$(jq -c 'map({attr,storePath}) | sort_by(.attr)' "$control/records.json")" = \
              "$(jq -c 'map({attr,storePath}) | sort_by(.attr)' "$sharded/records.json")"
            test "$(cat "$control/proof-path.txt")" = "$(cat "$sharded/proof-path.txt")"
            test "$(jq -r .resolvedTreatment "$sharded/environment.json")" = sharded
          done
          jq -n --argjson pairs "$PAIRS" '{matching:true,pairs:$pairs}' | tee -a "$GITHUB_STEP_SUMMARY"
