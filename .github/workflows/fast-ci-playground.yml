name: Fast CI Playground

on:
  push:
    branches: [feat/ci-optimisation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-playground-${{ github.ref }}
  cancel-in-progress: false

env:
  FIXTURE_SHA: 14a8d7657900a917560ddbe77577c0d5a1b77638
  SEED_SHA: c2f6bc94bb96d535467b2f20f81b2108ee0b2cb9

jobs:
  trial:
    name: Trial ${{ matrix.round }} ${{ matrix.pack }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: [1]
        pack: [erofs, cold]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start timing
        run: |
          mkdir -p "$RUNNER_TEMP/measurements"
          date +%s.%N > "$RUNNER_TEMP/measurements/setup-start.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          path: fixture
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: restore
        if: matrix.pack != 'cold'
        with:
          path: ${{ runner.temp }}/fast-ci-erofs
          key: fast-ci-playground-v2-${{ matrix.pack == 'miss' && github.run_id || env.SEED_SHA }}-erofs
      - name: Attempt seed mount and validate tool
        id: mount
        if: steps.restore.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          PACK: ${{ matrix.pack }}
        run: |
          set -euo pipefail
          test ! -e /nix
          cd "$RUNNER_TEMP/fast-ci-erofs"
          if [ "$PACK" = corrupt-image ]; then
            printf broken > image
          fi
          sha256sum --check image.sha256
          sudo modprobe erofs
          sudo modprobe overlay
          mkdir -p "$RUNNER_TEMP/lower" "$RUNNER_TEMP/upper" "$RUNNER_TEMP/work"
          sudo mkdir /nix
          touch "$RUNNER_TEMP/created-nix"
          sudo mount -t erofs -o loop,ro image "$RUNNER_TEMP/lower"
          options="lowerdir=$RUNNER_TEMP/lower,upperdir=$RUNNER_TEMP/upper,workdir=$RUNNER_TEMP/work"
          if [ "$PACK" = mount-failure ]; then
            options="$options,deliberately_invalid_option=1"
          fi
          sudo mount -t overlay overlay -o "$options" /nix
          nfb="$(cat nfb-path.txt)"
          if [ "$PACK" = invalid-nfb ]; then
            nfb=/nix/store/00000000000000000000000000000000-missing-tool
          fi
          "$nfb/bin/nix-fast-build" --help >/dev/null
          findmnt /nix
      - name: Recover rejected seed and assert fault outcome
        env:
          PACK: ${{ matrix.pack }}
          MOUNT_OUTCOME: ${{ steps.mount.outcome }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$MOUNT_OUTCOME" = failure ]; then
            if [ -e "$RUNNER_TEMP/created-nix" ]; then
              if mountpoint -q /nix; then sudo umount /nix; fi
              if mountpoint -q "$RUNNER_TEMP/lower"; then sudo umount "$RUNNER_TEMP/lower"; fi
              sudo rmdir /nix
            fi
          fi
          case "$PACK" in
            erofs) test "$MOUNT_OUTCOME" = success; mountpoint -q /nix ;;
            cold|miss) test "$CACHE_HIT" != true; test ! -e /nix ;;
            *) test "$CACHE_HIT" = true; test "$MOUNT_OUTCOME" = failure; test ! -e /nix ;;
          esac
          jq -n --arg treatment "$PACK" --arg mount "$MOUNT_OUTCOME" --arg hit "$CACHE_HIT" \
            '{treatment:$treatment,mountOutcome:$mount,cacheHit:$hit}' > "$RUNNER_TEMP/measurements/fallback.json"
      - uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
      - uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Measure Linux build
        working-directory: fixture
        run: |
          set -euo pipefail
          date +%s.%N > "$RUNNER_TEMP/measurements/build-start.txt"
          python3 ../.github/scripts/fast-ci-measure.py "$RUNNER_TEMP/measurements" -- \
            nix run --option builders '' --option max-jobs auto .#packages.x86_64-linux.nix-fast-build -- \
            --flake .#ci.linux --systems 'x86_64-linux aarch64-linux' --eval-workers 3 \
            --store ssh-ng://eu.nixbuild.net --option builders '' --option max-jobs 2 \
            --retries 2 --result-file "$RUNNER_TEMP/measurements/results.json" -j 50 --stream-json-lines
          date +%s.%N > "$RUNNER_TEMP/measurements/build-end.txt"
          jq -ce -f ../.github/scripts/nix-fast-build-records.jq "$RUNNER_TEMP/measurements/results.json" > "$RUNNER_TEMP/measurements/records.json"
      - name: Validate current inputs and changed tool definition
        working-directory: fixture
        run: |
          set -euo pipefail
          python3 ../.github/scripts/fast-ci-change-probe.py "$RUNNER_TEMP/measurements/changed"
          python3 ../.github/scripts/fast-ci-measure.py "$RUNNER_TEMP/measurements/changed" -- \
            nix run --option builders '' --option max-jobs auto .#packages.x86_64-linux.nix-fast-build -- \
            --flake .#ci.linux --systems 'x86_64-linux aarch64-linux' --eval-workers 3 \
            --store ssh-ng://eu.nixbuild.net --option builders '' --option max-jobs 2 \
            --retries 2 --result-file "$RUNNER_TEMP/measurements/changed/results.json" -j 50 --stream-json-lines
      - name: Check seed membership against current desired identities
        if: matrix.pack == 'erofs'
        run: |
          python3 - <<'PYPROBE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          seed = root / 'fast-ci-erofs'
          result = json.loads((root / 'measurements/changed/identity.json').read_text())
          assert set(result['baselineInputs']) == set((seed / 'external-inputs.txt').read_text().splitlines())
          baseline = set((seed / 'baseline-paths.txt').read_text().splitlines())
          assert result['oldTool'] == (seed / 'nfb-path.txt').read_text().strip()
          assert result['newTool'] not in baseline
          useful = sorted(set(result['newToolClosure']) - baseline)
          assert result['newTool'] in useful
          (root / 'measurements/changed/useful-tool-paths.txt').write_text('\n'.join(useful) + '\n')
          PYPROBE
      - name: Record environment
        if: always()
        env:
          PACK: ${{ matrix.pack }}
          ROUND: ${{ matrix.round }}
        run: |
          jq -n --arg treatment "$PACK" --arg fixture "$FIXTURE_SHA" --arg harness "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg round "$ROUND" \
            --arg runnerImage "${ImageVersion:-unknown}" \
            --arg cpu "$(awk -F ': ' '/model name/ { print $2; exit }' /proc/cpuinfo)" \
            --arg cores "$(nproc)" --arg kernel "$(uname -r)" \
            '{treatment:$treatment,fixture:$fixture,harness:$harness,run:$run,attempt:$attempt,round:$round,runnerImage:$runnerImage,cpu:$cpu,cores:$cores,kernel:$kernel}' \
            > "$RUNNER_TEMP/measurements/environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trial-${{ matrix.round }}-${{ matrix.pack }}
          path: ${{ runner.temp }}/measurements
      - name: Unmount disposable seed
        if: always() && steps.mount.outcome == 'success'
        run: |
          if mountpoint -q /nix; then sudo umount /nix; fi
          if mountpoint -q "$RUNNER_TEMP/lower"; then sudo umount "$RUNNER_TEMP/lower"; fi
