name: "Fast CI Production Probe"

on:
  workflow_dispatch:
    inputs:
      seed_fault:
        description: Inject a fault into the restored disposable seed
        type: choice
        options: [none, corrupt-image, invalid-tool]
        default: none
      nfb_launch:
        description: Use cached NFB optimistically or resolve the current flake tool
        type: choice
        options: [cached, flake, flake-patched, batch, batch-8, determinate-1, determinate-parallel]
        default: cached
      darwin_cache_key:
        description: Exact experimental compacted Darwin cache key (empty uses master)
        type: string
        default: ''
      darwin_reader:
        description: Darwin Nix store reader
        type: choice
        options: [sparsebundle, release-hot]
        default: sparsebundle
      linux_system:
        description: Native Linux evaluator architecture (all ten targets on both)
        type: choice
        options: [x86_64-linux, aarch64-linux]
        default: x86_64-linux
      seed_run:
        description: Native seed producer run ID (empty uses legacy x86 seed)
        type: string
        default: ''
      seed:
        description: Restore the Linux evaluator seed
        type: boolean
        default: true
      eval_workers:
        description: Linux host evaluation workers
        type: choice
        options: ['3', '4']
        default: '3'
      fail_source_check:
        description: Inject an unformatted Nix source change and require source checks to fail
        type: boolean
        default: false
      profile:
        description: Sample Linux runner memory and run the native Nix evaluation profiler
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fast-ci-playground-${{ github.ref }}
  cancel-in-progress: false

env:
  SEED_SHA: c2f6bc94bb96d535467b2f20f81b2108ee0b2cb9
  DARWIN_CONTROL_CACHE_ID: '7381391064'
  DARWIN_CONTROL_CACHE_KEY: darwin-lifecycle-v1-34026984404-aed47803728f84ad1076f48223f143ecb3ccc012-compacted
  DARWIN_CONTROL_CACHE_REF: refs/heads/feat/ci-optimisation
  DARWIN_CONTROL_CACHE_SIZE: '2051447771'
  DARWIN_CONTROL_CACHE_VERSION: 99b8147302caa48cd22aa865621741139ffb01c10d47c65b4818671da4075ee8
  DARWIN_BASE_RELEASE_ID: '383622742'
  DARWIN_BASE_MANIFEST_SHA: 8406fdfb37a9c2bdfe98195cf1193a02470b1d84d3a1451c78e8248a8fc6d3aa
  DARWIN_BASE_IMAGE_BYTES: '1987396353'
  DARWIN_BASE_IMAGE_SHA: aadc061550bbb488bb8a47a8b65f60c12572da7c7e94761dbbdd90d5d2037285
  DARWIN_HOT_RELEASE_ID: '383632588'
  DARWIN_HOT_MANIFEST_SHA: c686235f532bd450a1bf7968fcdd42bf4ff191fc43f2a5e9572ed88e0f499a0a
  DARWIN_FSCK_RUN_ID: '34047619836'
  DARWIN_FSCK_RUN_ATTEMPT: '1'
  DARWIN_FSCK_HEAD_SHA: 1ab8230b12695dadd46e12e2a9b6b37152b3a50c
  DARWIN_FSCK_ARTIFACT_ID: '9993605220'
  DARWIN_FSCK_ARTIFACT_DIGEST: sha256:66366fbb08c2c9d05bf4aa0df94846fed8b60ee011742f791d5532cc3306fb49
  DARWIN_EXPECTED_NFB: /nix/store/q27c609nry8dzwiyc92liygrqbbdy6pi-nix-fast-build-1.6.0

jobs:
  linux-builds:
    name: "Linux"
    runs-on: ${{ inputs.linux_system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      EVALUATOR_SYSTEM: ${{ inputs.linux_system || 'x86_64-linux' }}
    timeout-minutes: 355
    outputs:
      records: ${{ steps.records.outputs.records }}
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start Linux timing
        env:
          SEED_RUN: ${{ inputs.seed_run }}
          USE_SEED: ${{ inputs.seed }}
        run: |
          mkdir -p "$RUNNER_TEMP/measurements"
          date +%s.%N > "$RUNNER_TEMP/measurements/setup-start.txt"
          [[ -z "$SEED_RUN" || "$SEED_RUN" =~ ^[0-9]+$ ]]
          if [[ "$USE_SEED" == true && "$EVALUATOR_SYSTEM" == aarch64-linux ]]; then test -n "$SEED_RUN"; fi
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: restore
        if: github.event_name == 'push' || inputs.seed
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/fast-ci-erofs
          key: ${{ inputs.seed_run != '' && format('fast-ci-native-seed-v1-{0}-{1}', inputs.seed_run, inputs.linux_system) || format('fast-ci-playground-v2-{0}-erofs', env.SEED_SHA) }}
      - name: Inject restored seed fault
        if: inputs.seed_fault != 'none'
        env:
          FAULT: ${{ inputs.seed_fault }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          case "$FAULT" in
            corrupt-image) printf 'corrupt test image\n' > "$RUNNER_TEMP/fast-ci-erofs/image" ;;
            invalid-tool) printf '/nix/store/00000000000000000000000000000000-missing-tool\n' > "$RUNNER_TEMP/fast-ci-erofs/nfb-path.txt" ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$FAULT" > "$RUNNER_TEMP/measurements/seed-fault.txt"
      - name: Try evaluator seed
        id: mount
        if: steps.restore.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test ! -e /nix
          cd "$RUNNER_TEMP/fast-ci-erofs"
          sha256sum --check image.sha256
          sudo modprobe erofs
          sudo modprobe overlay
          mkdir -p "$RUNNER_TEMP/lower" "$RUNNER_TEMP/upper" "$RUNNER_TEMP/work"
          sudo mkdir /nix
          touch "$RUNNER_TEMP/created-nix"
          sudo mount -t erofs -o loop,ro image "$RUNNER_TEMP/lower"
          sudo mount -t overlay overlay -o "lowerdir=$RUNNER_TEMP/lower,upperdir=$RUNNER_TEMP/upper,workdir=$RUNNER_TEMP/work" /nix
          nfb="$(cat nfb-path.txt)"
          "$nfb/bin/nix-fast-build" --help >/dev/null
      - name: Recover rejected evaluator seed
        if: steps.mount.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ -e "$RUNNER_TEMP/created-nix" ]; then
            if mountpoint -q /nix; then sudo umount /nix; fi
            if mountpoint -q "$RUNNER_TEMP/lower"; then sudo umount "$RUNNER_TEMP/lower"; fi
            sudo rmdir /nix
          fi
          test ! -e /nix

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Configure nixbuild.net
        uses: nixbuild/nixbuild-action@ccd11ee76c26c018e8470835dc2e286a5a024a14 # v27
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
          settings: |
            caches = cachix://whitestrake
            access-tokens = cachix://whitestrake=WRITE:${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Linux configurations
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAST_CI_FORWARD_EVENTS: "1"
          FAST_CI_SAMPLE_MEMORY: "1"
          FAST_CI_SAMPLE_PROCESSES: ${{ inputs.profile && '1' || '0' }}
          EVAL_WORKERS: ${{ inputs.eval_workers || '3' }}
          NFB_LAUNCH: ${{ inputs.nfb_launch || 'cached' }}
          SEED_MOUNT_OUTCOME: ${{ steps.mount.outcome }}
        run: |
          set -euo pipefail

          date +%s.%N > "$RUNNER_TEMP/measurements/build-start.txt"
          awk 'NR > 2 && $1 != "lo:" {sum += $2} END {printf "%.0f\n", sum}' /proc/net/dev > "$RUNNER_TEMP/measurements/tool-rx-start.txt"
          if [[ "$NFB_LAUNCH" != flake* && "$SEED_MOUNT_OUTCOME" == success ]]; then
            nfb="$(cat "$RUNNER_TEMP/fast-ci-erofs/nfb-path.txt")"
            [[ "$nfb" =~ ^/nix/store/[a-z0-9]{32}-[A-Za-z0-9+._?=-]+$ ]]
            "$nfb/bin/nix-fast-build" --help >/dev/null
            selection=cached
          else
            selection=flake
            target=(".#packages.$EVALUATOR_SYSTEM.nix-fast-build")
            if [[ "$NFB_LAUNCH" == flake-patched ]]; then
              target=(--impure --file .github/nfb-shutdown-control.nix --argstr system "$EVALUATOR_SYSTEM")
              selection=flake-patched
            fi
            nfb="$(nix build --no-link --print-out-paths --option builders '' --option max-jobs auto "${target[@]}")"
          fi
          nix_fast_build=("$nfb/bin/nix-fast-build")
          remote_store=ssh-ng://eu.nixbuild.net
          if [[ "$NFB_LAUNCH" == batch-8 ]]; then remote_store+='?max-connections=8'; fi
          if [[ "$NFB_LAUNCH" == batch* ]]; then
            nix_fast_build=(python3 .github/scripts/fast-ci-batch.py --nfb-root "$nfb")
          elif [[ "$NFB_LAUNCH" == determinate-* ]]; then
            test "$SEED_MOUNT_OUTCOME" = success
            determinate="$(cat "$RUNNER_TEMP/fast-ci-erofs/determinate-path.txt")"
            [[ "$determinate" =~ ^/nix/store/[a-z0-9]{32}-[A-Za-z0-9+._?=-]+$ ]]
            "$determinate/bin/nix" --version > "$RUNNER_TEMP/measurements/determinate-version.txt"
            cores=1
            if [[ "$NFB_LAUNCH" == determinate-parallel ]]; then cores=0; fi
            nix_fast_build=(python3 .github/scripts/fast-ci-batch.py --nfb-root "$nfb" --direct-nix "$determinate/bin/nix" --eval-cores "$cores")
          fi
          date +%s.%N > "$RUNNER_TEMP/measurements/tool-ready.txt"
          awk 'NR > 2 && $1 != "lo:" {sum += $2} END {printf "%.0f\n", sum}' /proc/net/dev > "$RUNNER_TEMP/measurements/tool-rx-end.txt"
          jq -n --arg requested "$NFB_LAUNCH" --arg selected "$selection" --arg path "$nfb" \
            '{requested:$requested,selected:$selected,path:$path}' > "$RUNNER_TEMP/measurements/tool.json"
          python3 .github/scripts/nix_fast_build.py --publish-checks -- \
            python3 .github/scripts/fast-ci-measure.py "$RUNNER_TEMP/measurements" -- \
            "${nix_fast_build[@]}" \
            --flake .#ci.linux-hosts \
            --systems 'x86_64-linux aarch64-linux' \
            --eval-workers "$EVAL_WORKERS" \
            --store "$remote_store" \
            --option max-jobs 2 \
            --retries 2 \
            --result-file "$RUNNER_TEMP/ci-linux-results.json" \
            -j 50
          date +%s.%N > "$RUNNER_TEMP/measurements/build-end.txt"
          mapfile -t host_derivations < <(find /nix/store -maxdepth 1 -name '*-nixos-system-*.drv' -type f)
          test "${#host_derivations[@]}" -gt 0
          nix derivation show "${host_derivations[@]}" > "$RUNNER_TEMP/measurements/host-derivations.json"
          if [[ "${{ inputs.profile }}" == true ]]; then
            while IFS= read -r path; do
              if [[ -x "$path/bin/nix-eval-jobs" ]]; then
                ldd "$path/bin/nix-eval-jobs" >> "$RUNNER_TEMP/measurements/evaluator-linkage.txt"
              fi
            done < <(nix-store --query --requisites "$nfb")
          fi

      - name: Profile Linux evaluation
        if: inputs.profile
        shell: bash
        run: |
          set -euo pipefail

          profile_dir="$RUNNER_TEMP/measurements/eval-profile"
          mkdir -p "$profile_dir"
          nix_version="$(nix --version)"
          printf '%s\n' "$nix_version" | tee "$profile_dir/nix-version.txt"
          test "$nix_version" = 'nix (Nix) 2.34.7'
          nix eval --help > "$profile_dir/nix-eval-help.txt"
          nix config show --json \
            | jq '{
                "eval-profiler": .["eval-profiler"],
                "eval-profile-file": .["eval-profile-file"],
                "eval-profiler-frequency": .["eval-profiler-frequency"]
              }' \
            > "$profile_dir/eval-profiler-config-help.json"
          jq -e 'all(.[]; . != null)' "$profile_dir/eval-profiler-config-help.json" >/dev/null

          profile_started="$(date +%s.%N)"
          nix eval --json \
            .#ci.linux-hosts.nixosConfigurations \
            --apply 'hosts: builtins.mapAttrs (_: drv: drv.drvPath) hosts' \
            --eval-profiler flamegraph \
            --eval-profile-file "$profile_dir/linux-hosts.folded" \
            > "$profile_dir/drv-paths.json"
          profile_finished="$(date +%s.%N)"
          test -s "$profile_dir/linux-hosts.folded"
          jq -e '
            type == "object"
            and length > 0
            and all(.[]; type == "string" and test("^/nix/store/[0-9a-z]{32}-.+\\.drv$"))
          ' "$profile_dir/drv-paths.json" >/dev/null
          jq -n \
            --argjson started "$profile_started" \
            --argjson finished "$profile_finished" \
            --argjson foldedStackLines "$(wc -l < "$profile_dir/linux-hosts.folded")" \
            '{
              instrumented: true,
              scope: "single-process Linux host derivation evaluation",
              profiler: "Nix flamegraph sampling profiler",
              sampleFormat: "folded stacks with leaf-stack sample counts",
              inclusiveFrameCountsComputed: false,
              startedEpochSeconds: $started,
              finishedEpochSeconds: $finished,
              durationSeconds: ($finished - $started),
              foldedStackLines: $foldedStackLines
            }' > "$profile_dir/metadata.json"

      - name: Publish Linux records
        id: records
        shell: bash
        run: |
          set -euo pipefail

          records="$(jq -ce -f .github/scripts/nix-fast-build-records.jq "$RUNNER_TEMP/ci-linux-results.json")"
          printf 'records=%s\n' "$records" >> "$GITHUB_OUTPUT"

      - name: Record Linux evidence
        if: always()
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          MOUNT_OUTCOME: ${{ steps.mount.outcome }}
          SEED_RUN: ${{ inputs.seed_run }}
          EVAL_WORKERS: ${{ inputs.eval_workers || '3' }}
        run: |
          if [ -f "$RUNNER_TEMP/ci-linux-results.json" ]; then
            cp "$RUNNER_TEMP/ci-linux-results.json" "$RUNNER_TEMP/measurements/results.json"
          fi
          jq -n --arg hit "$CACHE_HIT" --arg mount "$MOUNT_OUTCOME" --arg harness "$GITHUB_SHA" \
            --arg cpu "$(awk -F ': ' '/model name/ { print $2; exit }' /proc/cpuinfo)" \
            --arg runnerImage "${ImageVersion:-unknown}" --arg run "$GITHUB_RUN_ID" \
            --arg architecture "$(uname -m)" --arg evaluatorSystem "$EVALUATOR_SYSTEM" \
            --arg seedRun "$SEED_RUN" --argjson evalWorkers "$EVAL_WORKERS" --argjson cores "$(nproc)" \
            '{cacheHit:$hit,mountOutcome:$mount,harness:$harness,cpu:$cpu,runnerImage:$runnerImage,run:$run,architecture:$architecture,evaluatorSystem:$evaluatorSystem,seedRun:$seedRun,evalWorkers:$evalWorkers,cores:$cores}' \
            > "$RUNNER_TEMP/measurements/environment.json"
          lscpu --json > "$RUNNER_TEMP/measurements/lscpu.json"
          nix --version > "$RUNNER_TEMP/measurements/nix-version.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: linux-evidence
          path: ${{ runner.temp }}/measurements
      - name: Unmount evaluator seed
        if: always() && steps.mount.outcome == 'success'
        run: |
          sudo umount /nix
          sudo umount "$RUNNER_TEMP/lower"

  source-checks:
    name: "Source checks"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start source-check timing
        run: |
          mkdir -p "$RUNNER_TEMP/measurements"
          date +%s.%N > "$RUNNER_TEMP/measurements/setup-start.txt"
      - name: Inject unformatted source-check failure
        if: inputs.fail_source_check
        shell: bash
        run: |
          set -euo pipefail

          target=modules/ci.nix
          sed -i '1,6c\{ config, lib, self, ... }: let' "$target"
          if git diff --quiet -- "$target"; then
            echo "::error ::Failed to inject the source-check formatting change."
            exit 1
          fi
          git diff -- "$target" | tee "$RUNNER_TEMP/measurements/injected-source.diff"
      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Build source checks locally
        id: build-source-checks
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAST_CI_FORWARD_EVENTS: "1"
          FAST_CI_SAMPLE_MEMORY: ${{ inputs.profile && '1' || '0' }}
        run: |
          set -euo pipefail

          nix_fast_build=(
            nix run \
              --option builders '' \
              --option max-jobs auto \
              ".#packages.x86_64-linux.nix-fast-build" \
              --
          )
          date +%s.%N > "$RUNNER_TEMP/measurements/build-start.txt"
          python3 .github/scripts/nix_fast_build.py --publish-checks -- \
            python3 .github/scripts/fast-ci-measure.py "$RUNNER_TEMP/measurements" -- \
            "${nix_fast_build[@]}" \
            --flake .#ci.linux-checks \
            --systems x86_64-linux \
            --eval-workers 2 \
            --option builders '' \
            --option max-jobs 2 \
            --retries 2 \
            --result-file "$RUNNER_TEMP/ci-checks-results.json" \
            -j 2
          date +%s.%N > "$RUNNER_TEMP/measurements/build-end.txt"

      - name: Require source-check outcome
        if: always()
        shell: bash
        env:
          EXPECTED_FAILURE: ${{ inputs.fail_source_check }}
          SOURCE_CHECK_OUTCOME: ${{ steps.build-source-checks.outcome }}
        run: |
          set -euo pipefail

          if [ "$EXPECTED_FAILURE" = true ]; then
            if [ "$SOURCE_CHECK_OUTCOME" != failure ]; then
              echo "::error ::Injected source change did not fail the ordinary source-check runner: outcome=$SOURCE_CHECK_OUTCOME"
              exit 1
            fi
            echo "::error ::Intentional source-check failure confirmed; blocking proof assembly."
            exit 1
          fi
          if [ "$SOURCE_CHECK_OUTCOME" != success ]; then
            echo "::error ::Source checks failed unexpectedly: outcome=$SOURCE_CHECK_OUTCOME"
            exit 1
          fi

      - name: Record source-check evidence
        if: always()
        env:
          CACHE_HIT: false
          FAIL_SOURCE_CHECK: ${{ inputs.fail_source_check }}
          MOUNT_OUTCOME: skipped
          SOURCE_CHECK_OUTCOME: ${{ steps.build-source-checks.outcome }}
        run: |
          if [ -f "$RUNNER_TEMP/ci-checks-results.json" ]; then
            cp "$RUNNER_TEMP/ci-checks-results.json" "$RUNNER_TEMP/measurements/results.json"
          fi
          jq -n --arg hit "$CACHE_HIT" --arg mount "$MOUNT_OUTCOME" --arg harness "$GITHUB_SHA" \
            --arg failSourceCheck "$FAIL_SOURCE_CHECK" --arg sourceCheckOutcome "$SOURCE_CHECK_OUTCOME" \
            --arg cpu "$(awk -F ': ' '/model name/ { print $2; exit }' /proc/cpuinfo)" \
            --arg runnerImage "${ImageVersion:-unknown}" --arg run "$GITHUB_RUN_ID" \
            '{
              cacheHit: $hit,
              mountOutcome: $mount,
              harness: $harness,
              cpu: $cpu,
              runnerImage: $runnerImage,
              run: $run,
              failSourceCheck: ($failSourceCheck == "true"),
              sourceCheckOutcome: $sourceCheckOutcome
            }' \
            > "$RUNNER_TEMP/measurements/environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: source-check-evidence
          path: ${{ runner.temp }}/measurements
  darwin-builds:
    name: "Darwin"
    runs-on: macos-26
    timeout-minutes: 355
    outputs:
      records: ${{ steps.records.outputs.records }}
    permissions:
      actions: read
      checks: write
      contents: read
    env:
      NIX_ROOT_CACHE_KEY_PREFIX: nix-root-ci-aarch64-darwin-sparsebundle-v1
      NIX_ROOT_IMAGE_DIR_NAME: nix-root-ci-aarch64-darwin
      NIX_ROOT_IMAGE_SIZE: 64g
      NIX_ROOT_SYSTEM: aarch64-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start Darwin reader timing
        env:
          DARWIN_READER: ${{ inputs.darwin_reader }}
          CACHE_KEY: ${{ inputs.darwin_cache_key }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-reader-evidence"
          mkdir -p "$root/lazy" "$RUNNER_TEMP/darwin-reader-payload" \
            "$RUNNER_TEMP/darwin-lifecycle/compacted"
          python3 -c 'import time; print(time.time())' > "$root/setup-start.txt"
          python3 -c 'import time; print(time.time())' > "$root/restore-start.txt"
          [[ "$DARWIN_READER" = sparsebundle || "$DARWIN_READER" = release-hot ]]
          if [ "$DARWIN_READER" = release-hot ]; then
            test "$CACHE_KEY" = "$DARWIN_CONTROL_CACHE_KEY"
          fi
          if [ "$CACHE_KEY" = "$DARWIN_CONTROL_CACHE_KEY" ]; then
            test "$GITHUB_REF" = "$DARWIN_CONTROL_CACHE_REF"
          fi

      - name: Authenticate the pinned filesystem gate
        if: inputs.darwin_reader == 'release-hot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/darwin-reader-evidence/preflight"
          payload="$RUNNER_TEMP/darwin-reader-payload/preflight"
          mkdir -p "$evidence" "$payload"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DARWIN_FSCK_RUN_ID" > "$payload/run.json"
          jq -e --argjson id "$DARWIN_FSCK_RUN_ID" --argjson attempt "$DARWIN_FSCK_RUN_ATTEMPT" \
            --arg head "$DARWIN_FSCK_HEAD_SHA" '
              .id == $id and .run_attempt == $attempt and .head_sha == $head
              and .path == ".github/workflows/darwin-hotpack-playground.yml"
              and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"
            ' "$payload/run.json"
          jq '{id,run_attempt,head_sha,path,event,status,conclusion}' "$payload/run.json" > "$evidence/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DARWIN_FSCK_ARTIFACT_ID" \
            > "$payload/artifact.json"
          jq -e --argjson id "$DARWIN_FSCK_ARTIFACT_ID" --argjson run "$DARWIN_FSCK_RUN_ID" \
            --arg digest "$DARWIN_FSCK_ARTIFACT_DIGEST" --arg head "$DARWIN_FSCK_HEAD_SHA" '
              .id == $id and .name == "darwin-hotpack-filesystem-gate" and .expired == false
              and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $head
            ' "$payload/artifact.json"
          jq '{id,name,size_in_bytes,digest,expired,workflow_run:{id:.workflow_run.id,head_sha:.workflow_run.head_sha}}' \
            "$payload/artifact.json" > "$evidence/artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DARWIN_FSCK_ARTIFACT_ID/zip" \
            > "$payload/gate.zip"
          test "$(shasum -a 256 "$payload/gate.zip" | awk '{print $1}')" = \
            "${DARWIN_FSCK_ARTIFACT_DIGEST#sha256:}"
          unzip -q "$payload/gate.zip" -d "$evidence"
          jq -e --argjson release "$DARWIN_BASE_RELEASE_ID" --arg manifest "$DARWIN_BASE_MANIFEST_SHA" \
            --argjson bytes "$DARWIN_BASE_IMAGE_BYTES" --arg image "$DARWIN_BASE_IMAGE_SHA" '
              .releaseId == $release and .manifestSha256 == $manifest
              and .imageBytes == $bytes and .imageSha256 == $image
              and .responseBytes == $bytes and .uniqueResponseBytes == $bytes
            ' "$evidence/eager.json"
          jq -e --arg image "$DARWIN_BASE_IMAGE_SHA" '
              .filesystem == "case-sensitive-jhfs-plus"
              and .attachPolicy == "readonly-nomount-noautofsck"
              and .fsck == "fsck_hfs -fn" and .fsckStatus == 0
              and .imageSha256Before == $image and .imageSha256After == $image
            ' "$evidence/gate.json"
          test "$(cat "$evidence/fsck.status")" = 0
          grep -Eiq 'appears to be OK\.?$' "$evidence/fsck.stdout"

      - name: Restore sparsebundle Nix root cache
        if: inputs.darwin_reader == 'sparsebundle' && inputs.darwin_cache_key == ''
        uses: ./.github/actions/nix-sparsebundle-cache-restore
        with:
          cache-key-prefix: ${{ env.NIX_ROOT_CACHE_KEY_PREFIX }}
          image-dir-name: ${{ env.NIX_ROOT_IMAGE_DIR_NAME }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Select frozen Darwin fixture
        if: inputs.darwin_reader == 'sparsebundle' && inputs.darwin_cache_key != ''
        env:
          CACHE_KEY: ${{ inputs.darwin_cache_key }}
        run: |
          [[ "$CACHE_KEY" =~ ^darwin-lifecycle-v1-[0-9]+-[a-f0-9]{40}-compacted$ ]]
          echo "NIX_ROOT_IMAGE_BUNDLE=$RUNNER_TEMP/darwin-lifecycle/compacted/nix-root.sparsebundle" >> "$GITHUB_ENV"
      - name: Authenticate the paired sparsebundle cache
        if: inputs.darwin_reader == 'sparsebundle' && inputs.darwin_cache_key == env.DARWIN_CONTROL_CACHE_KEY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$DARWIN_CONTROL_CACHE_REF" \
            --key "$DARWIN_CONTROL_CACHE_KEY" --limit 10 --json id,key,sizeInBytes,version \
            > "$RUNNER_TEMP/darwin-reader-evidence/control-cache.json"
          jq -e --argjson id "$DARWIN_CONTROL_CACHE_ID" --arg key "$DARWIN_CONTROL_CACHE_KEY" \
            --argjson size "$DARWIN_CONTROL_CACHE_SIZE" --arg version "$DARWIN_CONTROL_CACHE_VERSION" '
              length == 1 and .[0].id == $id and .[0].key == $key
              and .[0].sizeInBytes == $size and .[0].version == $version
            ' "$RUNNER_TEMP/darwin-reader-evidence/control-cache.json"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: frozen-darwin
        if: inputs.darwin_reader == 'sparsebundle' && inputs.darwin_cache_key != ''
        with:
          path: ${{ runner.temp }}/darwin-lifecycle/compacted/nix-root.sparsebundle
          key: ${{ inputs.darwin_cache_key }}
          fail-on-cache-miss: true
      - name: Require exact Darwin fixture
        if: inputs.darwin_reader == 'sparsebundle' && inputs.darwin_cache_key != ''
        env:
          EXACT_HIT: ${{ steps.frozen-darwin.outputs.cache-hit }}
        run: test "$EXACT_HIT" = true

      - name: Authenticate and preload the pinned hot pack
        if: inputs.darwin_reader == 'release-hot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/darwin-reader-evidence"
          payload="$RUNNER_TEMP/darwin-reader-payload"
          gh api "repos/$GITHUB_REPOSITORY/releases/$DARWIN_HOT_RELEASE_ID" > "$payload/hot-release.json"
          jq -e --argjson id "$DARWIN_HOT_RELEASE_ID" \
            '.id == $id and .draft == false and (.assets | length == 2)' "$payload/hot-release.json"
          manifest_url="$(jq -er --arg digest "sha256:$DARWIN_HOT_MANIFEST_SHA" '
            [.assets[] | select(.name == "hot-manifest.json" and .digest == $digest)]
            | select(length == 1) | .[0].browser_download_url
          ' "$payload/hot-release.json")"
          curl --fail --silent --show-error --location "$manifest_url" --output "$evidence/hot-manifest.json"
          test "$(shasum -a 256 "$evidence/hot-manifest.json" | awk '{print $1}')" = \
            "$DARWIN_HOT_MANIFEST_SHA"
          jq -e --argjson release "$DARWIN_HOT_RELEASE_ID" --argjson source "$DARWIN_BASE_RELEASE_ID" \
            --arg sourceManifest "$DARWIN_BASE_MANIFEST_SHA" --arg image "$DARWIN_BASE_IMAGE_SHA" '
              .schema == "darwin-hot-pack-release-v1" and .releaseId == $release
              and .sourceReleaseId == $source and .sourceManifestSha256 == $sourceManifest
              and .imageSha256 == $image and .blockSize == 65536
              and (.blockCount | type == "number" and . > 0)
              and (.payloadBytes | type == "number" and . > 0 and . <= 536870912)
              and (.hotPackAssetId | type == "number" and . > 0)
              and (.hotPackBytes | type == "number" and . > 0 and . <= 536870912)
              and (.hotPackSha256 | test("^[0-9a-f]{64}$"))
              and (.profileRunId | type == "number" and . > 0)
              and (.profileArtifactId | type == "number" and . > 0)
              and (.profileArtifactDigest | test("^sha256:[0-9a-f]{64}$"))
              and (.profileHeadSha | test("^[0-9a-f]{40}$"))
              and (.profileSha256 | test("^[0-9a-f]{64}$"))
              and (.producerHeadSha | test("^[0-9a-f]{40}$"))
            ' "$evidence/hot-manifest.json"
          hot_asset_id="$(jq -r .hotPackAssetId "$evidence/hot-manifest.json")"
          hot_url="$(jq -er --argjson id "$hot_asset_id" \
            --arg sha "$(jq -r .hotPackSha256 "$evidence/hot-manifest.json")" \
            --argjson size "$(jq -r .hotPackBytes "$evidence/hot-manifest.json")" '
              [.assets[] | select(.id == $id and .name == "hot.bin" and .size == $size
                and .digest == ("sha256:" + $sha))]
              | select(length == 1) | .[0].browser_download_url
            ' "$payload/hot-release.json")"
          curl --fail --silent --show-error --location "$hot_url" --output "$payload/hot.bin"
          test "$(stat -f '%z' "$payload/hot.bin")" = "$(jq -r .hotPackBytes "$evidence/hot-manifest.json")"
          test "$(shasum -a 256 "$payload/hot.bin" | awk '{print $1}')" = \
            "$(jq -r .hotPackSha256 "$evidence/hot-manifest.json")"
          python3 .github/scripts/darwin-release-image.py serve \
            --repo "$GITHUB_REPOSITORY" --release-id "$DARWIN_BASE_RELEASE_ID" \
            --manifest-sha "$DARWIN_BASE_MANIFEST_SHA" \
            --directory "$payload/block-cache" --hot-pack "$payload/hot.bin" \
            --ready "$payload/url.txt" --log "$evidence/lazy/requests.jsonl" \
            > "$payload/summary.json" 2> "$evidence/lazy/server.stderr" &
          server_pid=$!
          echo "DARWIN_RELEASE_SERVER_PID=$server_pid" >> "$GITHUB_ENV"
          for _ in {1..600}; do
            [ -s "$payload/url.txt" ] && break
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 0.1
          done
          test -s "$payload/url.txt"
          image_url="$(cat "$payload/url.txt")"
          [[ "$image_url" =~ ^http://127\.0\.0\.1:[0-9]+/image$ ]]
          echo "DARWIN_RELEASE_IMAGE_URL=$image_url" >> "$GITHUB_ENV"

      - name: Finish reader retrieval
        run: |
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/darwin-reader-evidence/restore-end.txt"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/darwin-reader-evidence/mount-start.txt"

      - name: Mount sparsebundle Nix root
        if: inputs.darwin_reader == 'sparsebundle'
        uses: ./.github/actions/nix-sparsebundle-mount
        with:
          image-size: ${{ env.NIX_ROOT_IMAGE_SIZE }}
          system: ${{ env.NIX_ROOT_SYSTEM }}

      - name: Mount the hot Release image
        if: inputs.darwin_reader == 'release-hot'
        run: |
          set -euo pipefail
          shadow="$RUNNER_TEMP/darwin-reader-payload/image.shadow"
          test ! -e "$shadow"
          sudo touch /etc/synthetic.conf
          if grep -qE '^nix($|[[:space:]])' /etc/synthetic.conf; then
            grep -qx nix /etc/synthetic.conf
          else
            echo nix | sudo tee -a /etc/synthetic.conf >/dev/null
          fi
          if ! sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -B >/dev/null 2>&1; then
            sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -t >/dev/null 2>&1 || true
          fi
          test -d /nix
          test ! -L /nix
          perl -e 'alarm shift; exec @ARGV' 600 sudo hdiutil attach "$DARWIN_RELEASE_IMAGE_URL" \
            -shadow "$shadow" -mountpoint /nix -nobrowse -noautoopen -owners on -noautofsck \
            > "$RUNNER_TEMP/darwin-reader-payload/attach.stdout" \
            2> "$RUNNER_TEMP/darwin-reader-payload/attach.stderr"
          sudo chown "$USER" /nix
          chmod u+rwx /nix

      - name: Finish Darwin reader mount
        env:
          DARWIN_READER: ${{ inputs.darwin_reader }}
          CACHE_KEY: ${{ inputs.darwin_cache_key }}
        run: |
          set -euo pipefail
          if [ "$DARWIN_READER" = release-hot ] || [ "$CACHE_KEY" = "$DARWIN_CONTROL_CACHE_KEY" ]; then
            nfb=/nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build
            test "$(readlink "$nfb")" = "$DARWIN_EXPECTED_NFB"
            test -x "$nfb/bin/nix-fast-build"
            "$nfb/bin/nix-fast-build" --help >/dev/null
          fi
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/darwin-reader-evidence/mount-end.txt"

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build Darwin configurations
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/darwin-reader-evidence/build-start.txt"
          df -h

          nix_fast_build_prepare_started="$SECONDS"
          cached_nix_fast_build="/nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build"
          nix_fast_build=()
          if [ -d "$cached_nix_fast_build" ]; then
            cached_nix_fast_build="$(cd -P "$cached_nix_fast_build" && pwd)/bin/nix-fast-build"
            if [ -x "$cached_nix_fast_build" ] && "$cached_nix_fast_build" --help >/dev/null; then
              nix_fast_build=("$cached_nix_fast_build")
              echo "NIX_FAST_BUILD_SOURCE source=cache-root path=$cached_nix_fast_build"
            fi
          fi
          if [ "${#nix_fast_build[@]}" -eq 0 ]; then
            nix_fast_build_store_path="$(
              nix build \
                --no-link \
                --print-out-paths \
                .#packages.aarch64-darwin.nix-fast-build
            )"
            nix_fast_build=("$nix_fast_build_store_path/bin/nix-fast-build")
            echo "NIX_FAST_BUILD_SOURCE source=nix-build path=${nix_fast_build[0]}"

            nix_eval_jobs_store_path="$(
              nix build \
                --inputs-from . \
                --no-link \
                --print-out-paths \
                nixpkgs-unstable#nix-eval-jobs
            )"
            migration_started="$SECONDS"
            set +e
            perl -e 'alarm shift; exec @ARGV' \
              60 \
              "$nix_eval_jobs_store_path/bin/nix-eval-jobs" \
              --workers 1 \
              --expr '{}' \
              >/dev/null
            migration_status="$?"
            set -e
            if [ "$migration_status" -ne 0 ]; then
              echo "::error ::Nix store migration preflight failed with status $migration_status."
              lsof -F pcfn /nix/var/nix/db/big-lock || true
              exit "$migration_status"
            fi
            echo "NIX_STORE_MIGRATION_PREFLIGHT_COMPLETE durationSeconds=$((SECONDS - migration_started))"
          fi
          echo "NIX_FAST_BUILD_PREPARE_COMPLETE durationSeconds=$((SECONDS - nix_fast_build_prepare_started))"

          python3 .github/scripts/nix_fast_build.py --publish-checks -- \
            "${nix_fast_build[@]}" \
            --flake .#ci.darwin \
            --systems aarch64-darwin \
            --eval-workers 1 \
            --cachix-cache whitestrake \
            --retries 2 \
            --result-file "$RUNNER_TEMP/ci-darwin-results.json" \
            -j 50

      - name: Publish Darwin records
        id: records
        shell: bash
        run: |
          set -euo pipefail

          records="$(jq -ce -f .github/scripts/nix-fast-build-records.jq "$RUNNER_TEMP/ci-darwin-results.json")"
          printf 'records=%s\n' "$records" >> "$GITHUB_OUTPUT"
          jq -r '.[].storePath' <<< "$records" | while IFS= read -r store_path; do
            nix path-info --store https://whitestrake.cachix.org "$store_path" >/dev/null
          done
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/darwin-reader-evidence/build-end.txt"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/darwin-reader-evidence/completion-end.txt"

      - name: Detach the Darwin reader and stop the helper
        if: always()
        env:
          DARWIN_READER: ${{ inputs.darwin_reader }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/darwin-reader-evidence"
          payload="$RUNNER_TEMP/darwin-reader-payload"
          if mount | grep -Fq ' on /nix '; then
            if ! perl -e 'alarm shift; exec @ARGV' 120 sudo hdiutil detach /nix; then
              perl -e 'alarm shift; exec @ARGV' 120 sudo hdiutil detach -force /nix
            fi
          fi
          if [ "$DARWIN_READER" = release-hot ]; then
            if [ -n "${DARWIN_RELEASE_SERVER_PID:-}" ]; then
              if kill -0 "$DARWIN_RELEASE_SERVER_PID" 2>/dev/null; then
                kill -TERM "$DARWIN_RELEASE_SERVER_PID"
                for _ in {1..100}; do
                  kill -0 "$DARWIN_RELEASE_SERVER_PID" 2>/dev/null || break
                  sleep 0.1
                done
              fi
              if kill -0 "$DARWIN_RELEASE_SERVER_PID" 2>/dev/null; then exit 1; fi
              if [ -f "$evidence/completion-end.txt" ]; then
                test -s "$payload/summary.json"
                jq -e --argjson release "$DARWIN_BASE_RELEASE_ID" \
                  --arg manifest "$DARWIN_BASE_MANIFEST_SHA" --arg image "$DARWIN_BASE_IMAGE_SHA" \
                  --arg hot "$(jq -r .hotPackSha256 "$evidence/hot-manifest.json")" \
                  --argjson blocks "$(jq -r .blockCount "$evidence/hot-manifest.json")" \
                  --argjson bytes "$(jq -r .payloadBytes "$evidence/hot-manifest.json")" '
                    .releaseId == $release and .manifestSha256 == $manifest and .imageSha256 == $image
                    and .hotPackSha256 == $hot and .hotPackBlocks == $blocks and .hotPackBytes == $bytes
                    and (.requestCount | type == "number" and . >= 0)
                    and (.responseBytes | type == "number" and . >= 0)
                    and (.uniqueResponseBytes | type == "number" and . >= 0)
                    and (.interfaceBytes | type == "number" and . > 0)
                    and (.interfaceRequests | type == "number" and . > 0)
                    and (.interfaceRangeRequests | type == "number" and . > 0)
                  ' "$payload/summary.json"
              fi
              if [ -s "$payload/summary.json" ]; then
                jq 'del(.url)' "$payload/summary.json" > "$evidence/lazy/summary.json"
              fi
            elif [ -f "$evidence/completion-end.txt" ]; then
              exit 1
            fi
          fi

      - name: Record Darwin reader evidence
        if: always()
        env:
          DARWIN_READER: ${{ inputs.darwin_reader }}
          CACHE_KEY: ${{ inputs.darwin_cache_key }}
        run: |
          evidence="$RUNNER_TEMP/darwin-reader-evidence"
          duration() { awk 'NR == FNR {start=$1; next} {print $1-start}' "$1" "$2"; }
          if [ -f "$evidence/completion-end.txt" ]; then
            jq -n \
              --argjson completeSeconds "$(duration "$evidence/setup-start.txt" "$evidence/completion-end.txt")" \
              --argjson restoreSeconds "$(duration "$evidence/restore-start.txt" "$evidence/restore-end.txt")" \
              --argjson mountSeconds "$(duration "$evidence/mount-start.txt" "$evidence/mount-end.txt")" \
              --argjson buildOutputSeconds "$(duration "$evidence/build-start.txt" "$evidence/build-end.txt")" \
              '{completeSeconds:$completeSeconds,restoreSeconds:$restoreSeconds,mountSeconds:$mountSeconds,buildOutputSeconds:$buildOutputSeconds}' \
              > "$evidence/stage-costs.json"
          fi
          jq -n --arg reader "$DARWIN_READER" --arg cacheKey "$CACHE_KEY" \
            --arg harness "$GITHUB_SHA" --arg runnerImage "${ImageVersion:-unknown}" \
            --arg cpu "$(sysctl -n machdep.cpu.brand_string)" \
            --arg baseRelease "$DARWIN_BASE_RELEASE_ID" --arg baseManifest "$DARWIN_BASE_MANIFEST_SHA" \
            --arg hotRelease "$DARWIN_HOT_RELEASE_ID" --arg hotManifest "$DARWIN_HOT_MANIFEST_SHA" '
              {reader:$reader,cacheKey:$cacheKey,harness:$harness,runnerImage:$runnerImage,cpu:$cpu,
               verification:"default",
               autofsckPolicy:(if $reader == "release-hot" then "disabled-after-pinned-fsck-gate" else "default" end),
               freshShadow:($reader == "release-hot"),actionsCacheWrites:false,
               baseReleaseId:(if $reader == "release-hot" then $baseRelease else null end),
               baseManifestSha256:(if $reader == "release-hot" then $baseManifest else null end),
               hotReleaseId:(if $reader == "release-hot" then $hotRelease else null end),
               hotManifestSha256:(if $reader == "release-hot" then $hotManifest else null end),
               primaryEndpoint:"before reader selection and transport retrieval through successful Darwin output publication"}' \
            > "$evidence/environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-reader-evidence
          path: ${{ runner.temp }}/darwin-reader-evidence

  all-builds:
    name: "All Builds"
    needs:
      - linux-builds
      - darwin-builds
      - source-checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      proof-path: ${{ steps.proof.outputs.proof-path }}
    permissions:
      contents: read
    steps:
      - name: Require successful platform builds
        env:
          LINUX_RESULT: ${{ needs.linux-builds.result }}
          DARWIN_RESULT: ${{ needs.darwin-builds.result }}
          CHECKS_RESULT: ${{ needs.source-checks.result }}
        run: |
          if [ "$LINUX_RESULT" != success ] || [ "$DARWIN_RESULT" != success ] || [ "$CHECKS_RESULT" != success ]; then
            echo "::error ::All builds and source checks must succeed: linux=$LINUX_RESULT darwin=$DARWIN_RESULT checks=$CHECKS_RESULT"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Assemble build manifest
        id: manifest
        shell: bash
        env:
          LINUX_RECORDS: ${{ needs.linux-builds.outputs.records }}
          DARWIN_RECORDS: ${{ needs.darwin-builds.outputs.records }}
        run: |
          set -euo pipefail

          if [ -z "$LINUX_RECORDS" ] || [ -z "$DARWIN_RECORDS" ]; then
            echo "::error ::Linux and Darwin build records must both be present."
            exit 1
          fi

          records="$(
            jq -cne \
              --argjson linux "$LINUX_RECORDS" \
              --argjson darwin "$DARWIN_RECORDS" \
              'if ($linux | type) != "array" or ($darwin | type) != "array" then
                 error("Linux and Darwin build records must be arrays")
               elif ($linux | length) == 0 or ($darwin | length) == 0 then
                 error("Linux and Darwin build records must be non-empty")
               else
                 $linux + $darwin
               end'
          )"

          if ! jq -e '
            type == "array"
            and length > 0
            and all(.[]; (
              type == "object"
              and (.attr | type == "string" and test("^(nixosConfigurations|darwinConfigurations)\\.[A-Za-z0-9_-]+$"))
              and (.kind | type == "string" and length > 0)
              and (.name | type == "string" and test("^[A-Za-z0-9_-]+$"))
              and (.storePath | type == "string" and test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$"))
            ))
          ' <<< "$records" >/dev/null; then
            echo "::error ::Nix Fast Build produced malformed configuration records."
            exit 1
          fi

          artifact_metadata_dir="$RUNNER_TEMP/ci-artifact-metadata"
          mkdir -p "$artifact_metadata_dir"
          artifact_pids=()
          while IFS=$'\t' read -r index kind name store_path; do
            (
              set -euo pipefail

              cache_store="https://whitestrake.cachix.org"
              system="$(nix store cat --store "$cache_store" "$store_path/system")"
              rollback_script=""
              if [ "$kind" = "nixosConfiguration" ]; then
                dependencies="$(nix store cat --store "$cache_store" "$store_path/extra-dependencies")"
                rollback_matches="$(
                  jq -cn \
                    --arg dependencies "$dependencies" \
                    --arg name "$name" \
                    '[
                      $dependencies
                      | scan("/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+")
                      | select(endswith("-deploy-health-rollback-script-" + $name))
                    ]'
                )"
                nondeployable_matches="$(
                  jq -cn \
                    --arg dependencies "$dependencies" \
                    --arg name "$name" \
                    '[
                      $dependencies
                      | scan("/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+")
                      | select(endswith("-cachix-nondeployable-" + $name))
                    ]'
                )"
                rollback_count="$(jq -r 'length' <<< "$rollback_matches")"
                nondeployable_count="$(jq -r 'length' <<< "$nondeployable_matches")"
                marker_count=$((rollback_count + nondeployable_count))
                if [ "$rollback_count" -gt 1 ] || [ "$nondeployable_count" -gt 1 ] || [ "$marker_count" -ne 1 ]; then
                  echo "::error ::Expected exactly one deployability marker for $name (one rollback script or one nondeployable sentinel)."
                  exit 1
                elif [ "$rollback_count" = 1 ]; then
                  rollback_script="$(jq -r '.[0]' <<< "$rollback_matches")"
                fi
              fi

              jq -cn \
                --argjson index "$index" \
                --arg system "$system" \
                --arg rollbackScript "$rollback_script" \
                '{
                  index: $index,
                  system: $system
                } + if $rollbackScript == "" then {} else {rollbackScript: $rollbackScript} end' \
                > "$artifact_metadata_dir/$index.json"
            ) &
            artifact_pids+=("$!")
          done < <(
            jq -r 'to_entries[] | [.key, .value.kind, .value.name, .value.storePath] | @tsv' <<< "$records"
          )

          artifact_status=0
          for artifact_pid in "${artifact_pids[@]}"; do
            if ! wait "$artifact_pid"; then
              artifact_status=1
            fi
          done
          if [ "$artifact_status" -ne 0 ]; then
            echo "::error ::Failed to read one or more CI artefacts from Cachix."
            exit 1
          fi

          artifact_metadata="$(jq -sc '.' "$artifact_metadata_dir"/*.json)"
          jq -cne \
            --argjson records "$records" \
            --argjson metadata "$artifact_metadata" '
              ($records | to_entries) as $entries
              | if ($metadata | length) != ($entries | length) then
                  error("Cachix artefact metadata count does not match build records")
                elif (($metadata | map(.index) | sort) != [range(0; ($entries | length))]) then
                  error("Cachix artefact metadata indexes are not unique and complete")
                elif any($metadata[]; (
                  type != "object"
                  or (.index | type != "number")
                  or (.system | type != "string")
                  or (has("rollbackScript") and (.rollbackScript | type != "string"))
                )) then
                  error("invalid Cachix artefact metadata")
                else
                  $entries
                  | map(
                      . as $entry
                      | ($metadata[] | select(.index == $entry.key)) as $metadata_entry
                      | $entry.value
                        + {system: $metadata_entry.system}
                        + (if ($metadata_entry.rollbackScript // "") == ""
                           then {}
                           else {rollbackScript: $metadata_entry.rollbackScript}
                           end)
                    )
                end
              | sort_by(.system, .attr) as $records
              | ($records
                  | map(select(.system != "aarch64-darwin" and .system != "aarch64-linux" and .system != "x86_64-linux") | .system)
                  | unique) as $unknown_systems
              | ($records | group_by(.attr) | map(select(length > 1) | .[0].attr)) as $duplicate_attrs
              | ($records | group_by(.name) | map(select(length > 1) | .[0].name)) as $duplicate_names
              | if ($unknown_systems | length) > 0 then
                  error("unknown CI systems: \($unknown_systems | join(", "))")
                elif ($duplicate_attrs | length) > 0 then
                  error("duplicate CI attributes: \($duplicate_attrs | join(", "))")
                elif ($duplicate_names | length) > 0 then
                  error("duplicate CI configuration names: \($duplicate_names | join(", "))")
                elif (["aarch64-darwin", "aarch64-linux", "x86_64-linux"] - ($records | map(.system) | unique) | length) > 0 then
                  error("CI records do not cover all systems")
                elif any($records[]; (
                  (.attr | type != "string" or test("^(nixosConfigurations|darwinConfigurations)\\.[A-Za-z0-9_-]+$") | not)
                  or (.kind | type != "string" or length == 0)
                  or (.name | type != "string" or test("^[A-Za-z0-9_-]+$") | not)
                  or (.system | type != "string" or (. == "aarch64-darwin" or . == "aarch64-linux" or . == "x86_64-linux") | not)
                  or (.storePath | type != "string" or test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$") | not)
                  or (has("rollbackScript") and (
                    . as $record
                    | $record.kind != "nixosConfiguration"
                      or ($record.rollbackScript | type != "string" or test("^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$") | not)
                      or ($record.rollbackScript | endswith("-deploy-health-rollback-script-" + $record.name) | not)
                  ))
                )) then
                  error("invalid CI build record")
                elif any($records[]; (
                  (.attr | split(".")) as $parts
                  | .name != $parts[1]
                    or .kind != (if $parts[0] == "nixosConfigurations" then "nixosConfiguration" else "darwinConfiguration" end)
                )) then
                  error("CI build record identity does not match its attribute")
                else
                  $records
                end
            ' > "$RUNNER_TEMP/ci-enriched-records.json"

      - name: Probe native cache publication after manifest failure
        if: failure() && inputs.profile && steps.manifest.outcome == 'failure'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          printf 'PR 158 publication probe, run %s attempt %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/cache-publication-probe.txt"
          probe_path="$(nix store add --mode flat --name cache-publication-probe.txt "$RUNNER_TEMP/cache-publication-probe.txt")"
          cachix push whitestrake "$probe_path"
          nix path-info --store https://whitestrake.cachix.org "$probe_path"

      - name: Validate and publish complete build proof
        id: proof
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source modules/deployment/scripts/cachix-pin-functions.sh

          records="$(jq -ce '.' "$RUNNER_TEMP/ci-enriched-records.json")"
          test "$(jq length <<< "$records")" -eq 11
          proof_file="$RUNNER_TEMP/ci-build-proof.json"
          proof_canonical_file="$RUNNER_TEMP/ci-build-proof.canonical.json"
          jq -cn \
            --arg revision "$GITHUB_SHA" \
            --argjson records "$records" \
            '{
              revision: $revision,
              records: ($records | map({attr, system, storePath}))
            }' > "$proof_file"
          jq -ceS -f .github/scripts/ci-build-proof.jq "$proof_file" > "$proof_canonical_file"
          mv "$proof_canonical_file" "$proof_file"
          proof_path="$(nix store add --mode flat --name ci-build-proof.json "$proof_file")"
          cachix push whitestrake "$proof_path"
          [[ "$proof_path" =~ ^/nix/store/[0-9a-z]{32}-ci-build-proof\.json$ ]]
          nix path-info --store https://whitestrake.cachix.org "$proof_path" >/dev/null
          mapfile -t recorded_paths < <(jq -r '.[].storePath' <<< "$records")
          nix path-info --store https://whitestrake.cachix.org "${recorded_paths[@]}" >/dev/null
          echo "$proof_path" > "$RUNNER_TEMP/ci-build-proof-path.txt"
          echo "proof-path=$proof_path" >> "$GITHUB_OUTPUT"
          echo "Published durable CI build proof: $proof_path"
          {
            echo "### Durable CI build proof"
            echo
            echo "Revision: \`$GITHUB_SHA\`"
            echo
            echo "Store path: \`$proof_path\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-build-proof
          path: |
            ${{ runner.temp }}/ci-build-proof.json
            ${{ runner.temp }}/ci-build-proof-path.txt
            ${{ runner.temp }}/ci-enriched-records.json
