name: Native Evaluator Seed Probe
on:
  workflow_dispatch:
    inputs:
      predecessor_run:
        description: Retain NFB from this native seed while updating locked inputs
        type: string
        default: ''
      parallel_evaluator:
        description: Include pinned Determinate Nix for matched evaluator experiments
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      EVALUATOR_SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate predecessor
        env:
          PREDECESSOR: ${{ inputs.predecessor_run }}
        run: '[[ -z "$PREDECESSOR" || "$PREDECESSOR" =~ ^[0-9]+$ ]]'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: predecessor
        if: inputs.predecessor_run != ''
        with:
          path: ${{ runner.temp }}/fast-ci-erofs
          key: fast-ci-native-seed-v1-${{ inputs.predecessor_run }}-${{ matrix.system }}
          fail-on-cache-miss: true
      - name: Mount predecessor seed
        if: inputs.predecessor_run != ''
        env:
          EXACT_HIT: ${{ steps.predecessor.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$EXACT_HIT" = true
          test ! -e /nix
          mv "$RUNNER_TEMP/fast-ci-erofs" "$RUNNER_TEMP/predecessor"
          cd "$RUNNER_TEMP/predecessor"
          sha256sum --check image.sha256
          sudo modprobe erofs
          sudo modprobe overlay
          mkdir -p "$RUNNER_TEMP/lower" "$RUNNER_TEMP/upper" "$RUNNER_TEMP/work"
          sudo mkdir /nix
          sudo mount -t erofs -o loop,ro image "$RUNNER_TEMP/lower"
          sudo mount -t overlay overlay -o "lowerdir=$RUNNER_TEMP/lower,upperdir=$RUNNER_TEMP/upper,workdir=$RUNNER_TEMP/work" /nix
          "$(cat nfb-path.txt)/bin/nix-fast-build" --help >/dev/null
      - uses: ./.github/actions/install-nix
      - name: Prepare equivalent native evaluator roots
        env:
          PARALLEL_EVALUATOR: ${{ inputs.parallel_evaluator }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/fast-ci-erofs"
          root=/nix/var/nix/gcroots/native-evaluator-seed
          mkdir -p "$output" "$root"
          find "$root" -mindepth 1 -maxdepth 1 -type l -delete
          nix flake archive --json path:. > "$output/archive.json"
          jq -r '[.inputs | .. | objects | .path? // empty] | unique[]' "$output/archive.json" > "$output/input-paths.txt"
          while IFS= read -r input; do
            ln -s "$input" "$root/$(basename "$input")"
          done < "$output/input-paths.txt"
          if [ -f "$RUNNER_TEMP/predecessor/nfb-path.txt" ]; then
            nfb="$(cat "$RUNNER_TEMP/predecessor/nfb-path.txt")"
          else
            nfb="$(nix build --no-link --print-out-paths ".#packages.$EVALUATOR_SYSTEM.nix-fast-build")"
          fi
          ln -sfn "$nfb" "$root/nfb"
          "$nfb/bin/nix-fast-build" --help >/dev/null
          printf '%s\n' "$nfb" > "$output/nfb-path.txt"
          nix --version > "$output/nix-version.txt"
          nix path-info --recursive --json "$nfb" > "$output/nfb-closure.json"
          if [ "$PARALLEL_EVALUATOR" = true ]; then
            determinate="$(nix build --no-link --print-out-paths --max-jobs 0 \
              --option extra-substituters https://install.determinate.systems \
              --option extra-trusted-public-keys 'cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM=' \
              "github:DeterminateSystems/nix-src/3ed5caa3bbde51ab87977c8a80e27c6ed0ea8534#packages.$EVALUATOR_SYSTEM.nix")"
            ln -s "$determinate" "$root/determinate"
            printf '%s\n' "$determinate" > "$output/determinate-path.txt"
            "$determinate/bin/nix" --version > "$output/determinate-version.txt"
            nix path-info --recursive --json "$determinate" > "$output/determinate-closure.json"
          fi
          nix store gc
          nix path-info --all | sort > "$output/store-paths.txt"
          python3 - <<'PY'
          import sqlite3
          with sqlite3.connect('/nix/var/nix/db/db.sqlite') as db:
              assert db.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone()[0] == 0
          PY
          # Freeze before acquiring the image packer so its closure is excluded.
          cp -a --reflink=auto /nix "$RUNNER_TEMP/seed-snapshot"
          packer="$(nix build --inputs-from . --no-link --print-out-paths 'nixpkgs-unstable#erofs-utils^out')"
          "$packer/bin/mkfs.erofs" --quiet --workers=1 -zzstd,level=3 -C65536 -Efragments,ztailpacking,dedupe "$output/image" "$RUNNER_TEMP/seed-snapshot"
          (cd "$output" && sha256sum image > image.sha256)
          lscpu --json > "$output/lscpu.json"
          jq -n --arg system "$EVALUATOR_SYSTEM" --arg harness "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --argjson bytes "$(stat -c %s "$output/image")" \
            '{system:$system,harness:$harness,run:$run,imageBytes:$bytes}' > "$output/environment.json"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/fast-ci-erofs
          key: fast-ci-native-seed-v1-${{ github.run_id }}-${{ matrix.system }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-seed-${{ matrix.system }}
          path: |
            ${{ runner.temp }}/fast-ci-erofs/*.json
            ${{ runner.temp }}/fast-ci-erofs/*.txt
            ${{ runner.temp }}/fast-ci-erofs/*.sha256
      - name: Unmount predecessor
        if: always() && inputs.predecessor_run != ''
        run: |
          if mountpoint -q /nix; then sudo umount /nix; fi
          if mountpoint -q "$RUNNER_TEMP/lower"; then sudo umount "$RUNNER_TEMP/lower"; fi
