name: Darwin Release Hot-pack Probe

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Matched pair only, or include changed-input and unprofiled-file pairs
        type: choice
        options: [matched, all]
        default: matched
      rounds:
        description: Number of repeated pairs per selected scenario
        type: choice
        options: ['1', '3']
        default: '1'
      sample_attach:
        description: Sample native image processes during one matched hot attach
        type: boolean
        default: false
      compare_autofsck:
        description: Compare default attach with -noautofsck using the existing hot pack
        type: boolean
        default: false
      source_hot_release:
        description: Existing immutable hot-pack release ID; requires source_hot_sha
        type: string
        default: ''
      source_hot_sha:
        description: Trusted SHA-256 of the existing hot-pack release manifest
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: darwin-hotpack-playground-${{ github.ref }}
  cancel-in-progress: false

env:
  FIXTURE_SHA: 33c5637ef5d9508786481530a5909a19c59d836f
  BASE_RELEASE_ID: '383622742'
  # Release tags use the frozen master snapshot; the manifest records the harness commit.
  RELEASE_TARGET_SHA: aed47803728f84ad1076f48223f143ecb3ccc012
  BASE_MANIFEST_SHA: 8406fdfb37a9c2bdfe98195cf1193a02470b1d84d3a1451c78e8248a8fc6d3aa
  AUTOFSCK_HOT_RELEASE_ID: '383632588'
  AUTOFSCK_HOT_MANIFEST_SHA: c686235f532bd450a1bf7968fcdd42bf4ff191fc43f2a5e9572ed88e0f499a0a
  PROFILE_RUN_ID: '34040695733'
  PROFILE_ARTIFACT_ID: '9991707035'
  PROFILE_ARTIFACT_NAME: darwin-release-reader-1-lazy
  PROFILE_ARTIFACT_DIGEST: sha256:2834d860dfe24f976e5a17c1ea6cfd98632e55c1fdb5e1a570098c16cb307fa8
  PROFILE_HEAD_SHA: 8d44ad4a341fb0188a6e857d0917568cffcff3f4
  CHANGED_DARWIN_NIXPKGS_REV: f6107e546a5012172d93e79f1f7950da02ad798f
  CHANGED_DARWIN_NIXPKGS_STORE_PATH: /nix/store/0vbncddzzi5lciw4zvcrw21gwdgjpk1y-source
  EXPECTED_MATCHED_RECORDS: '[{"attr":"darwinConfigurations.andred","kind":"darwinConfiguration","name":"andred","storePath":"/nix/store/3qm99r4kgpcwfrgn3j6xlscblfz04qr9-darwin-system-26.05.c3e90c8"}]'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.inputs.outputs.reuse }}
      release-id: ${{ steps.inputs.outputs.release-id }}
      manifest-sha: ${{ steps.inputs.outputs.manifest-sha }}
      matrix: ${{ steps.inputs.outputs.matrix }}
      rounds: ${{ steps.inputs.outputs.rounds }}
      scenarios: ${{ steps.inputs.outputs.scenarios }}
      compare-autofsck: ${{ steps.inputs.outputs.compare-autofsck }}
    steps:
      - name: Validate optional hot-pack generation
        id: inputs
        env:
          SOURCE_HOT_RELEASE: ${{ inputs.source_hot_release }}
          SOURCE_HOT_SHA: ${{ inputs.source_hot_sha }}
          ROUNDS: ${{ github.event_name == 'push' && '1' || inputs.rounds }}
          SCENARIOS: ${{ github.event_name == 'push' && 'matched' || inputs.scenarios }}
          SAMPLE_ATTACH: ${{ inputs.sample_attach }}
          COMPARE_AUTOFSCK: ${{ inputs.compare_autofsck }}
        run: |
          set -euo pipefail
          [[ "$ROUNDS" = 1 || "$ROUNDS" = 3 ]]
          [[ "$SCENARIOS" = matched || "$SCENARIOS" = all ]]
          if [ "$SAMPLE_ATTACH" = true ]; then
            [ "$ROUNDS" = 1 ]
            [ "$SCENARIOS" = matched ]
            [ -n "$SOURCE_HOT_RELEASE" ]
            [ -n "$SOURCE_HOT_SHA" ]
          fi
          if [ "$COMPARE_AUTOFSCK" = true ]; then
            [ "$SAMPLE_ATTACH" = false ]
            [ "$SCENARIOS" = matched ]
            [ "$SOURCE_HOT_RELEASE" = "$AUTOFSCK_HOT_RELEASE_ID" ]
            [ "$SOURCE_HOT_SHA" = "$AUTOFSCK_HOT_MANIFEST_SHA" ]
          fi
          definitions='[{"scenario":"matched","treatments":["cold","hot"]}]'
          if [ "$COMPARE_AUTOFSCK" = true ]; then
            definitions='[{"scenario":"matched","treatments":["default","noautofsck"]}]'
          elif [ "$SCENARIOS" = all ]; then
            definitions='[{"scenario":"matched","treatments":["cold","hot"]},{"scenario":"changed-input","treatments":["hot","cold"]},{"scenario":"unprofiled-file","treatments":["cold","hot"]}]'
          fi
          matrix="$(jq -cn --argjson rounds "$ROUNDS" --argjson definitions "$definitions" '
            [range(1; $rounds + 1) as $pair
             | $definitions[]
             | .scenario as $scenario
             | (if $pair % 2 == 0 then .treatments | reverse else .treatments end)[]
             | {pair:$pair, scenario:$scenario, treatment:.}]
          ')"
          {
            echo "matrix=$matrix"
            echo "rounds=$ROUNDS"
            echo "scenarios=$SCENARIOS"
            echo "compare-autofsck=$COMPARE_AUTOFSCK"
            if [ -z "$SOURCE_HOT_RELEASE" ] && [ -z "$SOURCE_HOT_SHA" ]; then
              echo 'reuse=false'
            else
              [[ "$SOURCE_HOT_RELEASE" =~ ^[1-9][0-9]*$ ]]
              [[ "$SOURCE_HOT_SHA" =~ ^[0-9a-f]{64}$ ]]
              echo 'reuse=true'
              echo "release-id=$SOURCE_HOT_RELEASE"
              echo "manifest-sha=$SOURCE_HOT_SHA"
            fi
          } >> "$GITHUB_OUTPUT"

  produce:
    needs: validate
    if: needs.validate.outputs.reuse == 'false'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    outputs:
      release-id: ${{ steps.publish.outputs.release-id }}
      manifest-sha: ${{ steps.publish.outputs.manifest-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Pin the E40 profile artefact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIXTURE_SHA"
          test "$(git -C .harness rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROFILE_RUN_ID/artifacts" > "$RUNNER_TEMP/profile-artifacts.json"
          jq -e --argjson id "$PROFILE_ARTIFACT_ID" --arg name "$PROFILE_ARTIFACT_NAME" \
            --arg digest "$PROFILE_ARTIFACT_DIGEST" --arg head "$PROFILE_HEAD_SHA" '
              [.artifacts[] | select(.id == $id)] | length == 1
              and .[0].name == $name and .[0].digest == $digest and .[0].expired == false
              and .[0].workflow_run.id == 34040695733 and .[0].workflow_run.head_sha == $head
            ' "$RUNNER_TEMP/profile-artifacts.json"
          mkdir -p "$RUNNER_TEMP/hotpack/evidence"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PROFILE_RUN_ID }}
          artifact-ids: ${{ env.PROFILE_ARTIFACT_ID }}
          path: ${{ runner.temp }}/hotpack/profile
      - name: Download and authenticate the frozen base image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/hotpack/profile/lazy/requests.jsonl"
          shasum -a 256 "$RUNNER_TEMP/hotpack/profile/lazy/requests.jsonl" \
            > "$RUNNER_TEMP/hotpack/evidence/profile.sha256"
          python3 .harness/.github/scripts/darwin-release-image.py eager \
            --repo "$GITHUB_REPOSITORY" --release-id "$BASE_RELEASE_ID" \
            --manifest-sha "$BASE_MANIFEST_SHA" --directory "$RUNNER_TEMP/hotpack/base" \
            > "$RUNNER_TEMP/hotpack/evidence/eager.json"
          jq -e --argjson release "$BASE_RELEASE_ID" --arg sha "$BASE_MANIFEST_SHA" '
            .releaseId == $release and .manifestSha256 == $sha
            and (.imageBytes | type == "number" and . > 0)
            and (.imageSha256 | test("^[0-9a-f]{64}$"))
            and (.responseBytes == .imageBytes) and (.uniqueResponseBytes == .imageBytes)
          ' "$RUNNER_TEMP/hotpack/evidence/eager.json"
      - name: Pack the E40 demand-read working set
        run: |
          set -euo pipefail
          python3 .harness/.github/scripts/darwin-release-image.py pack-hot \
            --image "$RUNNER_TEMP/hotpack/base/image.dmg" \
            --manifest "$RUNNER_TEMP/hotpack/base/manifest.json" \
            --profile "$RUNNER_TEMP/hotpack/profile/lazy/requests.jsonl" \
            --output "$RUNNER_TEMP/hotpack/hot.bin" \
            > "$RUNNER_TEMP/hotpack/evidence/pack-hot.json"
          jq -e '
            .schema == "darwin-hot-pack-v1" and .blockSize == 65536
            and (.blockCount | type == "number" and . > 0)
            and (.payloadBytes | type == "number" and . > 0 and . <= 536870912)
            and (.imageSha256 | test("^[0-9a-f]{64}$"))
            and (.hotPackSha256 | test("^[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/hotpack/evidence/pack-hot.json"
          test "$(shasum -a 256 "$RUNNER_TEMP/hotpack/hot.bin" | awk '{print $1}')" = \
            "$(jq -r .hotPackSha256 "$RUNNER_TEMP/hotpack/evidence/pack-hot.json")"
          test "$(stat -f '%z' "$RUNNER_TEMP/hotpack/hot.bin")" -le $((512 * 1024 * 1024))
      - name: Publish a separate immutable hot-pack release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hotpack"
          tag="darwin-hot-pack-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jq -n --arg tag "$tag" --arg target "$RELEASE_TARGET_SHA" \
            '{tag_name:$tag,target_commitish:$target,name:$tag,body:"Profile-guided Darwin Release hot pack for PR #158 research. Not selected for production CI.",draft:true,prerelease:false,make_latest:"false"}' \
            > "$root/release-request.json"
          gh api "repos/$GITHUB_REPOSITORY/releases" --method POST --input "$root/release-request.json" \
            > "$root/evidence/release-created.json"
          release_id="$(jq -r .id "$root/evidence/release-created.json")"
          test "$release_id" -gt 0
          gh release upload "$tag" "$root/hot.bin" --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$root/release-with-hot.json"
          hot_asset_id="$(jq -er --arg sha "$(jq -r .hotPackSha256 "$root/evidence/pack-hot.json")" '
            [.assets[] | select(.name == "hot.bin" and .digest == ("sha256:" + $sha))]
            | select(length == 1) | .[0].id
          ' "$root/release-with-hot.json")"
          hot_bytes="$(stat -f '%z' "$root/hot.bin")"
          profile_sha="$(awk '{print $1}' "$root/evidence/profile.sha256")"
          jq -nS --argjson releaseId "$release_id" --argjson sourceReleaseId "$BASE_RELEASE_ID" \
            --arg sourceManifestSha256 "$BASE_MANIFEST_SHA" \
            --arg imageSha256 "$(jq -r .imageSha256 "$root/evidence/pack-hot.json")" \
            --argjson blockSize "$(jq -r .blockSize "$root/evidence/pack-hot.json")" \
            --argjson blockCount "$(jq -r .blockCount "$root/evidence/pack-hot.json")" \
            --argjson payloadBytes "$(jq -r .payloadBytes "$root/evidence/pack-hot.json")" \
            --argjson hotPackAssetId "$hot_asset_id" --argjson hotPackBytes "$hot_bytes" \
            --arg hotPackSha256 "$(jq -r .hotPackSha256 "$root/evidence/pack-hot.json")" \
            --arg profileSha256 "$profile_sha" --argjson profileRunId "$PROFILE_RUN_ID" \
            --argjson profileArtifactId "$PROFILE_ARTIFACT_ID" --arg profileArtifactDigest "$PROFILE_ARTIFACT_DIGEST" \
            --arg profileHeadSha "$PROFILE_HEAD_SHA" --arg producerHeadSha "$GITHUB_SHA" \
            '{schema:"darwin-hot-pack-release-v1",releaseId:$releaseId,sourceReleaseId:$sourceReleaseId,sourceManifestSha256:$sourceManifestSha256,imageSha256:$imageSha256,blockSize:$blockSize,blockCount:$blockCount,payloadBytes:$payloadBytes,hotPackAssetId:$hotPackAssetId,hotPackBytes:$hotPackBytes,hotPackSha256:$hotPackSha256,profileSha256:$profileSha256,profileRunId:$profileRunId,profileArtifactId:$profileArtifactId,profileArtifactDigest:$profileArtifactDigest,profileHeadSha:$profileHeadSha,producerHeadSha:$producerHeadSha}' \
            > "$root/hot-manifest.json"
          manifest_sha="$(shasum -a 256 "$root/hot-manifest.json" | awk '{print $1}')"
          cp "$root/hot-manifest.json" "$root/evidence/hot-manifest.json"
          printf '%s  hot-manifest.json\n' "$manifest_sha" > "$root/evidence/hot-manifest.sha256"
          gh release upload "$tag" "$root/hot-manifest.json" --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$root/evidence/release-final.json"
          jq -e --arg hotDigest "sha256:$(jq -r .hotPackSha256 "$root/evidence/pack-hot.json")" \
            --arg manifestDigest "sha256:$manifest_sha" --argjson hotBytes "$hot_bytes" '
              .draft == true and .prerelease == false
              and (.assets | length == 2)
              and ([.assets[] | select(.name == "hot.bin" and .size == $hotBytes and .digest == $hotDigest)] | length == 1)
              and ([.assets[] | select(.name == "hot-manifest.json" and .digest == $manifestDigest)] | length == 1)
            ' "$root/evidence/release-final.json"
          jq -n '{draft:false,make_latest:"false"}' > "$root/release-publish.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --method PATCH \
            --input "$root/release-publish.json" > "$root/evidence/release-published.json"
          jq -e --argjson id "$release_id" '.id == $id and .draft == false' \
            "$root/evidence/release-published.json"
          {
            echo "release-id=$release_id"
            echo "manifest-sha=$manifest_sha"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-hotpack-producer
          path: ${{ runner.temp }}/hotpack/evidence

  filesystem-gate:
    needs: validate
    if: needs.validate.outputs.compare-autofsck == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Eagerly authenticate and check the frozen HFS+ image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-hotpack-filesystem-gate"
          mkdir -p "$root/base" "$root/evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/darwin-release-image.py eager \
            --repo "$GITHUB_REPOSITORY" --release-id "$BASE_RELEASE_ID" \
            --manifest-sha "$BASE_MANIFEST_SHA" --directory "$root/base" \
            > "$root/evidence/eager.json"
          jq -e --argjson release "$BASE_RELEASE_ID" --arg manifestSha "$BASE_MANIFEST_SHA" '
            .releaseId == $release and .manifestSha256 == $manifestSha
            and .responseBytes == .imageBytes and .uniqueResponseBytes == .imageBytes
            and (.imageSha256 | test("^[0-9a-f]{64}$"))
          ' "$root/evidence/eager.json"
          image="$root/base/image.dmg"
          expected_sha="$(jq -r .imageSha256 "$root/evidence/eager.json")"
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          before_sha="$(shasum -a 256 "$image" | awk '{print $1}')"
          test "$before_sha" = "$expected_sha"

          whole_device=
          cleanup() {
            if [ -n "$whole_device" ]; then
              perl -e 'alarm shift; exec @ARGV' 120 sudo hdiutil detach "$whole_device" \
                >> "$root/evidence/detach.stdout" 2>> "$root/evidence/detach.stderr" || true
            fi
          }
          trap cleanup EXIT
          perl -e 'alarm shift; exec @ARGV' 300 sudo hdiutil attach -readonly -nomount -noautofsck -plist "$image" \
            > "$root/evidence/attach.plist" 2> "$root/evidence/attach.stderr"
          plutil -convert json -o "$root/evidence/attach.json" "$root/evidence/attach.plist"
          whole_device="$(jq -er '
            [."system-entities"[] | select(."content-hint" == "GUID_partition_scheme") | ."dev-entry"]
            | select(length == 1) | .[0]
          ' "$root/evidence/attach.json")"
          hfs_device="$(jq -er '
            [."system-entities"[] | select(."content-hint" == "Apple_HFS") | ."dev-entry"]
            | select(length == 1) | .[0]
          ' "$root/evidence/attach.json")"
          [[ "$whole_device" =~ ^/dev/disk[0-9]+$ ]]
          [[ "$hfs_device" =~ ^/dev/disk[0-9]+s[0-9]+$ ]]
          fsck_status=0
          perl -e 'alarm shift; exec @ARGV' 900 sudo /sbin/fsck_hfs -fn "$hfs_device" \
            > "$root/evidence/fsck.stdout" 2> "$root/evidence/fsck.stderr" || fsck_status=$?
          printf '%s\n' "$fsck_status" > "$root/evidence/fsck.status"
          test "$fsck_status" -eq 0
          grep -Eiq 'appears to be OK\.?$' "$root/evidence/fsck.stdout"
          perl -e 'alarm shift; exec @ARGV' 120 sudo hdiutil detach "$whole_device" \
            > "$root/evidence/detach.stdout" 2> "$root/evidence/detach.stderr"
          whole_device=
          after_sha="$(shasum -a 256 "$image" | awk '{print $1}')"
          test "$after_sha" = "$before_sha"
          jq -n --arg before "$before_sha" --arg after "$after_sha" \
            --arg hfsDevice "$hfs_device" \
            '{filesystem:"case-sensitive-jhfs-plus",attachPolicy:"readonly-nomount-noautofsck",fsck:"fsck_hfs -fn",fsckStatus:0,imageSha256Before:$before,imageSha256After:$after,hfsDevice:$hfsDevice}' \
            > "$root/evidence/gate.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-hotpack-filesystem-gate
          path: ${{ runner.temp }}/darwin-hotpack-filesystem-gate/evidence

  reader:
    needs: [validate, produce, filesystem-gate]
    if: ${{ always() && needs.validate.result == 'success' && (needs.filesystem-gate.result == 'success' || needs.filesystem-gate.result == 'skipped') && (needs.produce.result == 'success' || (needs.produce.result == 'skipped' && needs.validate.outputs.reuse == 'true')) }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Start setup and select the pinned hot generation
        id: source
        env:
          CREATED_RELEASE: ${{ needs.produce.outputs.release-id }}
          CREATED_MANIFEST_SHA: ${{ needs.produce.outputs.manifest-sha }}
          REUSED_RELEASE: ${{ needs.validate.outputs.release-id }}
          REUSED_MANIFEST_SHA: ${{ needs.validate.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIXTURE_SHA"
          test "$(git -C .harness rev-parse HEAD)" = "$GITHUB_SHA"
          root="$RUNNER_TEMP/darwin-hotpack-reader"
          mkdir -p "$root/lazy" "$RUNNER_TEMP/darwin-hotpack-payload"
          python3 -c 'import time; print(time.time())' > "$root/setup-start.txt"
          release_id="${CREATED_RELEASE:-$REUSED_RELEASE}"
          manifest_sha="${CREATED_MANIFEST_SHA:-$REUSED_MANIFEST_SHA}"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "release-id=$release_id"
            echo "manifest-sha=$manifest_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Download and authenticate the hot pack
        if: matrix.treatment != 'cold'
        env:
          GH_TOKEN: ${{ github.token }}
          HOT_RELEASE_ID: ${{ steps.source.outputs.release-id }}
          HOT_MANIFEST_SHA: ${{ steps.source.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-hotpack-reader"
          payload="$RUNNER_TEMP/darwin-hotpack-payload"
          gh api "repos/$GITHUB_REPOSITORY/releases/$HOT_RELEASE_ID" > "$root/hot-release.json"
          jq -e --argjson id "$HOT_RELEASE_ID" '.id == $id and .draft == false and (.assets | length == 2)' \
            "$root/hot-release.json"
          manifest_url="$(jq -er --arg digest "sha256:$HOT_MANIFEST_SHA" '
            [.assets[] | select(.name == "hot-manifest.json" and .digest == $digest)]
            | select(length == 1) | .[0].browser_download_url
          ' "$root/hot-release.json")"
          curl --fail --silent --show-error --location "$manifest_url" --output "$root/hot-manifest.json"
          test "$(shasum -a 256 "$root/hot-manifest.json" | awk '{print $1}')" = "$HOT_MANIFEST_SHA"
          jq -e --argjson release "$HOT_RELEASE_ID" --argjson source "$BASE_RELEASE_ID" \
            --arg sourceSha "$BASE_MANIFEST_SHA" --arg profileDigest "$PROFILE_ARTIFACT_DIGEST" \
            --argjson profileRun "$PROFILE_RUN_ID" --argjson profileArtifact "$PROFILE_ARTIFACT_ID" \
            --arg profileHead "$PROFILE_HEAD_SHA" '
              .schema == "darwin-hot-pack-release-v1" and .releaseId == $release
              and .sourceReleaseId == $source and .sourceManifestSha256 == $sourceSha
              and .blockSize == 65536 and (.blockCount | type == "number" and . > 0)
              and (.payloadBytes | type == "number" and . > 0 and . <= 536870912)
              and (.hotPackAssetId | type == "number" and . > 0)
              and (.hotPackBytes | type == "number" and . > 0 and . <= 536870912)
              and (.hotPackSha256 | test("^[0-9a-f]{64}$"))
              and (.imageSha256 | test("^[0-9a-f]{64}$"))
              and .profileArtifactDigest == $profileDigest
              and .profileRunId == $profileRun and .profileArtifactId == $profileArtifact
              and .profileHeadSha == $profileHead and (.profileSha256 | test("^[0-9a-f]{64}$"))
            ' "$root/hot-manifest.json"
          hot_asset_id="$(jq -r .hotPackAssetId "$root/hot-manifest.json")"
          hot_url="$(jq -er --argjson id "$hot_asset_id" --arg sha "$(jq -r .hotPackSha256 "$root/hot-manifest.json")" \
            --argjson size "$(jq -r .hotPackBytes "$root/hot-manifest.json")" '
              [.assets[] | select(.id == $id and .name == "hot.bin" and .size == $size and .digest == ("sha256:" + $sha))]
              | select(length == 1) | .[0].browser_download_url
            ' "$root/hot-release.json")"
          curl --fail --silent --show-error --location "$hot_url" --output "$payload/hot.bin"
          test "$(stat -f '%z' "$payload/hot.bin")" = "$(jq -r .hotPackBytes "$root/hot-manifest.json")"
          test "$(shasum -a 256 "$payload/hot.bin" | awk '{print $1}')" = \
            "$(jq -r .hotPackSha256 "$root/hot-manifest.json")"
          echo "HOT_PACK=$payload/hot.bin" >> "$GITHUB_ENV"
      - name: Start the trusted base image reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-hotpack-reader/lazy"
          args=()
          if [ "${{ matrix.treatment }}" != cold ]; then
            args+=(--hot-pack "$HOT_PACK")
          fi
          python3 .harness/.github/scripts/darwin-release-image.py serve \
            --repo "$GITHUB_REPOSITORY" --release-id "$BASE_RELEASE_ID" \
            --manifest-sha "$BASE_MANIFEST_SHA" \
            --directory "$RUNNER_TEMP/darwin-hotpack-payload/block-cache" \
            --ready "$root/url.txt" --log "$root/requests.jsonl" \
            ${args[@]+"${args[@]}"} > "$root/summary.json" 2> "$root/server.stderr" &
          server_pid=$!
          echo "RELEASE_SERVER_PID=$server_pid" >> "$GITHUB_ENV"
          for _ in {1..600}; do
            [ -s "$root/url.txt" ] && break
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 0.1
          done
          test -s "$root/url.txt"
          image_url="$(cat "$root/url.txt")"
          [[ "$image_url" =~ ^http://127\.0\.0\.1:[0-9]+/image$ ]]
          echo "RELEASE_IMAGE_URL=$image_url" >> "$GITHUB_ENV"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/darwin-hotpack-reader/reader-ready.txt"
          python3 -c 'import time; print(time.monotonic_ns())' > "$RUNNER_TEMP/darwin-hotpack-reader/reader-ready-monotonic.txt"
      - name: Attach the image with default verification and a local shadow
        env:
          SAMPLE_ATTACH: ${{ inputs.sample_attach }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-hotpack-reader"
          sample_enabled=false
          if [ "$SAMPLE_ATTACH" = true ] && [ "${{ matrix.scenario }}" = matched ] && \
             [ "${{ matrix.treatment }}" = hot ]; then
            sample_enabled=true
          fi
          autofsck_args=()
          if [ "${{ matrix.treatment }}" = noautofsck ]; then
            autofsck_args+=(-noautofsck)
          fi
          python3 -c 'import time; print(time.time())' > "$root/mount-start.txt"
          python3 -c 'import time; print(time.monotonic_ns())' > "$root/mount-start-monotonic.txt"
          sudo touch /etc/synthetic.conf
          if grep -qE '^nix($|[[:space:]])' /etc/synthetic.conf; then
            grep -qx nix /etc/synthetic.conf
          else
            echo nix | sudo tee -a /etc/synthetic.conf >/dev/null
          fi
          if ! sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -B >/dev/null 2>&1; then
            sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -t >/dev/null 2>&1 || true
          fi
          test -d /nix
          test ! -L /nix
          if [ "$sample_enabled" = false ]; then
            perl -e 'alarm shift; exec @ARGV' 600 sudo hdiutil attach "$RELEASE_IMAGE_URL" \
              -shadow "$RUNNER_TEMP/darwin-hotpack-payload/image.shadow" \
              -mountpoint /nix -nobrowse -noautoopen -owners on \
              ${autofsck_args[@]+"${autofsck_args[@]}"} \
              > "$root/attach.stdout" 2> "$root/attach.stderr"
          else
            samples="$root/attach-samples"
            baseline="$RUNNER_TEMP/attach-sample-baseline"
            mkdir -p "$samples/seen" "$baseline"
            : > "$samples/processes.jsonl"
            for name in hdiutil diskimagesiod diskimages-helper fsck_hfs; do
              pgrep -x "$name" > "$baseline/$name.pids" || true
            done

            perl -e 'alarm shift; exec @ARGV' 600 sudo hdiutil attach "$RELEASE_IMAGE_URL" \
              -shadow "$RUNNER_TEMP/darwin-hotpack-payload/image.shadow" \
              -mountpoint /nix -nobrowse -noautoopen -owners on \
              ${autofsck_args[@]+"${autofsck_args[@]}"} \
              > "$root/attach.stdout" 2> "$root/attach.stderr" &
            attach_job=$!

            sample_process() {
              local name="$1" pid="$2" marker
              marker="$samples/seen/$name-$pid"
              [ -e "$marker" ] && return
              if [ "$name" != diskimagesiod ] && grep -qx "$pid" "$baseline/$name.pids"; then
                return
              fi
              touch "$marker"
              jq -cn --arg name "$name" --argjson pid "$pid" \
                '{name:$name,pid:$pid}' >> "$samples/processes.jsonl"
              (
                sample_status=0
                perl -e 'alarm shift; exec @ARGV' 35 sudo sample "$pid" 30 \
                  -file "$samples/$name-$pid.txt" \
                  > "$samples/$name-$pid.stdout" \
                  2> "$samples/$name-$pid.stderr" || sample_status=$?
                printf '%s\n' "$sample_status" > "$samples/$name-$pid.status"
              ) &
            }

            for _ in {1..120}; do
              for name in hdiutil diskimagesiod diskimages-helper fsck_hfs; do
                while IFS= read -r pid; do
                  [ -n "$pid" ] && sample_process "$name" "$pid"
                done < <(pgrep -x "$name" || true)
              done
              kill -0 "$attach_job" 2>/dev/null || break
              sleep 0.25
            done
            attach_status=0
            wait "$attach_job" || attach_status=$?
            wait || true
            printf '%s\n' "$attach_status" > "$samples/attach.status"
            if [ "$attach_status" -ne 0 ]; then
              exit "$attach_status"
            fi
            test -s "$samples/processes.jsonl"
            jq -se 'length > 0 and all(.[]; (.name == "hdiutil" or .name == "diskimagesiod" or .name == "diskimages-helper" or .name == "fsck_hfs") and (.pid | type == "number" and . > 0))' \
              "$samples/processes.jsonl"
            successful_sample=false
            for sample_file in "$samples"/*.txt; do
              [ -s "$sample_file" ] || continue
              if [ "$(cat "${sample_file%.txt}.status")" = 0 ] && \
                 grep -q '^Call graph:' "$sample_file"; then
                successful_sample=true
                break
              fi
            done
            [ "$successful_sample" = true ]
          fi
          sudo chown "$USER" /nix
          chmod u+rwx /nix
          python3 -c 'import time; print(time.time())' > "$root/mount-end.txt"
          python3 -c 'import time; print(time.monotonic_ns())' > "$root/mount-end-monotonic.txt"
      - uses: ./.harness/.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Exercise a real unprofiled store-file read
        if: matrix.scenario == 'unprofiled-file'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-hotpack-reader"
          python3 - <<'PY' > "$root/large-files.txt"
          import os
          candidates = []
          for directory, _, files in os.walk("/nix/store"):
              for name in files:
                  path = os.path.join(directory, name)
                  try:
                      if os.path.getsize(path) > 1024 * 1024:
                          candidates.append(path)
                  except OSError:
                      pass
          print(*sorted(candidates), sep="\n")
          PY
          found=false
          while IFS= read -r file; do
            test -n "$file" || continue
            before="$(jq -s '[.[] | select(.kind == 1 and .status == 206 and .valid == 1)] | length' "$root/lazy/requests.jsonl")"
            dd if="$file" of=/dev/null bs=1048576 count=1 2>/dev/null
            after="$(jq -s '[.[] | select(.kind == 1 and .status == 206 and .valid == 1)] | length' "$root/lazy/requests.jsonl")"
            if [ "$after" -gt "$before" ]; then
              jq -n --arg path "$file" --argjson before "$before" --argjson after "$after" \
                '{path:$path,backingRequestsBefore:$before,backingRequestsAfter:$after}' \
                > "$root/unprofiled-file.json"
              found=true
              break
            fi
          done < "$root/large-files.txt"
          test "$found" = true
      - name: Run the full Darwin workload
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-hotpack-reader"
          nfb=/nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build/bin/nix-fast-build
          test -x "$nfb"
          "$nfb" --help >/dev/null
          fixture_args=()
          if [ "$SCENARIO" = changed-input ]; then
            "$nfb" --help | grep -q -- '--override-input'
            baseline_rev="$(jq -r '.nodes[.nodes.root.inputs["nixpkgs-darwin"]].locked.rev' flake.lock)"
            test "$baseline_rev" != "$CHANGED_DARWIN_NIXPKGS_REV"
            test ! -e "$CHANGED_DARWIN_NIXPKGS_STORE_PATH"
            fixture_args=(--override-input nixpkgs-darwin "github:NixOS/nixpkgs/$CHANGED_DARWIN_NIXPKGS_REV")
          fi
          jq -n --arg scenario "$SCENARIO" --arg overrideInput "${fixture_args[*]-}" \
            '{scenario:$scenario,overrideInput:$overrideInput}' > "$root/workload.json"
          python3 -c 'import time; print(time.time())' > "$root/build-start.txt"
          python3 -c 'import time; print(time.monotonic_ns())' > "$root/build-start-monotonic.txt"
          python3 .harness/.github/scripts/fast-ci-measure.py "$root" -- \
            "$nfb" --flake .#ci.aarch64-darwin --systems aarch64-darwin --eval-workers 1 \
            --option builders '' --option max-jobs auto \
            ${fixture_args[@]+"${fixture_args[@]}"} \
            --cachix-cache whitestrake --retries 2 --result-file "$root/results.json" -j 50 --stream-json-lines
          jq -ce -f .harness/.github/scripts/nix-fast-build-records.jq "$root/results.json" > "$root/records.json"
          jq -e 'length > 0' "$root/records.json"
          if [ "$SCENARIO" != changed-input ]; then
            test "$(jq -c 'map({attr,kind,name,storePath}) | sort_by(.attr)' "$root/records.json")" = \
              "$(jq -c 'map({attr,kind,name,storePath}) | sort_by(.attr)' <<< "$EXPECTED_MATCHED_RECORDS")"
          fi
          jq -e 'any(.results[]; .type == "CACHIX" and .success == true)' "$root/results.json"
          jq -r '.[].storePath' "$root/records.json" | while IFS= read -r path; do
            nix path-info --store https://whitestrake.cachix.org "$path" >/dev/null
          done
          jq -cnS --arg revision "$FIXTURE_SHA" --arg scenario "$SCENARIO" \
            --arg override "${fixture_args[*]-}" --slurpfile records "$root/records.json" \
            '{revision:$revision,scenario:$scenario,override:$override,records:($records[0] | map({attr,storePath}))}' \
            > "$root/darwin-proof.json"
          proof_path="$(nix store add --mode flat --name "darwin-hotpack-$SCENARIO-proof.json" "$root/darwin-proof.json")"
          cachix push whitestrake "$proof_path"
          nix path-info --store https://whitestrake.cachix.org "$proof_path" >/dev/null
          echo "$proof_path" > "$root/proof-path.txt"
          python3 -c 'import time; print(time.time())' > "$root/completion-end.txt"
          python3 -c 'import time; print(time.monotonic_ns())' > "$root/completion-end-monotonic.txt"
      - name: Detach the image and stop the reader
        if: always()
        env:
          HOT_MANIFEST_SHA: ${{ steps.source.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          if mount | grep -Fq ' on /nix '; then
            perl -e 'alarm shift; exec @ARGV' 120 sudo hdiutil detach /nix
          fi
          test -n "${RELEASE_SERVER_PID:-}"
          kill -TERM "$RELEASE_SERVER_PID" 2>/dev/null
          for _ in {1..100}; do
            kill -0 "$RELEASE_SERVER_PID" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$RELEASE_SERVER_PID" 2>/dev/null; then exit 1; fi
          summary="$RUNNER_TEMP/darwin-hotpack-reader/lazy/summary.json"
          jq -e --argjson release "$BASE_RELEASE_ID" --arg sha "$BASE_MANIFEST_SHA" '
            .releaseId == $release and .manifestSha256 == $sha
            and (.requestCount | type == "number" and . >= 0)
            and (.responseBytes | type == "number" and . >= 0)
            and (.uniqueResponseBytes | type == "number" and . >= 0)
            and (.interfaceRangeRequests | type == "number" and . > 0)
          ' "$summary"
          if [ "${{ matrix.treatment }}" = cold ] || [ "${{ matrix.scenario }}" = unprofiled-file ]; then
            jq -e '.requestCount > 0 and .responseBytes > 0 and .uniqueResponseBytes > 0' "$summary"
          fi
          if [ "${{ matrix.treatment }}" != cold ]; then
            jq -e --arg sha "$(jq -r .hotPackSha256 "$RUNNER_TEMP/darwin-hotpack-reader/hot-manifest.json")" \
              --argjson blocks "$(jq -r .blockCount "$RUNNER_TEMP/darwin-hotpack-reader/hot-manifest.json")" \
              --argjson bytes "$(jq -r .payloadBytes "$RUNNER_TEMP/darwin-hotpack-reader/hot-manifest.json")" '
                .hotPackSha256 == $sha and .hotPackBlocks == $blocks and .hotPackBytes == $bytes
              ' "$summary"
          else
            jq -e 'has("hotPackSha256") | not' "$summary"
          fi
      - name: Record reader environment
        if: always()
        env:
          SAMPLE_ATTACH: ${{ inputs.sample_attach }}
        run: |
          root="$RUNNER_TEMP/darwin-hotpack-reader"
          sample_enabled=false
          if [ "$SAMPLE_ATTACH" = true ] && [ "${{ matrix.scenario }}" = matched ] && \
             [ "${{ matrix.treatment }}" = hot ]; then
            sample_enabled=true
          fi
          jq -n --argjson requested "$SAMPLE_ATTACH" --argjson enabled "$sample_enabled" \
            '{requested:$requested,enabled:$enabled,target:"matched hot attach",durationSeconds:30,processNames:["hdiutil","diskimagesiod","diskimages-helper","fsck_hfs"]}' \
            > "$root/attach-sampling.json"
          jq -n --arg scenario "${{ matrix.scenario }}" --arg treatment "${{ matrix.treatment }}" \
            --argjson pair "${{ matrix.pair }}" \
            --arg fixture "$FIXTURE_SHA" --arg harness "$GITHUB_SHA" \
            --arg baseRelease "$BASE_RELEASE_ID" --arg baseManifestSha "$BASE_MANIFEST_SHA" \
            --arg hotRelease "${{ steps.source.outputs.release-id }}" \
            --arg hotManifestSha "${{ steps.source.outputs.manifest-sha }}" \
            --arg runnerImage "${ImageVersion:-unknown}" --arg cpu "$(sysctl -n machdep.cpu.brand_string)" \
            --arg autofsckPolicy "${{ matrix.treatment == 'noautofsck' && 'disabled' || 'default' }}" \
            --slurpfile attachSampling "$root/attach-sampling.json" \
            '{scenario:$scenario,treatment:$treatment,pair:$pair,fixture:$fixture,harness:$harness,baseReleaseId:$baseRelease,baseManifestSha256:$baseManifestSha,hotReleaseId:$hotRelease,hotManifestSha256:$hotManifestSha,runnerImage:$runnerImage,cpu:$cpu,imageFormat:"ULFO",filesystem:"case-sensitive-jhfs-plus",verification:"default",autofsckPolicy:$autofsckPolicy,writableShadow:true,attachSampling:$attachSampling[0],performanceEligible:($scenario != "unprofiled-file" and ($attachSampling[0].requested | not))}' \
            > "$root/environment.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-hotpack-${{ matrix.scenario }}-pair-${{ matrix.pair }}-${{ matrix.treatment }}
          path: ${{ runner.temp }}/darwin-hotpack-reader

  compare:
    needs: [validate, reader]
    if: always() && needs.reader.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: darwin-hotpack-*
          path: ${{ runner.temp }}/readers
      - name: Require identical paired outputs
        env:
          ROUNDS: ${{ needs.validate.outputs.rounds }}
          SCENARIOS: ${{ needs.validate.outputs.scenarios }}
          COMPARE_AUTOFSCK: ${{ needs.validate.outputs.compare-autofsck }}
        run: |
          set -euo pipefail
          fixtures=(matched)
          treatments=(cold hot)
          if [ "$COMPARE_AUTOFSCK" = true ]; then
            treatments=(default noautofsck)
          elif [ "$SCENARIOS" = all ]; then
            fixtures+=(changed-input unprofiled-file)
          fi
          for pair in $(seq 1 "$ROUNDS"); do
            for fixture in "${fixtures[@]}"; do
              left="$RUNNER_TEMP/readers/darwin-hotpack-$fixture-pair-$pair-${treatments[0]}"
              right="$RUNNER_TEMP/readers/darwin-hotpack-$fixture-pair-$pair-${treatments[1]}"
              test "$(jq -c 'map({attr,storePath}) | sort_by(.attr)' "$left/records.json")" = \
                "$(jq -c 'map({attr,storePath}) | sort_by(.attr)' "$right/records.json")"
              test "$(cat "$left/proof-path.txt")" = "$(cat "$right/proof-path.txt")"
              test "$(jq -c '{baseReleaseId,baseManifestSha256,hotReleaseId,hotManifestSha256,verification}' "$left/environment.json")" = \
                "$(jq -c '{baseReleaseId,baseManifestSha256,hotReleaseId,hotManifestSha256,verification}' "$right/environment.json")"
              if [ "$COMPARE_AUTOFSCK" = true ]; then
                jq -e '.treatment == "default" and .autofsckPolicy == "default" and .verification == "default"' \
                  "$left/environment.json"
                jq -e '.treatment == "noautofsck" and .autofsckPolicy == "disabled" and .verification == "default"' \
                  "$right/environment.json"
              fi
              if [ "$fixture" = unprofiled-file ]; then
                jq -e '.backingRequestsAfter > .backingRequestsBefore' "$left/unprofiled-file.json"
                jq -e '.backingRequestsAfter > .backingRequestsBefore' "$right/unprofiled-file.json"
              fi
            done
            if [ "$SCENARIOS" = all ]; then
              matched="$(jq -c 'map({attr,storePath}) | sort_by(.attr)' \
                "$RUNNER_TEMP/readers/darwin-hotpack-matched-pair-$pair-cold/records.json")"
              changed="$(jq -c 'map({attr,storePath}) | sort_by(.attr)' \
                "$RUNNER_TEMP/readers/darwin-hotpack-changed-input-pair-$pair-cold/records.json")"
              test "$changed" != "$matched"
            fi
          done
          pair_count=$((ROUNDS * ${#fixtures[@]}))
          jq -n --arg scope "$SCENARIOS" --argjson rounds "$ROUNDS" --argjson pairs "$pair_count" \
            --argjson compareAutofsck "$COMPARE_AUTOFSCK" --argjson treatments "$(printf '%s\n' "${treatments[@]}" | jq -Rsc 'split("\n")[:-1]')" \
            '{matching:true,scope:$scope,rounds:$rounds,pairs:$pairs,treatments:$treatments,compareAutofsck:$compareAutofsck,performanceScenarios:(if $compareAutofsck then ["matched"] else ["matched","changed-input"] end),robustnessOnly:(if $compareAutofsck then [] else ["unprofiled-file"] end)}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo '| Reader start (Unix seconds) | Pair | Scenario | Treatment |'
            echo '| ---: | ---: | :--- | :--- |'
            for start in "$RUNNER_TEMP"/readers/darwin-hotpack-*-pair-*-*/setup-start.txt; do
              environment="$(dirname "$start")/environment.json"
              printf '%s\t| %s | %s | %s | %s |\n' \
                "$(cat "$start")" "$(cat "$start")" \
                "$(jq -r .pair "$environment")" "$(jq -r .scenario "$environment")" \
                "$(jq -r .treatment "$environment")"
            done | sort -n | cut -f2-
          } >> "$GITHUB_STEP_SUMMARY"
