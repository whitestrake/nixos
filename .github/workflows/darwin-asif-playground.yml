name: Darwin ASIF Container Probe

on:
  push:
    branches: [feat/ci-optimisation]
    paths: [.github/workflows/darwin-asif-playground.yml]
  workflow_dispatch:
    inputs:
      full_workload:
        description: Convert the frozen image without changing its filesystem and run the Darwin output
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: darwin-asif-playground-${{ github.ref }}
  cancel-in-progress: false

env:
  FIXTURE_SHA: 33c5637ef5d9508786481530a5909a19c59d836f
  SOURCE_CACHE_ID: '7381391064'
  SOURCE_CACHE_KEY: darwin-lifecycle-v1-34026984404-aed47803728f84ad1076f48223f143ecb3ccc012-compacted
  SOURCE_CACHE_REF: refs/heads/feat/ci-optimisation
  SOURCE_CACHE_SIZE: '2051447771'
  SOURCE_CACHE_VERSION: 99b8147302caa48cd22aa865621741139ffb01c10d47c65b4818671da4075ee8
  EXPECTED_RECORDS: '[{"attr":"darwinConfigurations.andred","kind":"darwinConfiguration","name":"andred","storePath":"/nix/store/3qm99r4kgpcwfrgn3j6xlscblfz04qr9-darwin-system-26.05.c3e90c8"}]'

jobs:
  capability:
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      supported: ${{ steps.probe.outputs.supported }}
    steps:
      - name: Convert a bounded case-sensitive HFS+ fixture to ASIF
        id: probe
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asif-capability"
          source="$root/source.sparseimage"
          candidate="$root/candidate.asif"
          mount="$root/source-mount"
          source_device=
          mkdir -p "$root/evidence" "$mount"
          bounded() { perl -e 'alarm shift; exec @ARGV' 180 "$@"; }
          cleanup() {
            for path in "$root/source-mount" "$root/candidate-mount"; do
              mount | grep -Fq " on $path " && hdiutil detach -force "$path" >/dev/null || true
            done
            [ -z "$source_device" ] || hdiutil detach -force "$source_device" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          bounded hdiutil create -size 256m -type SPARSE -fs 'Case-sensitive Journaled HFS+' \
            -volname ASIFProbe "$source" \
            > "$root/evidence/create.stdout" 2> "$root/evidence/create.stderr"
          bounded hdiutil attach -mountpoint "$mount" -nobrowse "$source" \
            > "$root/evidence/source-attach.stdout" 2> "$root/evidence/source-attach.stderr"
          dd if=/dev/urandom of="$mount/payload.bin" bs=1m count=32 \
            2> "$root/evidence/payload-dd.stderr"
          cp /bin/echo "$mount/sentinel"
          chmod 755 "$mount/sentinel"
          shasum -a 256 "$mount/payload.bin" "$mount/sentinel" > "$root/evidence/content.sha256"
          sync
          bounded hdiutil detach "$mount" \
            > "$root/evidence/source-detach.stdout" 2> "$root/evidence/source-detach.stderr"

          bounded hdiutil attach -readonly -nomount -plist "$source" \
            > "$root/evidence/source-device.plist" 2> "$root/evidence/source-device.stderr"
          plutil -convert json -o "$root/evidence/source-device.json" "$root/evidence/source-device.plist"
          source_device="$(jq -r '.["system-entities"][] | select(.["content-hint"] == "GUID_partition_scheme") | .["dev-entry"]' "$root/evidence/source-device.json")"
          test -b "$source_device"
          printf '%s\n' "$source_device" > "$root/evidence/source-device.txt"

          status=0
          bounded diskutil image create from --format ASIF --plist "$source_device" "$candidate" \
            > "$root/evidence/convert.plist" 2> "$root/evidence/convert.stderr" || status=$?
          bounded hdiutil detach "$source_device" \
            > "$root/evidence/source-device-detach.stdout" \
            2> "$root/evidence/source-device-detach.stderr"
          source_device=
          printf '%s\n' "$status" > "$root/evidence/convert.status"
          if [ "$status" -ne 0 ] || [ ! -f "$candidate" ]; then
            echo supported=false >> "$GITHUB_OUTPUT"
            jq -n --argjson status "$status" \
              '{supported:false,conversionStatus:$status,fullWorkloadGate:"closed"}' \
              > "$root/evidence/result.json"
            exit 0
          fi

          echo supported=true >> "$GITHUB_OUTPUT"
          mkdir "$root/candidate-mount"
          bounded diskutil image attach --nobrowse --mountPoint "$root/candidate-mount" "$candidate" \
            > "$root/evidence/candidate-attach.stdout" 2> "$root/evidence/candidate-attach.stderr"
          test "$(awk 'NR == 1 {print $1}' "$root/evidence/content.sha256")" = \
            "$(shasum -a 256 "$root/candidate-mount/payload.bin" | awk '{print $1}')"
          test "$(awk 'NR == 2 {print $1}' "$root/evidence/content.sha256")" = \
            "$(shasum -a 256 "$root/candidate-mount/sentinel" | awk '{print $1}')"
          test "$("$root/candidate-mount/sentinel" sentinel-ok)" = sentinel-ok
          test "$(diskutil info -plist "$root/candidate-mount" | plutil -extract FilesystemType raw -)" = hfs
          bounded hdiutil detach "$root/candidate-mount" \
            > "$root/evidence/candidate-detach.stdout" 2> "$root/evidence/candidate-detach.stderr"
          bounded aa archive -enable-holes -i "$candidate" -o "$root/candidate.aar"
          jq -n --argjson imageLogicalBytes "$(stat -f '%z' "$candidate")" \
            --argjson imageAllocatedBytes "$(( $(du -k "$candidate" | awk '{print $1}') * 1024 ))" \
            --argjson archiveLogicalBytes "$(stat -f '%z' "$root/candidate.aar")" \
            --argjson archiveAllocatedBytes "$(( $(du -k "$root/candidate.aar" | awk '{print $1}') * 1024 ))" \
            '{supported:true,filesystem:"case-sensitive HFS+",sourceFormat:"UDSP",candidateFormat:"ASIF",conversionSource:"attached whole block device",imageLogicalBytes:$imageLogicalBytes,imageAllocatedBytes:$imageAllocatedBytes,archiveLogicalBytes:$archiveLogicalBytes,archiveAllocatedBytes:$archiveAllocatedBytes,archive:"Apple Archive lzfse with hole detection"}' \
            > "$root/evidence/result.json"

      - name: Report capability gate
        if: always()
        run: cat "$RUNNER_TEMP/asif-capability/evidence/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-asif-capability
          path: |
            ${{ runner.temp }}/asif-capability/candidate.aar
            ${{ runner.temp }}/asif-capability/evidence

  capability-reader:
    needs: capability
    if: needs.capability.outputs.supported == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: darwin-asif-capability
          path: ${{ runner.temp }}/input
      - name: Restore sparse ASIF on a fresh runner
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asif-reader"
          mount="$root/mount"
          mkdir -p "$root/evidence" "$root/restored" "$mount"
          cleanup() {
            for path in "$root/mount" "$root/remount"; do
              mount | grep -Fq " on $path " && hdiutil detach -force "$path" >/dev/null || true
            done
          }
          trap cleanup EXIT
          perl -e 'alarm shift; exec @ARGV' 180 aa extract -enable-holes \
            -i "$RUNNER_TEMP/input/candidate.aar" -d "$root/restored"
          image="$root/restored/candidate.asif"
          test -f "$image"
          perl -e 'alarm shift; exec @ARGV' 180 diskutil image attach --nobrowse \
            --mountPoint "$mount" "$image" \
            > "$root/evidence/attach.stdout" 2> "$root/evidence/attach.stderr"
          test "$(awk 'NR == 1 {print $1}' "$RUNNER_TEMP/input/evidence/content.sha256")" = \
            "$(shasum -a 256 "$mount/payload.bin" | awk '{print $1}')"
          test "$(awk 'NR == 2 {print $1}' "$RUNNER_TEMP/input/evidence/content.sha256")" = \
            "$(shasum -a 256 "$mount/sentinel" | awk '{print $1}')"
          test "$("$mount/sentinel" sentinel-ok)" = sentinel-ok
          printf 'persisted\n' > "$mount/fresh-runner-write.txt"
          sync
          perl -e 'alarm shift; exec @ARGV' 180 hdiutil detach "$mount"
          mkdir "$root/remount"
          perl -e 'alarm shift; exec @ARGV' 180 diskutil image attach --nobrowse \
            --mountPoint "$root/remount" "$image"
          grep -Fx persisted "$root/remount/fresh-runner-write.txt"
          perl -e 'alarm shift; exec @ARGV' 180 hdiutil detach "$root/remount"
          jq -n --argjson imageLogicalBytes "$(stat -f '%z' "$image")" \
            --argjson imageAllocatedBytes "$(( $(du -k "$image" | awk '{print $1}') * 1024 ))" \
            --argjson archiveBytes "$(stat -f '%z' "$RUNNER_TEMP/input/candidate.aar")" \
            '{restoredOnFreshRunner:true,persistentWrite:true,imageLogicalBytes:$imageLogicalBytes,imageAllocatedBytes:$imageAllocatedBytes,archiveBytes:$archiveBytes}' \
            > "$root/evidence/result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-asif-capability-reader
          path: ${{ runner.temp }}/asif-reader/evidence

  full-producer:
    needs: [capability, capability-reader]
    if: github.event_name == 'workflow_dispatch' && inputs.full_workload && needs.capability.outputs.supported == 'true' && needs.capability-reader.result == 'success'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Pin frozen sparsebundle identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full/evidence" "$RUNNER_TEMP/darwin-lifecycle/compacted"
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_CACHE_REF" --key "$SOURCE_CACHE_KEY" \
            --limit 10 --json id,key,sizeInBytes,version > "$RUNNER_TEMP/full/evidence/source-cache.json"
          jq -e --arg key "$SOURCE_CACHE_KEY" --arg id "$SOURCE_CACHE_ID" \
            --arg size "$SOURCE_CACHE_SIZE" --arg version "$SOURCE_CACHE_VERSION" '
              length == 1 and .[0].key == $key and (.[0].id | tostring) == $id
              and (.[0].sizeInBytes | tostring) == $size and .[0].version == $version
            ' "$RUNNER_TEMP/full/evidence/source-cache.json"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: frozen
        with:
          path: ${{ runner.temp }}/darwin-lifecycle/compacted/nix-root.sparsebundle
          key: ${{ env.SOURCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Convert the attached whole device without changing its filesystem
        id: source
        env:
          CACHE_HIT: ${{ steps.frozen.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.frozen.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$SOURCE_CACHE_KEY"
          source="$RUNNER_TEMP/darwin-lifecycle/compacted/nix-root.sparsebundle"
          mount="$RUNNER_TEMP/full/source-mount"
          candidate_mount="$RUNNER_TEMP/full/candidate-mount"
          source_device=
          mkdir -p "$mount"
          cleanup() {
            for path in "$mount" "$candidate_mount"; do
              mount | grep -Fq " on $path " && hdiutil detach -force "$path" >/dev/null || true
            done
            [ -z "$source_device" ] || hdiutil detach -force "$source_device" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          perl -e 'alarm shift; exec @ARGV' 180 hdiutil attach -readonly -nobrowse \
            -mountpoint "$mount" "$source" \
            > "$RUNNER_TEMP/full/evidence/source-attach.stdout" \
            2> "$RUNNER_TEMP/full/evidence/source-attach.stderr"
          filesystem="$(diskutil info -plist "$mount" | plutil -extract FilesystemType raw -)"
          printf '%s\n' "$filesystem" > "$RUNNER_TEMP/full/evidence/source-filesystem.txt"
          perl -e 'alarm shift; exec @ARGV' 180 hdiutil detach "$mount"

          perl -e 'alarm shift; exec @ARGV' 180 hdiutil attach -readonly -nomount -plist "$source" \
            > "$RUNNER_TEMP/full/evidence/source-device.plist" \
            2> "$RUNNER_TEMP/full/evidence/source-device.stderr"
          plutil -convert json -o "$RUNNER_TEMP/full/evidence/source-device.json" \
            "$RUNNER_TEMP/full/evidence/source-device.plist"
          source_device="$(jq -r '.["system-entities"][] | select(.["content-hint"] == "GUID_partition_scheme") | .["dev-entry"]' "$RUNNER_TEMP/full/evidence/source-device.json")"
          test -b "$source_device"
          printf '%s\n' "$source_device" > "$RUNNER_TEMP/full/evidence/source-device.txt"

          candidate="$RUNNER_TEMP/full/nix-root.asif"
          conversion_status=0
          perl -e 'alarm shift; exec @ARGV' 900 diskutil image create from --format ASIF \
            --plist "$source_device" "$candidate" \
            > "$RUNNER_TEMP/full/evidence/convert.plist" \
            2> "$RUNNER_TEMP/full/evidence/convert.stderr" || conversion_status=$?
          printf '%s\n' "$conversion_status" > "$RUNNER_TEMP/full/evidence/convert.status"
          perl -e 'alarm shift; exec @ARGV' 180 hdiutil detach "$source_device" \
            > "$RUNNER_TEMP/full/evidence/source-device-detach.stdout" \
            2> "$RUNNER_TEMP/full/evidence/source-device-detach.stderr"
          source_device=
          if [ "$conversion_status" -ne 0 ] || [ ! -f "$candidate" ]; then
            echo ready=false >> "$GITHUB_OUTPUT"
            jq -n --arg filesystem "$filesystem" --argjson status "$conversion_status" \
              '{ready:false,reason:"whole-device ASIF conversion failed",sourceFilesystem:$filesystem,conversionStatus:$status}' \
              > "$RUNNER_TEMP/full/evidence/result.json"
            exit 0
          fi

          mkdir "$candidate_mount"
          perl -e 'alarm shift; exec @ARGV' 180 diskutil image attach --readOnly --nobrowse \
            --mountPoint "$candidate_mount" "$candidate" \
            > "$RUNNER_TEMP/full/evidence/candidate-attach.stdout" \
            2> "$RUNNER_TEMP/full/evidence/candidate-attach.stderr"
          candidate_filesystem="$(diskutil info -plist "$candidate_mount" | plutil -extract FilesystemType raw -)"
          printf '%s\n' "$candidate_filesystem" > "$RUNNER_TEMP/full/evidence/candidate-filesystem.txt"
          test "$candidate_filesystem" = "$filesystem"
          test -L "$candidate_mount/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build"
          perl -e 'alarm shift; exec @ARGV' 180 hdiutil detach "$candidate_mount"
          perl -e 'alarm shift; exec @ARGV' 900 aa archive -enable-holes \
            -i "$candidate" -o "$RUNNER_TEMP/full/nix-root.aar"
          source_allocated="$(( $(du -sk "$source" | awk '{print $1}') * 1024 ))"
          source_logical="$(find "$source" -type f -exec stat -f '%z' {} + | awk '{sum += $1} END {print sum + 0}')"
          jq -n --argjson sourceAllocatedBytes "$source_allocated" \
            --argjson sourceLogicalBytes "$source_logical" \
            --argjson imageAllocatedBytes "$(( $(du -k "$candidate" | awk '{print $1}') * 1024 ))" \
            --argjson imageLogicalBytes "$(stat -f '%z' "$candidate")" \
            --argjson archiveAllocatedBytes "$(( $(du -k "$RUNNER_TEMP/full/nix-root.aar" | awk '{print $1}') * 1024 ))" \
            --argjson archiveLogicalBytes "$(stat -f '%z' "$RUNNER_TEMP/full/nix-root.aar")" \
            --arg sourceFilesystem "$filesystem" \
            '{ready:true,sourceFilesystem:$sourceFilesystem,candidateFilesystem:$sourceFilesystem,sourceContainer:"UDSB",candidateContainer:"ASIF",conversionSource:"attached whole block device",sourceAllocatedBytes:$sourceAllocatedBytes,sourceLogicalBytes:$sourceLogicalBytes,imageAllocatedBytes:$imageAllocatedBytes,imageLogicalBytes:$imageLogicalBytes,archiveAllocatedBytes:$archiveAllocatedBytes,archiveLogicalBytes:$archiveLogicalBytes}' \
            > "$RUNNER_TEMP/full/evidence/result.json"
          echo ready=true >> "$GITHUB_OUTPUT"
      - name: Report full-image gate
        if: always()
        run: cat "$RUNNER_TEMP/full/evidence/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-asif-full-producer
          path: ${{ runner.temp }}/full/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.source.outputs.ready == 'true'
        with:
          name: darwin-asif-full-image
          path: ${{ runner.temp }}/full/nix-root.aar
          compression-level: 0

  full-reader:
    needs: full-producer
    if: needs.full-producer.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FIXTURE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .harness
          persist-credentials: false
      - name: Start complete reader timing
        run: |
          mkdir -p "$RUNNER_TEMP/reader/evidence" "$RUNNER_TEMP/reader/image"
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/reader/evidence/reader-start.txt"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: darwin-asif-full-image
          path: ${{ runner.temp }}/input
      - name: Restore sparse ASIF
        run: |
          set -euo pipefail
          perl -e 'alarm shift; exec @ARGV' 900 aa extract -enable-holes \
            -i "$RUNNER_TEMP/input/nix-root.aar" -d "$RUNNER_TEMP/reader/image"
          image="$RUNNER_TEMP/reader/image/nix-root.asif"
          echo "NIX_ROOT_ASIF=$image" >> "$GITHUB_ENV"
          jq -n --argjson archiveBytes "$(stat -f '%z' "$RUNNER_TEMP/input/nix-root.aar")" \
            --argjson imageLogicalBytes "$(stat -f '%z' "$image")" \
            --argjson imageAllocatedBytes "$(( $(du -k "$image" | awk '{print $1}') * 1024 ))" \
            '{archiveBytes:$archiveBytes,imageLogicalBytes:$imageLogicalBytes,imageAllocatedBytes:$imageAllocatedBytes}' \
            > "$RUNNER_TEMP/reader/evidence/restore.json"
      - name: Mount ASIF as writable Nix root
        run: |
          set -euo pipefail
          sudo touch /etc/synthetic.conf
          if ! grep -qE '^nix($|[[:space:]])' /etc/synthetic.conf; then
            printf 'nix\n' | sudo tee -a /etc/synthetic.conf >/dev/null
          fi
          sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -B >/dev/null 2>&1 \
            || sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -t >/dev/null 2>&1 \
            || true
          test -d /nix
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/reader/evidence/mount-start.txt"
          perl -e 'alarm shift; exec @ARGV' 180 sudo diskutil image attach --nobrowse \
            --mountPoint /nix "$NIX_ROOT_ASIF" \
            > "$RUNNER_TEMP/reader/evidence/attach.stdout" \
            2> "$RUNNER_TEMP/reader/evidence/attach.stderr"
          sudo chown "$USER" /nix
          python3 -c 'import time; print(time.time())' > "$RUNNER_TEMP/reader/evidence/mount-end.txt"
      - uses: ./.harness/.github/actions/install-nix
        with:
          extra-nix-conf: |
            max-jobs = auto
            extra-substituters = https://whitestrake.cachix.org?priority=50
            extra-trusted-public-keys = whitestrake.cachix.org-1:UYcyluINGeeyAQgGOrEmOarylMNU5kLMagM0nXOkQK8=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: whitestrake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Write and verify the complete Darwin output
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/reader/evidence"
          python3 -c 'import time; print(time.time())' > "$evidence/build-start.txt"
          nfb=/nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build/bin/nix-fast-build
          test -x "$nfb"
          python3 .harness/.github/scripts/fast-ci-measure.py "$evidence" -- \
            "$nfb" --flake .#ci.aarch64-darwin --systems aarch64-darwin --eval-workers 1 \
            --option builders '' --option max-jobs auto --cachix-cache whitestrake --retries 2 \
            --result-file "$evidence/results.json" -j 50 --stream-json-lines
          jq -ce -f .harness/.github/scripts/nix-fast-build-records.jq \
            "$evidence/results.json" > "$evidence/records.json"
          test "$(jq -c 'map({attr,kind,name,storePath}) | sort_by(.attr)' "$evidence/records.json")" = \
            "$(jq -c 'map({attr,kind,name,storePath}) | sort_by(.attr)' <<< "$EXPECTED_RECORDS")"
          jq -e 'any(.results[]; .type == "CACHIX" and .success == true)' "$evidence/results.json"
          python3 -c 'import time; print(time.time())' > "$evidence/build-end.txt"
          sync
          perl -e 'alarm shift; exec @ARGV' 180 sudo hdiutil detach /nix
          perl -e 'alarm shift; exec @ARGV' 900 aa archive -enable-holes \
            -i "$NIX_ROOT_ASIF" -o "$RUNNER_TEMP/reader/after.aar"
          jq -n --argjson imageAllocatedBytes "$(( $(du -k "$NIX_ROOT_ASIF" | awk '{print $1}') * 1024 ))" \
            --argjson imageLogicalBytes "$(stat -f '%z' "$NIX_ROOT_ASIF")" \
            --argjson archiveAllocatedBytes "$(( $(du -k "$RUNNER_TEMP/reader/after.aar" | awk '{print $1}') * 1024 ))" \
            --argjson archiveLogicalBytes "$(stat -f '%z' "$RUNNER_TEMP/reader/after.aar")" \
            '{completeOutputWritten:true,imageAllocatedBytes:$imageAllocatedBytes,imageLogicalBytes:$imageLogicalBytes,archiveAllocatedBytes:$archiveAllocatedBytes,archiveLogicalBytes:$archiveLogicalBytes}' \
            > "$evidence/after.json"
          python3 -c 'import time; print(time.time())' > "$evidence/reader-end.txt"
      - name: Detach ASIF
        if: always()
        run: |
          if mount | grep -Fq ' on /nix '; then
            perl -e 'alarm shift; exec @ARGV' 60 sudo hdiutil detach -force /nix || true
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-asif-full-reader
          path: ${{ runner.temp }}/reader/evidence
