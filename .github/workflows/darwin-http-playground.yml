name: Darwin HTTP Disk Image Probe

on:
  push:
    branches: [feat/ci-optimisation]
    paths:
      - .github/workflows/darwin-http-playground.yml
      - .github/scripts/darwin-http-probe.py
      - .github/scripts/test_darwin_http_probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darwin-http-playground-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-http:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check loopback range server
        run: python3 .github/scripts/test_darwin_http_probe.py

      - name: Create synthetic UDIF fixtures
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-http"
          images="$RUNNER_TEMP/darwin-http-images"
          mkdir -p "$root/fixture-logs" "$images"

          bounded_hdi() {
            perl -e 'alarm shift; exec @ARGV' 180 hdiutil "$@"
          }

          for filesystem in apfs hfs; do
            if [ "$filesystem" = apfs ]; then
              fs=APFS
            else
              fs=HFS+J
            fi
            source="$images/$filesystem.sparseimage"
            mount="$RUNNER_TEMP/create-$filesystem"
            mkdir -p "$mount"
            bounded_hdi create -size 128m -fs "$fs" -volname "HTTPProbe-$filesystem" \
              -type SPARSE -o "$source" \
              > "$root/fixture-logs/$filesystem-create.stdout" \
              2> "$root/fixture-logs/$filesystem-create.stderr"
            bounded_hdi attach "$source" -mountpoint "$mount" -nobrowse -noautoopen \
              > "$root/fixture-logs/$filesystem-populate-attach.stdout" \
              2> "$root/fixture-logs/$filesystem-populate-attach.stderr"
            dd if=/dev/urandom of="$mount/00-incompressible.bin" bs=1m count=48 \
              2> "$root/fixture-logs/$filesystem-dd-first.stderr"
            mkdir "$mount/bin"
            cp /bin/echo "$mount/bin/sentinel"
            chmod 755 "$mount/bin/sentinel"
            dd if=/dev/urandom of="$mount/99-incompressible.bin" bs=1m count=48 \
              2> "$root/fixture-logs/$filesystem-dd-last.stderr"
            sync
            bounded_hdi detach "$mount" \
              > "$root/fixture-logs/$filesystem-populate-detach.stdout" \
              2> "$root/fixture-logs/$filesystem-populate-detach.stderr"

            for format in ULFO UDZO; do
              image="$images/$filesystem-$format.dmg"
              bounded_hdi convert "$source" -format "$format" -o "$image" \
                > "$root/fixture-logs/$filesystem-$format-convert.stdout" \
                2> "$root/fixture-logs/$filesystem-$format-convert.stderr"
              shasum -a 256 "$image" > "$root/fixture-logs/$filesystem-$format.sha256"
              stat -f '%z' "$image" > "$root/fixture-logs/$filesystem-$format.bytes"
            done
          done

          jq -n --arg runnerImage "${ImageVersion:-unknown}" \
            --arg cpu "$(sysctl -n machdep.cpu.brand_string)" \
            --arg kernel "$(uname -srv)" --arg harness "$GITHUB_SHA" \
            '{scope:"native capability probe",runner:"macos-26",runnerImage:$runnerImage,cpu:$cpu,kernel:$kernel,harness:$harness,imageSizeMiB:128,filesystems:["APFS","HFS+J"],udifFormats:["ULFO","UDZO"],payload:"two separated 48 MiB urandom files plus a copied /bin/echo Mach-O sentinel",transport:"loopback HTTP serving locally generated bytes",fullStoreConversion:false,attachFlags:["-shadow","-mountpoint","-nobrowse","-noautoopen","-owners on"],verificationTreatments:["default","-noverify"],noverifyBoundary:"synthetic locally generated image served over loopback only; not a production recommendation"}' \
            > "$root/environment.json"

      - name: Attach over HTTP and measure demand reads
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/darwin-http"
          images="$RUNNER_TEMP/darwin-http-images"
          failures=0

          bounded_hdi() {
            perl -e 'alarm shift; exec @ARGV' 180 hdiutil "$@"
          }

          mark_phase() {
            PHASE="$1" MARKERS="$trial/phase-markers.jsonl" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import time

          with Path(os.environ["MARKERS"]).open("a") as stream:
              print(json.dumps({"phase": os.environ["PHASE"], "monotonicNs": time.monotonic_ns()}), file=stream)
          PY
          }

          for filesystem in apfs hfs; do
            for format in ULFO UDZO; do
              image="$images/$filesystem-$format.dmg"
              expected_sha="$(shasum -a 256 "$image" | awk '{print $1}')"
              for verification in default noverify; do
                trial="$root/$filesystem-$format-$verification"
                mount="$RUNNER_TEMP/mount-$filesystem-$format-$verification"
                shadow="$trial/image.shadow"
                mkdir -p "$trial" "$mount"
                : > "$trial/requests.jsonl"
                printf '%s\n' "$expected_sha" > "$trial/base-before.sha256"

                python3 .github/scripts/darwin-http-probe.py \
                  --file "$image" --log "$trial/requests.jsonl" --ready "$trial/url.txt" \
                  > "$trial/server.stdout" 2> "$trial/server.stderr" &
                server_pid=$!
                printf '%s\n' "$server_pid" > "$trial/server.pid"
                for _ in {1..100}; do
                  [ -s "$trial/url.txt" ] && break
                  kill -0 "$server_pid" 2>/dev/null || break
                  sleep 0.1
                done
                if [ ! -s "$trial/url.txt" ]; then
                  ps -p "$server_pid" -o pid,ppid,state,etime,command > "$trial/server-process.txt" || true
                  sample "$server_pid" 2 -file "$trial/server-sample.txt" >/dev/null 2>&1 || true
                  cat "$trial/server.stderr"
                  echo 'HTTP server did not signal readiness' >&2
                  exit 1
                fi

                mark_phase beforeAttach
                attach_args=(attach "$(cat "$trial/url.txt")" -shadow "$shadow" \
                  -mountpoint "$mount" -nobrowse -noautoopen -owners on)
                if [ "$verification" = noverify ]; then
                  attach_args+=(-noverify)
                fi
                attach_status=0
                bounded_hdi "${attach_args[@]}" \
                  > "$trial/attach.stdout" 2> "$trial/attach.stderr" || attach_status=$?
                mark_phase afterAttach
                printf '%s\n' "$attach_status" > "$trial/attach.status"
                cp "$trial/requests.jsonl" "$trial/requests-after-attach.jsonl"

                workload_status=0
                detach_status=0
                sentinel_output=
                if [ "$attach_status" -eq 0 ]; then
                  sentinel_output="$("$mount/bin/sentinel" sentinel-ok)" || workload_status=$?
                  printf '%s\n' "$sentinel_output" > "$trial/sentinel-execute.txt"
                  if [ "$workload_status" -eq 0 ]; then
                    shasum -a 256 "$mount/bin/sentinel" \
                      > "$trial/sentinel-read.sha256" || workload_status=$?
                  fi
                  if [ "$workload_status" -eq 0 ]; then
                    printf 'shadow-write-ok\n' > "$mount/new-file.txt" || workload_status=$?
                    grep -Fx shadow-write-ok "$mount/new-file.txt" \
                      > "$trial/shadow-write.txt" || workload_status=$?
                  fi
                  sync
                  mark_phase afterWork
                  cp "$trial/requests.jsonl" "$trial/requests-after-work.jsonl"
                  bounded_hdi detach "$mount" \
                    > "$trial/detach.stdout" 2> "$trial/detach.stderr" || detach_status=$?
                else
                  cp "$trial/requests.jsonl" "$trial/requests-after-work.jsonl"
                  mark_phase afterWork
                fi
                mark_phase afterDetach
                for _ in {1..50}; do
                  if python3 -c 'import json,sys; events=[json.loads(line) for line in open(sys.argv[1])]; raise SystemExit(sum(e["event"] == "start" for e in events) != sum(e["event"] == "finish" for e in events))' "$trial/requests.jsonl"; then
                    break
                  fi
                  sleep 0.1
                done
                printf '%s\n' "$workload_status" > "$trial/workload.status"
                printf '%s\n' "$detach_status" > "$trial/detach.status"
                cp "$trial/requests.jsonl" "$trial/requests-final.jsonl"
                actual_sha="$(shasum -a 256 "$image" | awk '{print $1}')"
                printf '%s\n' "$actual_sha" > "$trial/base-after.sha256"
                if [ "$actual_sha" = "$expected_sha" ]; then
                  base_unchanged=true
                else
                  base_unchanged=false
                fi

                kill "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
                ATTACH_STATUS="$attach_status" WORKLOAD_STATUS="$workload_status" \
                  DETACH_STATUS="$detach_status" BASE_UNCHANGED="$base_unchanged" \
                  FILESYSTEM="$filesystem" FORMAT="$format" VERIFICATION="$verification" \
                  TRIAL="$trial" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          trial = Path(os.environ["TRIAL"])
          def read(name):
              path = trial / name
              return [json.loads(line) for line in path.read_text().splitlines()]
          def unique_bytes(records):
              ranges = sorted(
                  (record["responseStart"], record["responseStart"] + record["responseBytes"] - 1)
                  for record in records if record["responseBytes"]
              )
              merged = []
              for start, end in ranges:
                  if merged and start <= merged[-1][1] + 1:
                      merged[-1][1] = max(merged[-1][1], end)
                  else:
                      merged.append([start, end])
              return sum(end - start + 1 for start, end in merged)
          def total(records):
              return {
                  "requests": len(records),
                  "responseBytes": sum(record["responseBytes"] for record in records),
                  "uniqueResponseBytes": unique_bytes(records),
                  "rangeRequests": sum(record["range"] is not None for record in records),
              }
          events = read("requests-final.jsonl")
          starts = [event for event in events if event["event"] == "start"]
          final = [event for event in events if event["event"] == "finish"]
          finished_ids = {event["requestId"] for event in final}
          markers = {
              record["phase"]: record["monotonicNs"]
              for record in read("phase-markers.jsonl")
          }
          attach = [
              record for record in final
              if record["finishedMonotonicNs"] <= markers["afterAttach"]
          ]
          work = [
              record for record in final
              if record["finishedMonotonicNs"] <= markers["afterWork"]
          ]
          attach_total = total(attach)
          work_total = total(work)
          final_total = total(final)
          def crossing(boundary):
              point = markers[boundary]
              return sum(
                  record["startedMonotonicNs"] < point < record["finishedMonotonicNs"]
                  for record in final
              )
          result = {
              "filesystem": os.environ["FILESYSTEM"],
              "format": os.environ["FORMAT"],
              "verification": os.environ["VERIFICATION"],
              "attachStatus": int(os.environ["ATTACH_STATUS"]),
              "workloadStatus": int(os.environ["WORKLOAD_STATUS"]),
              "detachStatus": int(os.environ["DETACH_STATUS"]),
              "baseShaUnchanged": os.environ["BASE_UNCHANGED"] == "true",
              "phaseMarkersMonotonicNs": markers,
              "phaseAccounting": "requests assigned by finish time; crossing counts qualify boundary ambiguity",
              "unfinishedRequestIds": [
                  event["requestId"] for event in starts
                  if event["requestId"] not in finished_ids
              ],
              "requestsCrossingBoundaries": {
                  boundary: crossing(boundary)
                  for boundary in ("afterAttach", "afterWork", "afterDetach")
              },
              "throughAttach": attach_total,
              "afterWork": {
                  key: work_total[key] - attach_total[key] for key in work_total
              },
              "duringDetach": {
                  key: final_total[key] - work_total[key] for key in final_total
              },
              "total": final_total,
          }
          (trial / "result.json").write_text(json.dumps(result, indent=2) + "\n")
          PY

                if [ "$attach_status" -ne 0 ] || [ "$workload_status" -ne 0 ] || \
                   [ "$detach_status" -ne 0 ] || [ "$base_unchanged" != true ] || \
                   [ "$sentinel_output" != sentinel-ok ] || \
                   ! jq -e '.unfinishedRequestIds | length == 0' "$trial/result.json" >/dev/null; then
                  failures=$((failures + 1))
                fi
              done
            done
          done

          jq -s '.' "$root"/*/result.json > "$root/results.json"
          jq '[group_by(.filesystem, .format)[] | {
            filesystem: .[0].filesystem,
            format: .[0].format,
            defaultAttachBytes: (map(select(.verification == "default"))[0].throughAttach.responseBytes),
            noverifyAttachBytes: (map(select(.verification == "noverify"))[0].throughAttach.responseBytes),
            noverifyMinusDefaultAttachBytes: ((map(select(.verification == "noverify"))[0].throughAttach.responseBytes) - (map(select(.verification == "default"))[0].throughAttach.responseBytes))
          }]' "$root/results.json" > "$root/verification-comparison.json"
          cat "$root/verification-comparison.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$failures"

      - name: Detach disposable fixtures
        if: always()
        run: |
          for mount in "$RUNNER_TEMP"/mount-* "$RUNNER_TEMP"/create-*; do
            [ -d "$mount" ] || continue
            if mount | grep -Fq " on $mount "; then
              perl -e 'alarm shift; exec @ARGV' 60 hdiutil detach -force "$mount" || true
            fi
          done
          for pidfile in "$RUNNER_TEMP"/darwin-http/*/server.pid; do
            [ -f "$pidfile" ] || continue
            kill "$(cat "$pidfile")" 2>/dev/null || true
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: darwin-http-evidence
          path: ${{ runner.temp }}/darwin-http
