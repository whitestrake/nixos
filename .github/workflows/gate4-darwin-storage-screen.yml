name: "Gate 4 Darwin Storage Screen"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: "Fixture"
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      fixture-sha: ${{ steps.fixture.outputs.fixture-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Create canonical fixture
        id: fixture
        shell: bash
        env:
          GATE4_TARGET: nixpkgs-darwin#legacyPackages.aarch64-darwin.hello
        run: |
          set -euo pipefail

          fixture_dir="$RUNNER_TEMP/gate4-fixture"
          mkdir -p "$fixture_dir"
          cd "$fixture_dir"

          drv="$(
            nix eval \
              --inputs-from "$GITHUB_WORKSPACE" \
              --raw \
              "${GATE4_TARGET}.drvPath"
          )"
          out="$(
            nix-store --query --outputs "$drv"
          )"

          nix-store --check-validity "$drv"
          if nix-store --check-validity "$out" >/dev/null 2>&1; then
            echo "::error ::fixture target output is already valid: $out"
            exit 1
          fi

          nix-store --realise --dry-run "$drv"
          nix-store --query --requisites "$drv" | LC_ALL=C sort -u > input-paths.txt

          fixture_inputs=()
          while IFS= read -r path; do
            if [ "$path" != "$drv" ]; then
              fixture_inputs+=("$path")
            fi
          done < input-paths.txt
          nix-store --realise "${fixture_inputs[@]}" >/dev/null

          nix-store --query --requisites --include-outputs "$drv" \
            | grep -vFx "$out" \
            | LC_ALL=C sort -u \
            > fixture-paths.txt
          rm input-paths.txt

          while IFS= read -r path; do
            nix-store --check-validity "$path"
          done < fixture-paths.txt
          nix-store --check-validity "$drv"
          if nix-store --check-validity "$out" >/dev/null 2>&1; then
            echo "::error ::fixture preparation realised the target output: $out"
            exit 1
          fi

          : > roots.tsv
          fixture_paths=()
          while IFS= read -r path; do
            fixture_paths+=("$path")
            printf 'fixture/%s\t%s\n' "$(basename "$path")" "$path" >> roots.tsv
          done < fixture-paths.txt

          nix-store --export "${fixture_paths[@]}" > fixture.nar
          jq -n \
            --arg installable "$GATE4_TARGET" \
            --arg drvPath "$drv" \
            --arg outPath "$out" \
            --arg nixVersion "$(nix --version)" \
            --arg system aarch64-darwin \
            '{
              installable: $installable,
              drvPath: $drvPath,
              outPath: $outPath,
              nixVersion: $nixVersion,
              system: $system
            }' > target.json

          shasum -a 256 fixture.nar fixture-paths.txt roots.tsv target.json > SHA256SUMS
          fixture_sha="$(awk '$2 == "fixture.nar" { print $1 }' SHA256SUMS)"
          if [ "${#fixture_sha}" -ne 64 ] || printf '%s\n' "$fixture_sha" | grep -q '[^0-9a-f]'; then
            echo "::error ::fixture SHA-256 is malformed: ${fixture_sha:-empty}"
            exit 1
          fi
          printf 'fixture-sha=%s\n' "$fixture_sha" >> "$GITHUB_OUTPUT"

      - name: Upload canonical fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate4-fixture-${{ steps.fixture.outputs.fixture-sha }}
          path: ${{ runner.temp }}/gate4-fixture
          compression-level: 0
          retention-days: 7

  native-feasibility:
    name: "${{ matrix.variant }} / trial ${{ matrix.trial }}"
    needs: fixture
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant:
          - 0-udsb-jhfsx
          - 1-udsb-hfsx
          - 2-udsb-apfsx
          - 3-asif-apfsx
        trial:
          - 1
          - 2
          - 3
    env:
      GATE4_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select candidate image path
        shell: bash
        run: |
          set -euo pipefail

          case "$GATE4_VARIANT" in
            0-udsb-jhfsx | 1-udsb-hfsx | 2-udsb-apfsx)
              extension=sparsebundle
              ;;
            3-asif-apfsx)
              extension=asif
              ;;
          esac
          printf 'GATE4_IMAGE_PATH=%s/gate4/%s/trial-%s/nix-root.%s\n' \
            "$RUNNER_TEMP" \
            "$GATE4_VARIANT" \
            "${{ matrix.trial }}" \
            "$extension" \
            >> "$GITHUB_ENV"

      - name: Download canonical fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gate4-fixture-${{ needs.fixture.outputs.fixture-sha }}
          path: ${{ runner.temp }}/gate4-fixture

      - name: Create and attach image
        shell: bash
        env:
          GATE4_PHASE: prepare
        run: bash .github/scripts/gate4-darwin-storage-screen.sh

      - name: Install Nix in candidate
        uses: ./.github/actions/install-nix

      - name: Import, root, verify, and realise fixture
        shell: bash
        env:
          GATE4_PHASE: verify
        run: bash .github/scripts/gate4-darwin-storage-screen.sh

      - name: Pack candidate image
        shell: bash
        env:
          GATE4_PHASE: pack
        run: bash .github/scripts/gate4-darwin-storage-screen.sh

      - name: Reattach packed image
        shell: bash
        env:
          GATE4_PHASE: prepare
        run: bash .github/scripts/gate4-darwin-storage-screen.sh

      - name: Verify packed image
        shell: bash
        env:
          GATE4_PHASE: verify
        run: bash .github/scripts/gate4-darwin-storage-screen.sh

      - name: Cleanly detach verified image
        shell: bash
        env:
          GATE4_PHASE: pack
        run: bash .github/scripts/gate4-darwin-storage-screen.sh

      - name: Ensure candidate image is detached
        if: always()
        shell: bash
        env:
          GATE4_PHASE: cleanup
        run: bash .github/scripts/gate4-darwin-storage-screen.sh

      - name: Upload timing and correctness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate4-screen1-${{ matrix.variant }}-trial-${{ matrix.trial }}
          path: |
            ${{ runner.temp }}/gate4/${{ matrix.variant }}/trial-${{ matrix.trial }}/evidence.jsonl
            ${{ runner.temp }}/gate4/${{ matrix.variant }}/trial-${{ matrix.trial }}/*.plist
          if-no-files-found: warn
          retention-days: 7
