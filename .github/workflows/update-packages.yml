name: "Update Packages"
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Comma-separated packages to update (leave empty for all)"
        required: false
        type: string
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC
permissions:
  contents: read
concurrency:
  group: update-packages
  queue: max
jobs:
  update-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: ./.github/actions/install-nix
      - name: Update selected packages
        id: update
        run: |
          set -euo pipefail

          if [ -n "$PACKAGE" ]; then
            # shellcheck disable=SC2016
            PACKAGES="$(jq -cn --arg package "$PACKAGE" '$package | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          else
            # shellcheck disable=SC2016
            PACKAGES="$(nix eval --json '.#updatablePackages' --accept-flake-config)"
          fi

          BODY="$RUNNER_TEMP/package-update-pr.md"
          cat > "$BODY" <<'EOF'
          Automated package updates via `nix-update`.

          | Package | Before | After |
          |---|---:|---:|
          EOF
          echo "body_path=$BODY" >> "$GITHUB_OUTPUT"
          failures=()

          # Not --use-update-script: its flake path realises the package's build environment via nix develop first.
          update() {
            local none script
            none="$(nix eval ".#$1" --apply 'p: (p.updateScript or null) == null')" || return
            if [ "$none" = true ]; then
              nix run nixpkgs#nix-update -- --flake "$1"
              return
            fi
            script="$(nix build --no-link --print-out-paths --impure --expr "
              with import <nixpkgs> {};
              let p = (builtins.getFlake (toString ./.)).packages.\${builtins.currentSystem}.\"$1\";
              in writeScript \"update-$1\" (lib.escapeShellArgs (lib.toList (p.updateScript.command or p.updateScript)))")" || return
            UPDATE_NIX_ATTR_PATH="$1" UPDATE_NIX_PNAME="$1" UPDATE_NIX_OLD_VERSION="$2" \
              UPDATE_NIX_NAME="$1-$2" "$script"
          }

          while IFS= read -r package; do
            before_diff="$(git diff | git hash-object --stdin)"

            if ! old_version="$(nix eval --raw ".#${package}.version" --accept-flake-config)"; then
              failures+=("$package")
              continue
            fi

            if update "$package" "$old_version" && \
              new_version="$(nix eval --raw ".#${package}.version" --accept-flake-config)"; then
              after_diff="$(git diff | git hash-object --stdin)"

              if [ "$before_diff" != "$after_diff" ]; then
                # shellcheck disable=SC2016
                printf '| `%s` | `%s` | `%s` |\n' \
                  "$package" "$old_version" "$new_version" >> "$BODY"
              fi
            else
              failures+=("$package")
              git restore --worktree -- "packages/$package.nix"
            fi
          done < <(jq -r '.[]' <<< "$PACKAGES")

          if ((${#failures[@]})); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "Failed updates:"
              # shellcheck disable=SC2016
              printf -- '- `%s`\n' "${failures[@]}"
            } >> "$BODY"
          fi

          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE: ${{ inputs.package }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format package updates
        if: steps.update.outputs.changed == 'true'
        run: nix fmt
      - name: Create GitHub App token
        id: app-token
        if: steps.update.outputs.changed == 'true' || (!inputs.package && steps.update.outputs.failed != 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WHITESTRAKE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHITESTRAKE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open package update pull request
        if: steps.update.outputs.changed == 'true' || (!inputs.package && steps.update.outputs.failed != 'true')
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: nix-update/packages
          title: "chore(pkgs): update packages"
          body-path: ${{ steps.update.outputs.body_path }}
          labels: dependencies
          commit-message: "chore(pkgs): update packages"
          delete-branch: true
          sign-commits: true
      - name: Report update failures
        if: always() && steps.update.outputs.failed == 'true'
        run: exit 1
