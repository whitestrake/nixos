name: "Update Packages"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "packages: update local packages against master. lock: bump flake.lock, then update local packages on top of it."
        required: true
        default: packages
        type: choice
        options: [packages, lock]
      package:
        description: "Comma-separated packages to update (leave empty for all). Packages mode only."
        required: false
        type: string
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC: packages mode
    - cron: "0 12 * * 6" # Saturdays at 12:00 UTC: lock mode
permissions:
  contents: read
concurrency:
  group: update-packages
  queue: max
env:
  # One branch for both modes, so a lock run and a packages run share one PR.
  BRANCH: update-dependencies
jobs:
  update-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select mode
        id: mode
        run: |
          set -euo pipefail

          if [ "$EVENT" = schedule ]; then
            if [ "$SCHEDULE" = "0 12 * * 6" ]; then
              mode=lock
            elif [ "$(date -u +%u)" = 6 ]; then
              # The lock run covers Saturday; skip the overlapping daily run.
              mode=skip
            else
              mode=packages
            fi
          else
            mode="$INPUT_MODE"
          fi

          if [ "$mode" = lock ] && [ -n "$INPUT_PACKAGE" ]; then
            echo "::error ::The package input applies to packages mode only."
            exit 1
          fi

          echo "Mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACKAGE: ${{ inputs.package }}
      - name: Check out source
        if: steps.mode.outputs.mode != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, so the open update branch can be diffed against its merge base.
          fetch-depth: 0
      - name: Install Nix
        if: steps.mode.outputs.mode != 'skip'
        uses: ./.github/actions/install-nix
      - name: Update flake.lock and packages
        id: update
        if: steps.mode.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          BODY="$RUNNER_TEMP/package-update-pr.md"
          echo "body_path=$BODY" >> "$GITHUB_OUTPUT"
          failures=()
          declare -A before=()

          ALL="$(nix eval --json '.#updatablePackages' --accept-flake-config)"
          if [ -n "$PACKAGE" ]; then
            # shellcheck disable=SC2016
            PACKAGES="$(jq -cn --arg package "$PACKAGE" '$package | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          else
            PACKAGES="$ALL"
          fi

          # Read versions on the base before anything moves, so the table
          # shows the real "Before" for every package the PR changes,
          # including ones whose version follows an input (such as komodo-ui).
          while IFS= read -r package; do
            before[$package]="$(nix eval --raw ".#${package}.version" --accept-flake-config)" || true
          done < <(jq -r '.[]' <<< "$ALL")

          # Both modes share one branch. Start from whatever the open update
          # PR already carries (a lock bump, earlier package updates, hand
          # fixes) so a run adds to it instead of force-pushing over it.
          carried=false
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch --no-tags origin "$BRANCH"
            if ! git diff --binary HEAD...FETCH_HEAD | git apply --3way; then
              echo "::error ::$BRANCH no longer applies cleanly on $(git rev-parse --abbrev-ref HEAD). Merge or close its PR, or resolve the conflict on the branch, then re-run."
              exit 1
            fi
            git reset --quiet
            if [ -n "$(git status --porcelain)" ]; then
              carried=true
            fi
          fi

          if [ "$MODE" = lock ]; then
            nix flake update --accept-flake-config
          fi

          # Not --use-update-script: its flake path realises the package's build environment via nix develop first.
          update() {
            local none script
            none="$(nix eval ".#$1" --apply 'p: (p.updateScript or null) == null')" || return
            if [ "$none" = true ]; then
              nix run nixpkgs#nix-update -- --flake "$1"
              return
            fi
            script="$(nix build --no-link --print-out-paths --impure --expr "
              with import <nixpkgs> {};
              let p = (builtins.getFlake (toString ./.)).packages.\${builtins.currentSystem}.\"$1\";
              in writeScript \"update-$1\" (lib.escapeShellArgs (lib.toList (p.updateScript.command or p.updateScript)))")" || return
            UPDATE_NIX_ATTR_PATH="$1" UPDATE_NIX_PNAME="$1" UPDATE_NIX_OLD_VERSION="$2" \
              UPDATE_NIX_NAME="$1-$2" "$script"
          }

          while IFS= read -r package; do
            file="packages/$package.nix"
            saved="$RUNNER_TEMP/$package.nix"
            cp "$file" "$saved"

            if old_version="$(nix eval --raw ".#${package}.version" --accept-flake-config)" && \
              update "$package" "$old_version" && \
              nix eval --raw ".#${package}.version" --accept-flake-config > /dev/null; then
              continue
            fi

            failures+=("$package")
            # Back to what this run started with, keeping any carried update.
            cp "$saved" "$file"
          done < <(jq -r '.[]' <<< "$PACKAGES")

          lock_changed=false
          if ! git diff --quiet HEAD -- flake.lock; then
            lock_changed=true
          fi

          {
            if [ "$lock_changed" = true ]; then
              # shellcheck disable=SC2016
              echo 'Automated `nix flake update` and local package updates.'
            else
              # shellcheck disable=SC2016
              echo 'Automated package updates via `nix-update`.'
            fi
            if [ "$carried" = true ]; then
              echo
              echo "Each run rebuilds this branch from the base plus what it already carried, then updates on top."
            fi
            echo

            if [ "$lock_changed" = true ]; then
              echo '```text'
              echo 'Flake lock file updates:'
              echo
              # shellcheck disable=SC2016
              jq -rn --slurpfile old <(git show HEAD:flake.lock) --slurpfile new flake.lock '
                def fmt: if . == null then "(none)"
                  else "\((.rev // .narHash // "?")[:12]) (\((.lastModified // 0) | todate[:10]))" end;
                $old[0].nodes as $o | $new[0].nodes as $n
                | ($o + $n) | keys[] | select(. != "root") as $k
                | select($o[$k].locked != $n[$k].locked)
                | "• \($k): \($o[$k].locked | fmt) → \($n[$k].locked | fmt)"'
              echo '```'
              echo
            fi

            echo '| Package | Before | After |'
            echo '|---|---:|---:|'
          } > "$BODY"

          rows=0
          while IFS= read -r package; do
            if git diff --quiet HEAD -- "packages/$package.nix" && [ "$lock_changed" = false ]; then
              continue
            fi
            new_version="$(nix eval --raw ".#${package}.version" --accept-flake-config)" || new_version="?"
            if [ "$new_version" != "${before[$package]:-}" ] || ! git diff --quiet HEAD -- "packages/$package.nix"; then
              # shellcheck disable=SC2016
              printf '| `%s` | `%s` | `%s` |\n' \
                "$package" "${before[$package]:-none}" "$new_version" >> "$BODY"
              rows=$((rows + 1))
            fi
          done < <(jq -r '.[]' <<< "$ALL")

          if [ "$rows" = 0 ]; then
            echo '| _none_ | | |' >> "$BODY"
          fi

          if ((${#failures[@]})); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "Failed updates:"
              # shellcheck disable=SC2016
              printf -- '- `%s`\n' "${failures[@]}"
            } >> "$BODY"
          fi

          if [ "$lock_changed" = true ]; then
            echo "title=chore: bump flake.lock" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore(pkgs): update packages" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          PACKAGE: ${{ inputs.package }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format package updates
        if: steps.update.outputs.changed == 'true'
        run: nix fmt
      - name: Create GitHub App token
        id: app-token
        if: steps.mode.outputs.mode != 'skip' && (steps.update.outputs.changed == 'true' || (!inputs.package && steps.update.outputs.failed != 'true'))
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WHITESTRAKE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHITESTRAKE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open update pull request
        if: steps.mode.outputs.mode != 'skip' && (steps.update.outputs.changed == 'true' || (!inputs.package && steps.update.outputs.failed != 'true'))
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BRANCH }}
          title: ${{ steps.update.outputs.title }}
          body-path: ${{ steps.update.outputs.body_path }}
          labels: dependencies
          commit-message: ${{ steps.update.outputs.title }}
          delete-branch: true
          sign-commits: true
      - name: Report update failures
        if: always() && steps.update.outputs.failed == 'true'
        run: exit 1
