name: "Update Packages"
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Comma-separated packages to update (leave empty for all)"
        required: false
        type: string
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC
permissions:
  contents: read
concurrency:
  group: update-packages
  queue: max
jobs:
  update-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: ./.github/actions/install-nix
      - name: Update selected packages
        id: update
        run: |
          set -euo pipefail

          if [ -n "$PACKAGE" ]; then
            # shellcheck disable=SC2016
            PACKAGES="$(jq -cn --arg package "$PACKAGE" '$package | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          else
            # shellcheck disable=SC2016
            PACKAGES="$(nix eval --json '.#updatablePackages' --accept-flake-config)"
          fi

          BODY="$RUNNER_TEMP/package-update-pr.md"
          cat > "$BODY" <<'EOF'
          Automated package updates via `nix-update`.

          | Package | Before | After |
          |---|---:|---:|
          EOF
          echo "body_path=$BODY" >> "$GITHUB_OUTPUT"
          failures=()

          while IFS= read -r package; do
            before_diff="$(git diff | git hash-object --stdin)"

            if ! old_version="$(nix eval --raw ".#${package}.version" --accept-flake-config)"; then
              failures+=("$package")
              continue
            fi

            update_args=(--flake --use-update-script)
            if [ "$package" = proxmox-mcp-plus ]; then
              context="$RUNNER_TEMP/proxmox-mcp-plus-context.json"
              if ! nix eval --json .#packages --accept-flake-config \
                --apply 'systems: builtins.mapAttrs (system: packages: let p = packages.proxmox-mcp-plus; in { version = p.version; python = (builtins.head p.dependencies).pythonModule.version; dependencies = map (d: { name = d.pname or d.name; version = d.version or null; }) p.dependencies; relax = p.pythonRelaxDeps or []; remove = p.pythonRemoveDeps or []; }) systems' \
                > "$context"; then
                failures+=("$package")
                continue
              fi
              if ! python_env="$(nix build --impure --no-link --print-out-paths --expr 'let pkgs = import (builtins.getFlake "nixpkgs").outPath { system = builtins.currentSystem; }; in pkgs.python3.withPackages (ps: [ ps.packaging ])')"; then
                failures+=("$package")
                continue
              fi
              if ! selected="$("$python_env/bin/python3" .github/scripts/select_proxmox_mcp_plus.py "$context")"; then
                failures+=("$package")
                continue
              fi
              if [ -z "$selected" ]; then
                continue
              fi
              update_args=(--flake --version "$selected")
            fi

            if nix run nixpkgs#nix-update -- "${update_args[@]}" "$package" && \
              new_version="$(nix eval --raw ".#${package}.version" --accept-flake-config)"; then
              after_diff="$(git diff | git hash-object --stdin)"

              if [ "$before_diff" != "$after_diff" ]; then
                # shellcheck disable=SC2016
                printf '| `%s` | `%s` | `%s` |\n' \
                  "$package" "$old_version" "$new_version" >> "$BODY"
              fi
            else
              failures+=("$package")
              git restore --worktree -- "packages/$package.nix"
            fi
          done < <(jq -r '.[]' <<< "$PACKAGES")

          if ((${#failures[@]})); then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "Failed updates:"
              # shellcheck disable=SC2016
              printf -- '- `%s`\n' "${failures[@]}"
            } >> "$BODY"
          fi

          if ! git diff --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PACKAGE: ${{ inputs.package }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format package updates
        if: steps.update.outputs.changed == 'true'
        run: nix fmt
      - name: Create GitHub App token
        id: app-token
        if: steps.update.outputs.changed == 'true' || (!inputs.package && steps.update.outputs.failed != 'true')
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WHITESTRAKE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHITESTRAKE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open package update pull request
        if: steps.update.outputs.changed == 'true' || (!inputs.package && steps.update.outputs.failed != 'true')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: nix-update/packages
          title: "chore(pkgs): update packages"
          body-path: ${{ steps.update.outputs.body_path }}
          labels: dependencies
          commit-message: "chore(pkgs): update packages"
          delete-branch: true
      - name: Report update failures
        if: always() && steps.update.outputs.failed == 'true'
        run: exit 1
