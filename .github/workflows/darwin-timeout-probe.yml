name: Disposable Darwin phase timeout probe
on:
  push:
    branches: [feat/ci-optimisation]
    paths: [.github/workflows/darwin-timeout-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  timeout:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-cache-select
        with:
          release-id: '384225272'
      - uses: ./.github/actions/ci-darwin-prepare
        with:
          mode: eager
      - name: Prepare a real build that exceeds its phase budget
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/timeout-flake"
          input="$(nix flake archive --json . | jq -er '.inputs.nixpkgs.path')"
          cat > "$RUNNER_TEMP/timeout-flake/flake.nix" <<EOF
          {
            inputs.nixpkgs.url = "path:$input";
            outputs = { nixpkgs, ... }: {
              packages.aarch64-darwin.default = nixpkgs.legacyPackages.aarch64-darwin.runCommand
                "ci-phase-timeout-$GITHUB_RUN_ID" { } ''
                  echo CI_TIMEOUT_BUILD_RUNNING
                  sleep 300
                  touch \$out
                '';
            };
          }
          EOF
          nix flake lock "$RUNNER_TEMP/timeout-flake"
      - name: Stop the build at the native workflow deadline
        id: timed
        timeout-minutes: 1
        continue-on-error: true
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/timeout-start"
          "$HOST_PYTHON" .github/scripts/nix_fast_build.py -- \
            /nix/var/nix/gcroots/github-ci/aarch64-darwin/nix-fast-build/bin/nix-fast-build \
            --flake "$RUNNER_TEMP/timeout-flake#packages" --systems aarch64-darwin \
            --eval-workers 1 --option builders '' --option max-jobs auto
      - name: Verify timeout and clean detachment
        if: always()
        env:
          TIMED_OUTCOME: ${{ steps.timed.outcome }}
        run: |
          set -euo pipefail
          [ "$TIMED_OUTCOME" = failure ]
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/timeout-start") ))
          [ "$elapsed" -ge 55 ] && [ "$elapsed" -lt 120 ]
          "$HOST_PYTHON" .github/scripts/ci_darwin.py cleanup --state "$RUNNER_TEMP/darwin"
          [ ! -e "$RUNNER_TEMP/darwin/mounted" ]
          echo "CI_PHASE_TIMEOUT_VERIFIED elapsedSeconds=$elapsed detached=true"
