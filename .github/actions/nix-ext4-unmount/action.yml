name: "Unmount ext4 Nix root"
description: "Unmount an ext4-backed /nix image if it is still mounted."

inputs:
  system:
    description: "Nix system label for telemetry."
    required: true

runs:
  using: "composite"
  steps:
    - name: Unmount ext4 Nix image
      shell: bash
      run: |
        set -euo pipefail

        if mountpoint -q /nix; then
          sync
          started="$SECONDS"
          sudo umount /nix || sudo umount -l /nix
          duration="$((SECONDS - started))"
          echo "NIX_ROOT_IMAGE_UNMOUNTED system=${{ inputs.system }} path=${NIX_ROOT_IMAGE:-} mountPoint=/nix durationSeconds=$duration"
        fi
