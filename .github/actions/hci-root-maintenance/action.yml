name: "HCI root maintenance"
description: "Root and prune HCI ready targets and persisted agent tools before cache packing."

inputs:
  ready-target-attr:
    description: "Nix attribute for the ready target to root."
    required: true
  ready-target-name:
    description: "Name to use for the ready target gcroot."
    required: true
  keep-revisions:
    description: "Number of recent revision roots to keep, including the current revision."
    required: false
    default: "3"
  system:
    description: "Nix system label for telemetry and gcroot placement."
    required: true
  tools-root-dir:
    description: "Directory that keeps persisted supervisor tool roots."
    required: false
    default: "/nix/var/nix/gcroots/hci-agent-supervisor/tools"

runs:
  using: "composite"
  steps:
    - name: Maintain HCI agent cache roots
      shell: bash
      env:
        HCI_AGENT_GCROOT_KEEP_REVISIONS: ${{ inputs.keep-revisions }}
        HCI_AGENT_READY_TARGET_ATTR: ${{ inputs.ready-target-attr }}
        HCI_AGENT_READY_TARGET_NAME: ${{ inputs.ready-target-name }}
        HCI_AGENT_SYSTEM: ${{ inputs.system }}
        HCI_AGENT_TOOLS_GCROOT_DIR: ${{ inputs.tools-root-dir }}
      run: |
        set -euo pipefail

        log() {
          printf '%s\n' "$*" >&2
        }

        require_positive_integer() {
          local name="$1"
          local value="${!name:-}"

          if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
            log "ERROR: $name must be a positive integer, got: $value"
            exit 1
          fi
        }

        ensure_replaceable_symlink() {
          local path="$1"

          if { [ -e "$path" ] || [ -L "$path" ]; } && [ ! -L "$path" ]; then
            log "ERROR: refusing to replace non-symlink path: $path"
            return 1
          fi
        }

        validate_path_part() {
          local description="$1"
          local value="$2"

          case "$value" in
            "" | */* | *..* | *[!A-Za-z0-9._-]*)
              log "ERROR: unsafe $description for gcroot path: $value"
              return 1
              ;;
          esac
        }

        root_ready_target() {
          local out_path rev_dir root_dir target_link

          out_path="$(nix eval --accept-flake-config --raw "$HCI_AGENT_READY_TARGET_ATTR.outPath")"
          root_dir="/nix/var/nix/gcroots/hci-agent-supervisor/$HCI_AGENT_SYSTEM"
          rev_dir="$root_dir/rev-$GITHUB_SHA"
          target_link="$rev_dir/$HCI_AGENT_READY_TARGET_NAME"

          mkdir -p "$rev_dir"
          ensure_replaceable_symlink "$target_link"

          if nix path-info "$out_path" >/dev/null 2>&1; then
            ln -sfn "$out_path" "$target_link"
            echo "HCI_AGENT_READY_TARGET_ROOTED system=$HCI_AGENT_SYSTEM name=$HCI_AGENT_READY_TARGET_NAME outPath=$out_path gcroot=$target_link source=local"
            return 0
          fi

          nix build \
            --accept-flake-config \
            --option max-jobs 0 \
            --out-link "$target_link" \
            "$HCI_AGENT_READY_TARGET_ATTR"
          echo "HCI_AGENT_READY_TARGET_ROOTED system=$HCI_AGENT_SYSTEM name=$HCI_AGENT_READY_TARGET_NAME outPath=$out_path gcroot=$target_link source=substitute"
        }

        promote_revision_roots() {
          local current_link master_link rev_dir root_dir

          root_dir="/nix/var/nix/gcroots/hci-agent-supervisor/$HCI_AGENT_SYSTEM"
          rev_dir="$root_dir/rev-$GITHUB_SHA"
          current_link="$root_dir/current"
          master_link="$root_dir/master"

          ensure_replaceable_symlink "$current_link"
          (cd "$root_dir" && ln -sfn "$(basename "$rev_dir")" current)
          echo "HCI_AGENT_GCROOT_CURRENT system=$HCI_AGENT_SYSTEM gcroot=$current_link target=$(basename "$rev_dir")"

          if [ "${GITHUB_REF:-}" = "refs/heads/master" ]; then
            ensure_replaceable_symlink "$master_link"
            (cd "$root_dir" && ln -sfn "$(basename "$rev_dir")" master)
            echo "HCI_AGENT_GCROOT_MASTER system=$HCI_AGENT_SYSTEM gcroot=$master_link target=$(basename "$rev_dir")"
          fi
        }

        prune_old_revision_roots() {
          local count=0
          local keep_previous
          local master_link
          local master_rev_dir
          local master_target
          local root_dir
          local rev_dir
          local stale_dir

          require_positive_integer HCI_AGENT_GCROOT_KEEP_REVISIONS

          root_dir="/nix/var/nix/gcroots/hci-agent-supervisor/$HCI_AGENT_SYSTEM"
          master_link="$root_dir/master"

          ensure_replaceable_symlink "$master_link"

          if [ -L "$master_link" ]; then
            master_target="$(readlink "$master_link")"
            case "$master_target" in
              rev-*)
                master_rev_dir="$root_dir/$master_target"
                ;;
            esac
          fi

          keep_previous=$((HCI_AGENT_GCROOT_KEEP_REVISIONS - 1))

          while IFS= read -r stale_dir; do
            if [ "$stale_dir" = "$root_dir/rev-$GITHUB_SHA" ] \
              || { [ -n "${master_rev_dir:-}" ] && [ "$stale_dir" = "$master_rev_dir" ]; }; then
              continue
            fi

            count=$((count + 1))
            if [ "$count" -le "$keep_previous" ]; then
              continue
            fi

            case "$stale_dir" in
              "$root_dir"/rev-*)
                echo "HCI_AGENT_GCROOT_PRUNE system=$HCI_AGENT_SYSTEM gcroot=$stale_dir"
                rm -rf -- "$stale_dir"
                ;;
              *)
                log "ERROR: refusing to prune unexpected path: $stale_dir"
                return 1
                ;;
            esac
          done < <(
            for rev_dir in "$root_dir"/rev-*; do
              [ -d "$rev_dir" ] || continue
              case "$(uname -s)" in
                Darwin)
                  printf '%s\t%s\n' "$(stat -f '%m' "$rev_dir")" "$rev_dir"
                  ;;
                *)
                  printf '%s\t%s\n' "$(stat -c '%Y' "$rev_dir")" "$rev_dir"
                  ;;
              esac
            done | sort -rn | cut -f2-
          )
        }

        remove_legacy_agent_roots() {
          local legacy_root="/nix/var/nix/gcroots/hci-darwin-agent"

          if [ -L "$legacy_root" ]; then
            echo "HCI_AGENT_LEGACY_GCROOT_PRUNE gcroot=$legacy_root"
            rm -f -- "$legacy_root"
            return 0
          fi

          if [ -d "$legacy_root" ]; then
            echo "HCI_AGENT_LEGACY_GCROOT_PRUNE gcroot=$legacy_root"
            rm -rf -- "$legacy_root"
            return 0
          fi

          if [ -e "$legacy_root" ]; then
            log "ERROR: refusing to remove unexpected legacy gcroot path: $legacy_root"
            return 1
          fi
        }

        refresh_tool_roots() {
          local out_path
          local refresh_failed=0
          local tool
          local tool_root

          if { [ -e "$HCI_AGENT_TOOLS_GCROOT_DIR" ] || [ -L "$HCI_AGENT_TOOLS_GCROOT_DIR" ]; } \
            && [ ! -d "$HCI_AGENT_TOOLS_GCROOT_DIR" ]; then
            log "ERROR: refusing to use non-directory HCI agent tools gcroot path: $HCI_AGENT_TOOLS_GCROOT_DIR"
            return 1
          fi

          mkdir -p "$HCI_AGENT_TOOLS_GCROOT_DIR"

          for tool in curl jq hercules-ci-agent; do
            tool_root="$HCI_AGENT_TOOLS_GCROOT_DIR/$tool"
            ensure_replaceable_symlink "$tool_root"
          done

          for tool in curl jq hercules-ci-agent; do
            tool_root="$HCI_AGENT_TOOLS_GCROOT_DIR/$tool"

            if ! out_path="$(nix build \
              --accept-flake-config \
              --inputs-from . \
              --no-link \
              --print-out-paths \
              "nixpkgs#$tool")"; then
              log "WARNING: could not refresh HCI agent tool root for $tool."
              refresh_failed=1
              continue
            fi

            out_path="${out_path%%$'\n'*}"
            if [ -z "$out_path" ] || [ ! -x "$out_path/bin/$tool" ]; then
              log "WARNING: refreshed HCI agent tool $tool does not expose $out_path/bin/$tool."
              refresh_failed=1
              continue
            fi

            ln -sfn "$out_path" "$tool_root"
            echo "HCI_AGENT_TOOL_ROOTED tool=$tool gcroot=$tool_root outPath=$out_path"
          done

          if [ "$refresh_failed" -eq 1 ]; then
            log "WARNING: HCI agent tool roots are incomplete; next run may use nix shell fallback."
          fi
        }

        require_positive_integer HCI_AGENT_GCROOT_KEEP_REVISIONS
        validate_path_part "ready target name" "$HCI_AGENT_READY_TARGET_NAME"
        validate_path_part "system" "$HCI_AGENT_SYSTEM"
        validate_path_part "GitHub SHA" "$GITHUB_SHA"

        root_ready_target
        promote_revision_roots
        prune_old_revision_roots
        remove_legacy_agent_roots
        refresh_tool_roots
