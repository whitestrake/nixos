name: "Mount ext4 Nix root"
description: "Create or decompress an ext4-backed /nix image and mount it."

inputs:
  image-size:
    description: "Size to use when creating a new ext4 image."
    required: true
  system:
    description: "Nix system label for telemetry."
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        ACTION_IMAGE_SIZE: ${{ inputs.image-size }}
        ACTION_SYSTEM: ${{ inputs.system }}
      run: ${{ github.action_path }}/main.sh
