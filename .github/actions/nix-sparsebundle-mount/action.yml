name: "Mount sparsebundle Nix root"
description: "Create or attach a sparsebundle-backed /nix image and clean up in post if still mounted."

inputs:
  image-size:
    description: "Size to use when creating a new sparsebundle."
    required: true
  system:
    description: "Nix system label for telemetry."
    required: true

runs:
  using: "node24"
  main: "main.js"
  post: "post.js"
  post-if: "always()"
