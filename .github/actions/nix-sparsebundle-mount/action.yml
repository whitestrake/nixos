name: "Mount sparsebundle Nix root"
description: "Create or attach a sparsebundle-backed /nix image."

inputs:
  image-size:
    description: "Size to use when creating a new sparsebundle."
    required: true
  system:
    description: "Nix system label for telemetry."
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        ACTION_IMAGE_SIZE: ${{ inputs.image-size }}
        ACTION_SYSTEM: ${{ inputs.system }}
      run: bash "$GITHUB_ACTION_PATH/main.sh"
