name: "Install Nix"
description: "Install Nix with this repository's GitHub Actions defaults."

inputs:
  extra-nix-conf:
    description: "Additional nix.conf lines appended to the repository defaults."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Prepare Nix build directory
      shell: bash
      run: |
        set -euo pipefail

        sudo mkdir -p /tmp/nix-builds
        sudo chmod 1777 /tmp/nix-builds

    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_conf: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          nix-path = nixpkgs=flake:nixpkgs
          build-dir = /tmp/nix-builds
          connect-timeout = 10
          download-attempts = 2
          stalled-download-timeout = 60
          ${{ inputs.extra-nix-conf }}
