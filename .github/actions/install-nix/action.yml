name: "Install Nix"
description: "Activate cached Darwin Nix or install Nix with the repository defaults."

inputs:
  darwin-state:
    description: "Mounted Darwin cache state, when cached runtime activation is available."
    required: false
    default: ""
  extra-nix-conf:
    description: "Additional nix.conf lines appended to the repository defaults."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Prepare build directory and activate cached Nix
      id: prepare
      shell: /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        DARWIN_STATE: ${{ inputs.darwin-state }}
        GITHUB_ACCESS_TOKEN: ${{ github.token }}
        NIX_VERSION: "2.34.7"
        NIX_CONF: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          nix-path = nixpkgs=flake:nixpkgs
          auto-optimise-store = false
          build-dir = /tmp/nix-builds
          connect-timeout = 10
          download-attempts = 2
          stalled-download-timeout = 60
          ${{ inputs.extra-nix-conf }}
      run: |
        set -euo pipefail

        sudo mkdir -p /tmp/nix-builds
        sudo chmod 1777 /tmp/nix-builds

        {
          echo "nix-version=$NIX_VERSION"
          echo "nix-conf<<NIX_CONFIG_END"
          printenv NIX_CONF
          echo NIX_CONFIG_END
        } >> "$GITHUB_OUTPUT"
        if [ -n "$DARWIN_STATE" ]; then
          "$HOST_PYTHON" .github/scripts/ci_darwin.py activate-nix --state "$DARWIN_STATE"
        fi

    # The installer's bounded retry needs Bash >= 4.1; macOS ships 3.2.
    - name: Provide Bash 5 for the Nix installer
      if: runner.os == 'macOS' && steps.prepare.outputs.activated != 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        brew list bash >/dev/null 2>&1 || brew install bash
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: Install Nix when no compatible cached runtime is available
      if: steps.prepare.outputs.activated != 'true'
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_version: ${{ steps.prepare.outputs.nix-version }}
        nix_conf: ${{ steps.prepare.outputs.nix-conf }}
