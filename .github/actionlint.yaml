self-hosted-runner:
  labels:
    - namespace-profile-aarch64-darwin
    - namespace-profile-aarch64-darwin-no-cache

config-variables: null
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # Pending actionlint support for GitHub Actions concurrency.queue.
      - 'unexpected key "queue" for "concurrency" section'
      # Pending rhysd/actionlint#652 for stale actions/create-github-app-token@v3 metadata.
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
